<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="rw1" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="rw2" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="880" height="580" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">RS485 接線:USART + 收發器,半雙工要自己切方向</text>
  <text x="440" y="46" text-anchor="middle" font-size="12.5" fill="#6B7280">RS485 沒有自己的協議,只是把 UART 訊號變成差分電平的電氣標準</text>

  <!-- STM32F407 -->
  <rect x="40" y="90" width="200" height="190" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="140" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">STM32F407</text>
  <text x="55" y="165" font-size="12" fill="#1E3A8A">USART_TX</text>
  <text x="55" y="205" font-size="12" fill="#1E3A8A">USART_RX</text>
  <text x="55" y="245" font-size="12" fill="#1E3A8A">DE 控制腳</text>

  <!-- RS485 transceiver -->
  <rect x="310" y="90" width="210" height="190" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="415" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">RS485 收發器</text>
  <text x="415" y="130" text-anchor="middle" font-size="10.5" fill="#6B7280">(MAX3485)</text>
  <text x="325" y="165" font-size="12" fill="#9A3412">DI</text>
  <text x="325" y="205" font-size="12" fill="#9A3412">RO</text>
  <text x="325" y="245" font-size="12" fill="#9A3412">DE/RE</text>
  <text x="365" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">A</text>
  <text x="465" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">B</text>

  <!-- arrows STM32 <-> transceiver -->
  <line x1="240" y1="160" x2="308" y2="160" stroke="#F97316" stroke-width="2.2" marker-end="url(#rw1)"/>
  <line x1="308" y1="200" x2="240" y2="200" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#rw2)"/>
  <line x1="240" y1="240" x2="308" y2="240" stroke="#F97316" stroke-width="2.2" marker-end="url(#rw1)"/>

  <!-- A/B drop to bus -->
  <line x1="365" y1="280" x2="365" y2="350" stroke="#10B981" stroke-width="2.2"/>
  <line x1="465" y1="280" x2="465" y2="373" stroke="#059669" stroke-width="2.2"/>

  <!-- bus lines -->
  <line x1="90" y1="350" x2="790" y2="350" stroke="#10B981" stroke-width="3"/>
  <line x1="90" y1="373" x2="790" y2="373" stroke="#059669" stroke-width="3"/>
  <text x="105" y="344" font-size="10.5" font-weight="700" fill="#065F46">A</text>
  <text x="105" y="390" font-size="10.5" font-weight="700" fill="#065F46">B</text>

  <!-- terminators -->
  <rect x="82" y="350" width="16" height="23" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="60" y="365" text-anchor="end" font-size="10.5" fill="#9A3412">120Ω</text>
  <rect x="782" y="350" width="16" height="23" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="806" y="365" text-anchor="start" font-size="10.5" fill="#9A3412">120Ω</text>

  <!-- master node label -->
  <rect x="340" y="386" width="150" height="22" rx="11" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="415" y="401" text-anchor="middle" font-size="10.5" fill="#065F46">master:STM32(本例)</text>

  <!-- other slave nodes (generic) -->
  <line x1="640" y1="373" x2="640" y2="410" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="565" y="410" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="640" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">…其他 slave 節點</text>
  <text x="640" y="451" text-anchor="middle" font-size="10.5" fill="#9CA3AF">Modbus RTU 輪詢</text>

  <!-- DE/RE callout: the key difference vs CAN -->
  <rect x="60" y="486" width="760" height="76" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="440" y="510" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9A3412">關鍵差異:DE/RE 控制腳——半雙工要自己切換收發方向</text>
  <text x="440" y="531" text-anchor="middle" font-size="11.5" fill="#9A3412">發送前拉高(驅動模式)、發完拉低(接收模式);STM32 USART 的硬體 DE 功能可自動切,不必手動 GPIO</text>
  <text x="440" y="550" text-anchor="middle" font-size="11.5" fill="#9A3412">CAN 沒有這個腳位——可同時收發,由硬體仲裁決定勝負</text>
</svg>
