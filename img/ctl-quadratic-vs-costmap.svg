  <circle cx="608" cy="249" r="5" fill="#B45309"/>
  <text x="618" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">全域最小</text>
  <text x="620" y="296" text-anchor="middle" font-size="11" fill="#374151">不可微(碰撞是階梯)、非凸、多個底</text>
  <text x="620" y="313" text-anchor="middle" font-size="11" fill="#374151">→ 求導這條路走不通</text>
  <text x="620" y="336" text-anchor="middle" font-size="11" fill="#6B7280">障礙物、膨脹層、footprint 碰撞檢查,</text>
  <text x="620" y="352" text-anchor="middle" font-size="11" fill="#6B7280">全都寫不進一個二次型</text>

