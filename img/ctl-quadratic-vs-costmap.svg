  <defs><marker id="qc-a" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker></defs>
  <rect width="840" height="372" fill="#ffffff"/>
  <text x="420" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">LQR 的閉式解,是用「代價必須長成碗」換來的</text>
  <text x="420" y="47" text-anchor="middle" font-size="12" fill="#6B7280">而真實的代價地圖不長那個樣子——這就是 MPPI 存在的理由</text>

  <text x="200" y="78" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">LQR 假設的代價:xᵀQx</text>
  <line x1="60" y1="250" x2="348" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#qc-a)"/>
  <line x1="60" y1="250" x2="60" y2="92" stroke="#374151" stroke-width="1.5" marker-end="url(#qc-a)"/>
  <text x="52" y="100" text-anchor="end" font-size="11" fill="#6B7280">代價</text>
