  <text x="200" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">唯一最小</text>
  <text x="200" y="296" text-anchor="middle" font-size="11" fill="#374151">處處可微、凸、只有一個底</text>
  <text x="200" y="313" text-anchor="middle" font-size="11" fill="#374151">→ 求導設零就有解析解 u = −Kx</text>
  <text x="200" y="336" text-anchor="middle" font-size="11" fill="#6B7280">代價是「離目標多遠」的平方,</text>
  <text x="200" y="352" text-anchor="middle" font-size="11" fill="#6B7280">但地上有什麼東西,它一無所知</text>

  <text x="620" y="78" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">真實的代價地圖</text>
