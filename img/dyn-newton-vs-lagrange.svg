<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="nvl-b" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="nvl-r" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="nvl-g" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/></marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">同一顆單擺,兩條推導路</text>

  <!-- LEFT: Newton -->
  <text x="185" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">路徑 A:Newton(受力)</text>
  <!-- ceiling -->
  <line x1="120" y1="80" x2="240" y2="80" stroke="#374151" stroke-width="2"/>
  <path d="M126,80 l-8,-8 M146,80 l-8,-8 M166,80 l-8,-8 M186,80 l-8,-8 M206,80 l-8,-8 M226,80 l-8,-8" stroke="#9CA3AF" stroke-width="1.2"/>
  <!-- vertical dashed reference -->
  <line x1="180" y1="80" x2="180" y2="215" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- rod: pivot (180,80), theta=32deg, len 125 -> bob (246,186) -->
  <line x1="180" y1="80" x2="246" y2="186" stroke="#374151" stroke-width="2.5"/>
  <circle cx="180" cy="80" r="4" fill="#374151"/>
  <circle cx="246" cy="186" r="11" fill="#6B7280"/>
  <text x="246" y="190" text-anchor="middle" font-size="10.5" fill="#ffffff">m</text>
  <!-- theta arc -->
  <path d="M180,120 A40 40 0 0 0 201,114" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  <text x="196" y="134" font-size="13" font-weight="700" fill="#1E40AF">θ</text>
  <!-- gravity -->
  <line x1="246" y1="197" x2="246" y2="245" stroke="#6B7280" stroke-width="2" marker-end="url(#nvl-g)"/>
  <text x="254" y="240" font-size="12" fill="#6B7280">mg</text>
  <!-- tension (unknown) -->
  <line x1="240" y1="176" x2="204" y2="119" stroke="#DC2626" stroke-width="2.2" marker-end="url(#nvl-r)"/>
  <text x="130" y="150" font-size="12" font-weight="700" fill="#DC2626">張力 F_T = ?</text>
  <text x="130" y="166" font-size="10.5" fill="#DC2626">(未知的約束內力)</text>
  <text x="185" y="272" text-anchor="middle" font-size="11.5" fill="#6B7280">要對兩個方向分解、再用「只能走圓弧」消去 F_T</text>

  <!-- divider -->
  <line x1="380" y1="48" x2="380" y2="252" stroke="#E5E7EB"/>

  <!-- RIGHT: Lagrange -->
  <text x="570" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">路徑 B:Lagrange(能量)</text>
  <line x1="470" y1="80" x2="570" y2="80" stroke="#374151" stroke-width="2"/>
  <path d="M476,80 l-8,-8 M496,80 l-8,-8 M516,80 l-8,-8 M536,80 l-8,-8 M556,80 l-8,-8" stroke="#9CA3AF" stroke-width="1.2"/>
  <line x1="520" y1="80" x2="573" y2="165" stroke="#374151" stroke-width="2.5"/>
  <circle cx="520" cy="80" r="4" fill="#374151"/>
  <circle cx="573" cy="165" r="10" fill="#6B7280"/>
  <text x="573" y="169" text-anchor="middle" font-size="10" fill="#ffffff">m</text>
  <text x="612" y="110" font-size="12.5" fill="#1E40AF">動能 T = ½ml²θ̇²</text>
  <text x="612" y="132" font-size="12.5" fill="#065F46">位能 V = mgl(1−cosθ)</text>
  <text x="612" y="158" font-size="12.5" font-weight="700" fill="#374151">L = T − V</text>
  <text x="570" y="205" text-anchor="middle" font-size="11.5" fill="#6B7280">只要會算能量;張力不做功,</text>
  <text x="570" y="222" text-anchor="middle" font-size="11.5" fill="#6B7280">從頭到尾不會出現</text>

  <!-- BOTTOM: same result -->
  <line x1="185" y1="282" x2="330" y2="300" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#nvl-g)"/>
  <line x1="570" y1="234" x2="440" y2="298" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#nvl-g)"/>
  <rect x="322" y="286" width="216" height="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="430" y="307" text-anchor="middle" font-size="15" font-weight="700" fill="#1E40AF">ml²·θ̈ + mgl·sinθ = τ</text>
</svg>
