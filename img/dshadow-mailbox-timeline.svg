<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="440" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#1F2937">命令一筆一筆送:命令流斷了,車怎麼停</text>
  <text x="30" y="56" font-size="12.5" fill="#6B7280">0.2 m/s 直行中切斷命令流。車速曲線是示意:依實測的察覺時間,加上板內模型牽引的一階滯後 0.25 s 畫出</text>

  <!-- row labels -->
  <text x="20" y="100" font-size="13" font-weight="700" fill="#1E3A8A">上位送命令</text>
  <text x="20" y="160" font-size="13" font-weight="700" fill="#1F2937">韌體命令信箱</text>
  <text x="20" y="280" font-size="13" font-weight="700" fill="#9A3412">車速(示意)</text>

  <!-- command ticks every 50 ms -->
  <g fill="#2563EB">
    <rect x="128" y="84" width="4" height="22"/><rect x="152" y="84" width="4" height="22"/>
    <rect x="176" y="84" width="4" height="22"/><rect x="200" y="84" width="4" height="22"/>
    <rect x="224" y="84" width="4" height="22"/><rect x="248" y="84" width="4" height="22"/>
    <rect x="272" y="84" width="4" height="22"/>
  </g>
  <text x="200" y="76" text-anchor="middle" font-size="12" fill="#2563EB">每 50 ms 一筆</text>
  <text x="286" y="101" font-size="12.5" fill="#6B7280">← 命令流在這裡斷掉(時間 0)</text>

  <!-- mailbox -->
  <rect x="130" y="140" width="144" height="28" rx="5" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="202" y="159" text-anchor="middle" font-size="12" fill="#1E3A8A">每來一筆就蓋掉舊的</text>
  <rect x="274" y="140" width="96" height="28" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="4 3"/>
  <text x="322" y="159" text-anchor="middle" font-size="12" fill="#6B7280">最後一筆在變舊</text>

  <!-- timeout line t=0.2 -> x=370 -->
  <line x1="370" y1="132" x2="370" y2="330" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="378" y="190" font-size="12.5" fill="#B91C1C">200 ms 沒有新命令</text>
  <text x="378" y="208" font-size="12.5" fill="#B91C1C">→ 切輸出</text>

  <!-- reported stop t=1.12 -> x=812 -->
  <line x1="812" y1="250" x2="812" y2="330" stroke="#374151" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="812" y="244" text-anchor="middle" font-size="12" fill="#374151">韌體回報已停(&lt; 0.01 m/s)</text>

  <!-- speed curve -->
  <text x="124" y="236" text-anchor="end" font-size="11" fill="#6B7280">0.2 m/s</text>
  <text x="124" y="324" text-anchor="end" font-size="11" fill="#6B7280">0</text>
  <path d="M130,232 H370 L394.0,248.0 L418.0,261.0 L442.0,271.7 L466.0,280.5 L490.0,287.6 L514.0,293.5 L538.0,298.3 L562.0,302.2 L586.0,305.5 L610.0,308.1 L634.0,310.2 L658.0,312.0 L682.0,313.5 L706.0,314.6 L730.0,315.6 L754.0,316.4 L778.0,317.1 L802.0,317.6 L826.0,318.0 L850.0,318.4 L874.0,318.7 L898.0,318.9 H912" stroke="#EA580C" stroke-width="2.5" fill="none"/>

  <!-- axis -->
  <line x1="130" y1="330" x2="912" y2="330" stroke="#9CA3AF"/>
  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <line x1="274" y1="326" x2="274" y2="334" stroke="#9CA3AF"/><text x="274" y="346">0</text>
    <line x1="394" y1="326" x2="394" y2="334" stroke="#9CA3AF"/><text x="394" y="346">0.25</text>
    <line x1="514" y1="326" x2="514" y2="334" stroke="#9CA3AF"/><text x="514" y="346">0.5</text>
    <line x1="634" y1="326" x2="634" y2="334" stroke="#9CA3AF"/><text x="634" y="346">0.75</text>
    <line x1="754" y1="326" x2="754" y2="334" stroke="#9CA3AF"/><text x="754" y="346">1.0</text>
    <line x1="874" y1="326" x2="874" y2="334" stroke="#9CA3AF"/><text x="874" y="346">1.25 s</text>
  </g>

  <!-- brackets -->
  <path d="M274,356 V362 H370 V356" stroke="#374151" fill="none"/>
  <text x="322" y="378" text-anchor="middle" font-size="12" fill="#374151">察覺:實測 0.21–0.30 s</text>
  <text x="322" y="394" text-anchor="middle" font-size="12" fill="#374151">這段照原速走約 4–6 cm</text>
  <path d="M370,356 V362 H812 V356" stroke="#374151" fill="none"/>
  <text x="591" y="378" text-anchor="middle" font-size="12" fill="#374151">輸出切掉後,車速依一階滯後衰減,再走約 5 cm</text>
  <text x="591" y="394" text-anchor="middle" font-size="12" fill="#374151">從斷流算起,實測 1.10–1.14 s 回報已停</text>
  <text x="30" y="424" font-size="12.5" fill="#374151">實測斷流後共多走 9.2–9.9 cm。上位主動送停止命令可省掉「等 200 ms」這段,約 0.9 s 停下、多走約 5.5 cm。</text>
</svg>
