<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="lb-o" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="lb-r" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/></marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">2D LiDAR 只看得到裝設高度那一個平面</text>
  <text x="380" y="49" text-anchor="middle" font-size="11.5" fill="#6B7280">側視圖:桌腳落在掃描平面上會被偵測到,但突出的桌面在掃描平面之上——完全看不到</text>

  <!-- travel direction -->
  <line x1="92" y1="85" x2="158" y2="85" stroke="#9CA3AF" stroke-width="2" marker-end="url(#lb-o)"/>
  <text x="125" y="76" text-anchor="middle" font-size="10" fill="#6B7280">行進方向</text>

  <!-- ground -->
  <line x1="40" y1="340" x2="720" y2="340" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="40" y="355" font-size="10" fill="#6B7280">地面</text>

  <!-- height reference -->
  <line x1="50" y1="340" x2="50" y2="237" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="45" y1="340" x2="55" y2="340" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="45" y1="237" x2="55" y2="237" stroke="#9CA3AF" stroke-width="1"/>
  <text x="38" y="290" text-anchor="middle" font-size="9.5" fill="#6B7280" transform="rotate(-90 38 290)">≈20cm</text>

  <!-- robot -->
  <rect x="70" y="250" width="90" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <circle cx="95" cy="340" r="13" fill="#1F2937"/>
  <circle cx="145" cy="340" r="13" fill="#1F2937"/>
  <rect x="97" y="228" width="36" height="18" rx="9" fill="#374151" stroke="#1F2937" stroke-width="1.2"/>
  <text x="115" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">LiDAR</text>
  <text x="115" y="217" text-anchor="middle" font-size="9.5" fill="#6B7280">(20cm 高)</text>

  <!-- scan plane -->
  <line x1="133" y1="237" x2="725" y2="237" stroke="#F97316" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#lb-o)"/>
  <text x="430" y="228" text-anchor="middle" font-size="10.5" fill="#9A3412">掃描平面(水平線)</text>

  <!-- table -->
  <rect x="480" y="145" width="230" height="20" rx="3" fill="#A16207" stroke="#78350F" stroke-width="1.4"/>
  <rect x="600" y="165" width="16" height="175" rx="2" fill="#A16207" stroke="#78350F" stroke-width="1.2"/>
  <rect x="676" y="165" width="16" height="175" rx="2" fill="#A16207" stroke="#78350F" stroke-width="1.2"/>

  <!-- blind pocket -->
  <rect x="480" y="165" width="120" height="72" fill="#FEF2F2" fill-opacity="0.85" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 4" rx="4"/>
  <text x="540" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#991B1B">盲區</text>
  <text x="540" y="213" text-anchor="middle" font-size="9.5" fill="#991B1B">掃描平面以上,看不到</text>

  <!-- callout to overhang -->
  <text x="490" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">✗ 突出桌面</text>
  <text x="490" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">= LiDAR 盲區</text>
  <line x1="490" y1="122" x2="490" y2="141" stroke="#EF4444" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#lb-r)"/>

  <!-- detection point -->
  <circle cx="608" cy="237" r="5" fill="#10B981" stroke="#065F46" stroke-width="1"/>
  <text x="624" y="233" font-size="10.5" font-weight="700" fill="#065F46">✓ 掃到桌腳</text>

  <!-- summary -->
  <rect x="70" y="368" width="620" height="52" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="380" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">掃描平面只是一條水平線,不是整個空間——只有剛好落在這個高度的物體才看得見</text>
  <text x="380" y="408" text-anchor="middle" font-size="10.5" fill="#6B7280">只信 LiDAR costmap,會誤判「桌腳之間是空的」,直接撞上突出的桌沿</text>
</svg>
