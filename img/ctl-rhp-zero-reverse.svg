<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><marker id="rz-a" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker>
  <marker id="rz-r" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker></defs>
  <rect width="880" height="376" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">後輪轉向:車尾會先往錯的方向走</text>
  <text x="440" y="47" text-anchor="middle" font-size="12" fill="#6B7280">方向盤階躍後,後軸中心的橫向位移(兩圖的時間與位移尺度相同)</text>

  <!-- ===== 左:前進 ===== -->
  <text x="240" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#DC2626">前進(v &gt; 0):零點在 s = v/L &gt; 0</text>
  <line x1="90" y1="160" x2="424" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#rz-a)"/>
  <line x1="90" y1="292" x2="90" y2="96" stroke="#374151" stroke-width="1.5" marker-end="url(#rz-a)"/>
  <text x="430" y="176" font-size="11" fill="#6B7280">t</text>
  <text x="82" y="104" text-anchor="end" font-size="11" fill="#6B7280">y_R</text>
  <path d="M90.0,160.0 L94.0,157.3 L98.0,154.7 L102.0,152.1 L106.0,149.7 L110.0,147.3 L114.0,145.0 L118.0,142.9 L122.0,140.8 L126.0,138.7 L130.0,136.8 L134.0,134.9 L138.0,133.2 L142.0,131.5 L146.0,129.9 L150.0,128.4 L154.0,127.0 L158.0,125.7 L162.0,124.4 L166.0,123.3 L170.0,122.2 L174.0,121.2 L178.0,120.3 L182.0,119.5 L186.0,118.8 L190.0,118.1 L194.0,117.5 L198.0,117.1 L202.0,116.7 L206.0,116.4 L210.0,116.2 L214.0,116.0 L218.0,116.0 L222.0,116.0 L226.0,116.2 L230.0,116.4 L234.0,116.7 L238.0,117.1 L242.0,117.5 L246.0,118.1 L250.0,118.8 L254.0,119.5 L258.0,120.3 L262.0,121.2 L266.0,122.2 L270.0,123.3 L274.0,124.4 L278.0,125.7 L282.0,127.0 L286.0,128.4 L290.0,129.9 L294.0,131.5 L298.0,133.2 L302.0,134.9 L306.0,136.8 L310.0,138.7 L314.0,140.8 L318.0,142.9 L322.0,145.0 L326.0,147.3 L330.0,149.7 L334.0,152.1 L338.0,154.7 L342.0,157.3 L346.0,160.0 L350.0,162.8 L354.0,165.7 L358.0,168.6 L362.0,171.7 L366.0,174.8 L370.0,178.0 L374.0,181.4 L378.0,184.8 L382.0,188.2 L386.0,191.8 L390.0,195.4 L394.0,199.2 L398.0,203.0 L402.0,206.9 L406.0,210.9 L410.0,215.0" fill="none" stroke="#DC2626" stroke-width="2.6"/>
  <circle cx="218" cy="116" r="4.5" fill="#DC2626"/>
  <line x1="346" y1="160" x2="346" y2="160" stroke="none"/>
  <circle cx="346" cy="160" r="4" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="230" y="108" font-size="11.5" font-weight="700" fill="#DC2626">先往指令方向走</text>
  <text x="356" y="152" font-size="11" fill="#DC2626">折返穿零</text>
  <text x="330" y="230" font-size="11.5" font-weight="700" fill="#DC2626">再往反方向</text>
  <text x="240" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">非最小相位(RHP zero)</text>
  <text x="240" y="334" text-anchor="middle" font-size="11" fill="#6B7280">閉迴路頻寬被限制在 v/L 的量級</text>
  <text x="240" y="351" text-anchor="middle" font-size="11" fill="#6B7280">車速越快,可用頻寬越低 → 越難精確跟線</text>

  <!-- ===== 右:倒車 ===== -->
  <text x="650" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">倒車(v &lt; 0):零點移到 s = v/L &lt; 0</text>
  <line x1="500" y1="160" x2="834" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#rz-a)"/>
  <line x1="500" y1="292" x2="500" y2="96" stroke="#374151" stroke-width="1.5" marker-end="url(#rz-a)"/>
  <text x="840" y="176" font-size="11" fill="#6B7280">t</text>
  <text x="492" y="104" text-anchor="end" font-size="11" fill="#6B7280">y_R</text>
  <path d="M500.0,160.0 L504.0,162.8 L508.0,165.7 L512.0,168.6 L516.0,171.7 L520.0,174.8 L524.0,178.0 L528.0,181.4 L532.0,184.8 L536.0,188.2 L540.0,191.8 L544.0,195.4 L548.0,199.2 L552.0,203.0 L556.0,206.9 L560.0,210.9 L564.0,215.0 L568.0,219.2 L572.0,223.4 L576.0,227.8 L580.0,232.2 L584.0,236.7 L588.0,241.3 L592.0,246.0 L596.0,250.8 L600.0,255.6 L604.0,260.5" fill="none" stroke="#047857" stroke-width="2.6"/>
  <line x1="628" y1="292" x2="642" y2="308" stroke="#047857" stroke-width="2.6" marker-end="url(#rz-a)"/>
  <text x="656" y="306" font-size="11" fill="#047857">(繼續同方向)</text>
  <text x="560" y="126" font-size="11.5" font-weight="700" fill="#047857">從第一刻起就往正確方向</text>
  <text x="560" y="143" font-size="11" fill="#047857">沒有「先往錯方向」那一段</text>
  <text x="650" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">最小相位,頻寬限制消失</text>
  <text x="650" y="334" text-anchor="middle" font-size="11" fill="#6B7280">貨叉朝後推行時,舵輪端在前進方向的前面</text>
  <text x="650" y="351" text-anchor="middle" font-size="11" fill="#6B7280">幾何上就是一台標準的前輪轉向車</text>

  <line x1="462" y1="66" x2="462" y2="358" stroke="#E5E7EB" stroke-width="1.4"/>
</svg>
