<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF"/></marker></defs>
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">分工:Nav2 只規劃,車上控制器 60 Hz 追蹤</text>

  <!-- Nav2 planner -->
  <rect x="24" y="60" width="230" height="150" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="139" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">Nav2(只留規劃)</text>
  <text x="139" y="108" text-anchor="middle" font-size="11.5" fill="#1F2937">planner_server</text>
  <text x="139" y="126" text-anchor="middle" font-size="11.5" fill="#1F2937">global costmap</text>
  <text x="139" y="144" text-anchor="middle" font-size="11.5" fill="#1F2937">lifecycle manager</text>
  <text x="139" y="172" text-anchor="middle" font-size="10.5" fill="#6B7280">不起 controller / bt / smoother</text>
  <text x="139" y="188" text-anchor="middle" font-size="10.5" fill="#6B7280">NavFn 折線 或 Smac Hybrid-A* 弧</text>

  <!-- executor -->
  <rect x="315" y="60" width="230" height="150" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="430" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065F46">執行器(Isaac 內,Python)</text>
  <text x="430" y="108" text-anchor="middle" font-size="11.5" fill="#1F2937">每段呼叫一次 ComputePathToPose</text>
  <text x="430" y="126" text-anchor="middle" font-size="11.5" fill="#1F2937">Douglas-Peucker 簡化路徑</text>
  <text x="430" y="144" text-anchor="middle" font-size="11.5" fill="#1F2937">每物理步:送真值、等回覆</text>
  <text x="430" y="162" text-anchor="middle" font-size="11.5" fill="#1F2937">(v, ω) → δ = atan2(Lω, v) → 輪子</text>
  <text x="430" y="188" text-anchor="middle" font-size="10.5" fill="#6B7280">物理 60 Hz,逾時 5 ms 沿用上一筆</text>

  <!-- controller -->
  <rect x="606" y="60" width="230" height="150" rx="9" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="721" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">車上控制器(Go / C++)</text>
  <text x="721" y="108" text-anchor="middle" font-size="11.5" fill="#1F2937">獨立行程,靜態二進位</text>
  <text x="721" y="126" text-anchor="middle" font-size="11.5" fill="#1F2937">誤差 (e_y, e_θ) 對目前路徑段</text>
  <text x="721" y="144" text-anchor="middle" font-size="11.5" fill="#1F2937">PID | LQR | MPC 三選一</text>
  <text x="721" y="162" text-anchor="middle" font-size="11.5" fill="#1F2937">角落:turn(原地轉)/ arc</text>
  <text x="721" y="188" text-anchor="middle" font-size="10.5" fill="#6B7280">與執行器鎖步,兩版輸入完全相同</text>

  <!-- arrows between boxes -->
  <line x1="254" y1="120" x2="313" y2="120" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="284" y="112" text-anchor="middle" font-size="10" fill="#6B7280">Path</text>
  <line x1="313" y1="150" x2="256" y2="150" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="284" y="166" text-anchor="middle" font-size="10" fill="#6B7280">action 請求</text>

  <line x1="545" y1="105" x2="604" y2="105" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="575" y="97" text-anchor="middle" font-size="10" fill="#6B7280">path / state</text>
  <line x1="604" y1="150" x2="547" y2="150" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="575" y="166" text-anchor="middle" font-size="10" fill="#6B7280">cmd (v, ω)</text>
  <text x="575" y="180" text-anchor="middle" font-size="10" fill="#6B7280">UDP,每步一來一回</text>

  <!-- bottom: what each side is responsible for -->
  <rect x="24" y="240" width="812" height="136" rx="9" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="40" y="264" font-size="12.5" font-weight="700" fill="#374151">Nav2 全套為什麼差那麼多——中間缺的那一層,現在由控制器補上</text>
  <text x="40" y="290" font-size="11.5" fill="#1F2937">目標定義:容差 0.5 m、朝向不看  →  1 cm、0.5°</text>
  <text x="40" y="310" font-size="11.5" fill="#1F2937">參考路徑:格子折線 / 運動基元弧  →  簡化後的折點或弧,曲率當前饋</text>
  <text x="40" y="330" font-size="11.5" fill="#1F2937">角落策略:沒有(不停、切角)  →  折角 &gt; 30° 原地轉,否則走弧</text>
  <text x="40" y="350" font-size="11.5" fill="#1F2937">資訊鏈路:TF → costmap → BT → controller → smoother → DDS,20 Hz  →  真值鎖步,60 Hz</text>
  <text x="40" y="370" font-size="10.5" fill="#6B7280">量到:全套 Nav2 最好 59 s、外擴 0.65 m、直線偏 0.16 m;車上控制器 120 s、直線 1.4 cm、原地轉漂移 8 mm、終點 1 mm</text>
</svg>
