<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="crArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="900" height="395" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">認證角色分工:誰定標準、誰輔導、誰檢測、誰發證</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6B7280">證書的公信力來自制度分工,不是來自誰有名</text>

  <!-- 標準制定者(橫跨整排,說明它在流程之外) -->
  <rect x="20" y="64" width="860" height="50" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="38" y="85" font-size="12.5" font-weight="700" fill="#374151">標準制定 / 推動者</text>
  <text x="38" y="103" font-size="10" fill="#6B7280">SEMI(E187)、ISO(3691 系列)、ISO/IEC 17025 · 17065、NIST CSF</text>
  <text x="862" y="85" text-anchor="end" font-size="10.5" fill="#374151">定義「要看什麼」與「誰能測、誰能發證」</text>
  <text x="862" y="103" text-anchor="end" font-size="10.5" font-weight="700" fill="#B45309">但不核發你的那張證書</text>

  <!-- 送測分界 -->
  <line x1="440" y1="128" x2="440" y2="318" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4,4"/>

  <!-- Box 1:公司 -->
  <rect x="20" y="140" width="192" height="170" rx="10" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="116" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">公司 / 設備商</text>
  <text x="116" y="184" text-anchor="middle" font-size="9.5" fill="#6B7280">想證明設備符合某標準</text>
  <line x1="36" y1="194" x2="196" y2="194" stroke="#E5E7EB"/>
  <text x="36" y="216" font-size="9.5" fill="#374151">・界定範圍</text>
  <text x="36" y="234" font-size="9.5" fill="#374151">・型號、版本、場域</text>
  <text x="36" y="252" font-size="9.5" fill="#374151">・客戶指定的要求</text>
  <rect x="32" y="272" width="168" height="22" rx="11" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="116" y="287" text-anchor="middle" font-size="9.5" font-weight="700" fill="#374151">起點:先講清楚要證明什麼</text>

  <!-- Box 2:顧問 -->
  <rect x="236" y="140" width="192" height="170" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="332" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">顧問 / 輔導 / 評估</text>
  <text x="332" y="184" text-anchor="middle" font-size="9.5" fill="#B45309">例:管理顧問公司</text>
  <line x1="252" y1="194" x2="412" y2="194" stroke="#FED7AA"/>
  <text x="252" y="216" font-size="9.5" fill="#374151">・讀懂標準、gap analysis</text>
  <text x="252" y="234" font-size="9.5" fill="#374151">・資安 / 能力成熟度評估</text>
  <text x="252" y="252" font-size="9.5" fill="#374151">・改善 roadmap、證據清單</text>
  <rect x="248" y="272" width="168" height="22" rx="11" fill="#FFEDD5" stroke="#F97316"/>
  <text x="332" y="287" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9A3412">產出:報告與建議(非證書)</text>

  <!-- Box 3:檢測實驗室 -->
  <rect x="452" y="140" width="192" height="170" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="548" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">合格檢測實驗室</text>
  <text x="548" y="184" text-anchor="middle" font-size="9.5" fill="#2563EB">能力依 ISO/IEC 17025</text>
  <line x1="468" y1="194" x2="628" y2="194" stroke="#BFDBFE"/>
  <text x="468" y="216" font-size="9.5" fill="#374151">・依標準與制度做測試</text>
  <text x="468" y="234" font-size="9.5" fill="#374151">・方法、設備、人員可查證</text>
  <text x="468" y="252" font-size="9.5" fill="#374151">・不替你做符合性判定</text>
  <rect x="464" y="272" width="168" height="22" rx="11" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="548" y="287" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E3A8A">產出:測試報告</text>

  <!-- Box 4:驗證發證 -->
  <rect x="668" y="140" width="192" height="170" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <text x="764" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">驗證 / 發證機構</text>
  <text x="764" y="184" text-anchor="middle" font-size="9.5" fill="#059669">公正性依 ISO/IEC 17065</text>
  <line x1="684" y1="194" x2="844" y2="194" stroke="#A7F3D0"/>
  <text x="684" y="216" font-size="9.5" fill="#374151">・審查測試結果與符合性</text>
  <text x="684" y="234" font-size="9.5" fill="#374151">・做驗證決定</text>
  <text x="684" y="252" font-size="9.5" fill="#374151">・核發、維持、撤銷證書</text>
  <rect x="680" y="272" width="168" height="22" rx="11" fill="#D1FAE5" stroke="#10B981"/>
  <text x="764" y="287" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065F46">產出:正式證書</text>

  <!-- 箭頭 -->
  <line x1="214" y1="225" x2="230" y2="225" stroke="#6B7280" stroke-width="1.8" marker-end="url(#crArr)"/>
  <line x1="430" y1="225" x2="446" y2="225" stroke="#6B7280" stroke-width="1.8" marker-end="url(#crArr)"/>
  <line x1="646" y1="225" x2="662" y2="225" stroke="#6B7280" stroke-width="1.8" marker-end="url(#crArr)"/>

  <!-- 兩段括號 -->
  <path d="M24,318 L24,326 L424,326 L424,318" fill="none" stroke="#F97316" stroke-width="1.4"/>
  <text x="224" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">準備好「去被測」</text>
  <path d="M456,318 L456,326 L856,326 L856,318" fill="none" stroke="#10B981" stroke-width="1.4"/>
  <text x="656" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">制度指定的第三方檢測與發證</text>
  <text x="440" y="343" text-anchor="middle" font-size="9.5" fill="#6B7280">送測分界</text>

  <text x="450" y="376" text-anchor="middle" font-size="11.5" fill="#374151">顧問報告 ≠ 證書;標準制定者 ≠ 發證機構——手上拿到的是哪一段,講清楚就不會誤會</text>
</svg>
