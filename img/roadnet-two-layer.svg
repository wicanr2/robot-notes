<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="rlArrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#F97316"/></marker>
    <marker id="rlArrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#10B981"/></marker>
  </defs>
  <rect width="900" height="425" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">兩層路網:同一個場域,兩種解析度</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6B7280">粗圖不是拿來規劃路徑的,是拿來便宜地估距離</text>

  <!-- Panel A -->
  <rect x="20" y="66" width="410" height="290" rx="10" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="225" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">細路網(節點級)</text>
  <text x="225" y="105" text-anchor="middle" font-size="9.5" fill="#6B7280">節點數幾百到幾千,車實際照它走</text>
  <g fill="#E5E7EB">
    <rect x="90" y="155" width="115" height="50" rx="3"/><rect x="245" y="155" width="115" height="50" rx="3"/>
    <rect x="90" y="235" width="115" height="50" rx="3"/><rect x="245" y="235" width="115" height="50" rx="3"/>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.2">
    <line x1="70" y1="140" x2="380" y2="140"/><line x1="70" y1="220" x2="380" y2="220"/><line x1="70" y1="300" x2="380" y2="300"/>
    <line x1="70" y1="140" x2="70" y2="300"/><line x1="225" y1="140" x2="225" y2="300"/><line x1="380" y1="140" x2="380" y2="300"/>
  </g>
  <g fill="#6B7280">
<circle cx="70" cy="140" r="3.2"/><circle cx="109" cy="140" r="3.2"/><circle cx="148" cy="140" r="3.2"/><circle cx="187" cy="140" r="3.2"/><circle cx="225" cy="140" r="3.2"/><circle cx="264" cy="140" r="3.2"/><circle cx="303" cy="140" r="3.2"/><circle cx="342" cy="140" r="3.2"/><circle cx="380" cy="140" r="3.2"/><circle cx="70" cy="220" r="3.2"/><circle cx="109" cy="220" r="3.2"/><circle cx="148" cy="220" r="3.2"/><circle cx="187" cy="220" r="3.2"/><circle cx="225" cy="220" r="3.2"/><circle cx="264" cy="220" r="3.2"/><circle cx="303" cy="220" r="3.2"/><circle cx="342" cy="220" r="3.2"/><circle cx="380" cy="220" r="3.2"/><circle cx="70" cy="300" r="3.2"/><circle cx="109" cy="300" r="3.2"/><circle cx="148" cy="300" r="3.2"/><circle cx="187" cy="300" r="3.2"/><circle cx="225" cy="300" r="3.2"/><circle cx="264" cy="300" r="3.2"/><circle cx="303" cy="300" r="3.2"/><circle cx="342" cy="300" r="3.2"/><circle cx="380" cy="300" r="3.2"/><circle cx="70" cy="180" r="3.2"/><circle cx="225" cy="180" r="3.2"/><circle cx="380" cy="180" r="3.2"/><circle cx="70" cy="260" r="3.2"/><circle cx="225" cy="260" r="3.2"/><circle cx="380" cy="260" r="3.2"/>

  </g>
  <line x1="70" y1="300" x2="380" y2="140" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="245" y="243" text-anchor="middle" font-size="9" fill="#6B7280" transform="rotate(-27 245 243)">直線距離:穿牆而過 → 低估</text>
  <path d="M70,300 L70,140 L380,140" fill="none" stroke="#F97316" stroke-width="2.6" marker-end="url(#rlArrO)"/>
  <circle cx="70" cy="300" r="6" fill="#1F2937"/><text x="70" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">A</text>
  <circle cx="380" cy="140" r="6" fill="#1F2937"/><text x="396" y="132" font-size="11" font-weight="700" fill="#1F2937">B</text>
  <text x="225" y="342" text-anchor="middle" font-size="9.5" fill="#9A3412">完整 Dijkstra:準,但每個候選點都得跑一次</text>

  <!-- Panel B -->
  <rect x="470" y="66" width="410" height="290" rx="10" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="675" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">道路級粗圖(交叉口 + 道路)</text>
  <text x="675" y="105" text-anchor="middle" font-size="9.5" fill="#6B7280">節點數降到幾十,道路用多邊形描述涵蓋範圍</text>
  <g fill="#E5E7EB">
    <rect x="540" y="155" width="115" height="50" rx="3"/><rect x="695" y="155" width="115" height="50" rx="3"/>
    <rect x="540" y="235" width="115" height="50" rx="3"/><rect x="695" y="235" width="115" height="50" rx="3"/>
  </g>
  <g stroke="#93C5FD" stroke-width="15" stroke-linecap="round" opacity="0.55">
    <line x1="520" y1="140" x2="830" y2="140"/><line x1="520" y1="220" x2="830" y2="220"/><line x1="520" y1="300" x2="830" y2="300"/>
    <line x1="520" y1="140" x2="520" y2="300"/><line x1="675" y1="140" x2="675" y2="300"/><line x1="830" y1="140" x2="830" y2="300"/>
  </g>
  <path d="M520,300 L520,140 L830,140" fill="none" stroke="#10B981" stroke-width="2.6" marker-end="url(#rlArrG)"/>
  <g fill="#ffffff" stroke="#3B82F6" stroke-width="2">
    <circle cx="520" cy="140" r="8"/><circle cx="675" cy="140" r="8"/><circle cx="830" cy="140" r="8"/>
    <circle cx="520" cy="220" r="8"/><circle cx="675" cy="220" r="8"/><circle cx="830" cy="220" r="8"/>
    <circle cx="520" cy="300" r="8"/><circle cx="675" cy="300" r="8"/><circle cx="830" cy="300" r="8"/>
  </g>
  <circle cx="520" cy="300" r="6" fill="#1F2937"/><text x="520" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">A</text>
  <circle cx="830" cy="140" r="6" fill="#1F2937"/><text x="846" y="132" font-size="11" font-weight="700" fill="#1F2937">B</text>
  <text x="675" y="342" text-anchor="middle" font-size="9.5" fill="#065F46">在這張圖上跑一次 Dijkstra 幾乎免費,精度遠勝直線距離</text>

  <!-- 三種估距法 -->
  <g font-size="9.5">
    <rect x="20" y="366" width="280" height="34" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="160" y="381" text-anchor="middle" font-weight="700" fill="#374151">直線 / 曼哈頓距離</text>
    <text x="160" y="394" text-anchor="middle" fill="#6B7280">O(1),但走道場域可能差兩三倍</text>
    <rect x="310" y="366" width="280" height="34" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="450" y="381" text-anchor="middle" font-weight="700" fill="#1E3A8A">道路級 Dijkstra</text>
    <text x="450" y="394" text-anchor="middle" fill="#6B7280">節點幾十個,代價是多一份圖資要維護</text>
    <rect x="600" y="366" width="280" height="34" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="740" y="381" text-anchor="middle" font-weight="700" fill="#065F46">全點對預算 dist_cache</text>
    <text x="740" y="394" text-anchor="middle" fill="#6B7280">查詢 O(1),但記憶體 O(V²)、預算 O(V² log V)</text>
  </g>
  <text x="450" y="418" text-anchor="middle" font-size="11" fill="#374151">路網規模決定該用哪一種,不是偏好問題</text>
</svg>
