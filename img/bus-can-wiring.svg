<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="cw1" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="cw2" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">CAN 匯流排接線:STM32 → 收發器 → 差分匯流排</text>
  <text x="480" y="46" text-anchor="middle" font-size="12.5" fill="#6B7280">MCU 腳位是單端 0/3.3V 訊號,匯流排跑差分電平,中間必須加一顆收發器轉換</text>

  <!-- abstract layer (shared by CAN / RS485) -->
  <text x="480" y="60" text-anchor="middle" font-size="10.5" fill="#9A3412" font-style="italic">CAN 與 RS485 共通的第一層:MCU 都不能直接上匯流排</text>
  <rect x="175" y="66" width="140" height="38" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="245" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">STM32F4</text>
  <line x1="315" y1="85" x2="393" y2="85" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#cw2)"/>
  <text x="354" y="78" text-anchor="middle" font-size="9.5" fill="#6B7280">TX/RX 數位訊號</text>
  <rect x="395" y="66" width="170" height="38" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="480" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">收發器 IC</text>
  <line x1="565" y1="85" x2="643" y2="85" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#cw2)"/>
  <text x="604" y="78" text-anchor="middle" font-size="9.5" fill="#6B7280">差分線</text>
  <rect x="645" y="66" width="140" height="38" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="715" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">匯流排</text>

  <line x1="60" y1="118" x2="900" y2="118" stroke="#E5E7EB" stroke-width="1.2"/>

  <!-- STM32F407 detail box -->
  <rect x="50" y="150" width="200" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="150" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">STM32F407</text>
  <text x="65" y="209" font-size="12" fill="#1E3A8A">CAN1_TX</text>
  <text x="65" y="223" font-size="9.5" fill="#6B7280">(PA12 / PB9)</text>
  <text x="65" y="249" font-size="12" fill="#1E3A8A">CAN1_RX</text>
  <text x="65" y="263" font-size="9.5" fill="#6B7280">(PA11 / PB8)</text>

  <!-- transceiver detail box -->
  <rect x="300" y="150" width="200" height="130" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="400" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">CAN 收發器</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#6B7280">TJA1051 / SN65HVD230</text>
  <text x="315" y="219" font-size="12" fill="#9A3412">TXD</text>
  <text x="315" y="249" font-size="12" fill="#9A3412">RXD</text>
  <text x="365" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">CANH</text>
  <text x="440" y="270" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">CANL</text>

  <!-- TX/RX arrows between boxes -->
  <line x1="250" y1="212" x2="298" y2="212" stroke="#F97316" stroke-width="2.2" marker-end="url(#cw1)"/>
  <line x1="298" y1="248" x2="250" y2="248" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#cw2)"/>

  <!-- CANH/CANL drop from transceiver to bus -->
  <line x1="365" y1="280" x2="365" y2="350" stroke="#10B981" stroke-width="2.2"/>
  <line x1="440" y1="280" x2="440" y2="373" stroke="#059669" stroke-width="2.2"/>

  <!-- bus lines (twisted pair) -->
  <line x1="90" y1="350" x2="910" y2="350" stroke="#10B981" stroke-width="3"/>
  <line x1="90" y1="373" x2="910" y2="373" stroke="#059669" stroke-width="3"/>
  <text x="105" y="344" font-size="10.5" font-weight="700" fill="#065F46">CANH</text>
  <text x="105" y="390" font-size="10.5" font-weight="700" fill="#065F46">CANL</text>

  <!-- terminators at both far ends -->
  <rect x="82" y="350" width="16" height="23" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="60" y="365" text-anchor="end" font-size="10.5" fill="#9A3412">120Ω</text>
  <rect x="902" y="350" width="16" height="23" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="926" y="365" text-anchor="start" font-size="10.5" fill="#9A3412">120Ω</text>

  <!-- node 1: STM32 (already shown above) -->
  <rect x="330" y="386" width="150" height="22" rx="11" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="405" y="401" text-anchor="middle" font-size="10.5" fill="#065F46">① STM32(本例,經收發器)</text>

  <!-- node 2: 左輪驅動器 -->
  <line x1="560" y1="373" x2="560" y2="410" stroke="#10B981" stroke-width="2"/>
  <rect x="495" y="410" width="130" height="58" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="560" y="433" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">② 左輪驅動器</text>
  <text x="560" y="451" text-anchor="middle" font-size="10.5" fill="#6B7280">FOC · 內建收發器</text>

  <!-- node 3: 右輪驅動器 -->
  <line x1="700" y1="373" x2="700" y2="410" stroke="#10B981" stroke-width="2"/>
  <rect x="635" y="410" width="130" height="58" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="700" y="433" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">③ 右輪驅動器</text>
  <text x="700" y="451" text-anchor="middle" font-size="10.5" fill="#6B7280">FOC · 內建收發器</text>

  <!-- node 4: BMS -->
  <line x1="830" y1="373" x2="830" y2="410" stroke="#10B981" stroke-width="2"/>
  <rect x="765" y="410" width="130" height="58" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="830" y="433" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">④ 電池 BMS</text>
  <text x="830" y="451" text-anchor="middle" font-size="10.5" fill="#6B7280">電量 / 異常回報</text>

  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#374151">仲裁靠差分顯性/隱性電平(wired-AND 的差分版):ID 小的節點自動勝出,不會撞壞資料</text>
  <text x="480" y="520" text-anchor="middle" font-size="11.5" fill="#6B7280">120Ω 終端電阻只放匯流排最遠兩端;中間節點(②③④)都不放電阻</text>
</svg>
