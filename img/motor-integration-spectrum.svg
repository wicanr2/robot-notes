<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="is-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">整合程度光譜:晶片廠幫你做多少</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6B7280">§9.3 —— 做驅動器的人要面對的選型;買整機走 CAN,這層複雜度已被封裝掉</text>

  <!-- spectrum bar -->
  <text x="60" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">整合少</text>
  <line x1="100" y1="94" x2="800" y2="94" stroke="url(#is-grad)" stroke-width="16"/>
  <polygon points="100,94 114,87 114,101" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <polygon points="800,94 786,87 786,101" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="840" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">整合多</text>

  <!-- stems -->
  <line x1="190" y1="102" x2="190" y2="150" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="190" cy="94" r="5" fill="#3B82F6"/>
  <line x1="450" y1="102" x2="450" y2="150" stroke="#F97316" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="450" cy="94" r="5" fill="#F97316"/>
  <line x1="710" y1="102" x2="710" y2="150" stroke="#10B981" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="710" cy="94" r="5" fill="#10B981"/>

  <!-- Box 1 -->
  <rect x="75" y="150" width="230" height="150" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="190" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">只有 gate driver</text>
  <text x="190" y="205" text-anchor="middle" font-size="11.5" fill="#1F2937">MCU 跑 FOC</text>
  <text x="190" y="223" text-anchor="middle" font-size="11.5" fill="#1F2937">外置 MOSFET</text>
  <line x1="100" y1="240" x2="280" y2="240" stroke="#BFDBFE" stroke-width="1"/>
  <text x="190" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">功率彈性最大</text>

  <!-- Box 2 -->
  <rect x="335" y="150" width="230" height="150" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="450" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#9A3412">+ 整合 FET</text>
  <text x="450" y="205" text-anchor="middle" font-size="11.5" fill="#1F2937">省掉外部功率橋</text>
  <text x="450" y="223" text-anchor="middle" font-size="11.5" fill="#1F2937">6 顆 MOSFET 做進封裝</text>
  <line x1="360" y1="240" x2="540" y2="240" stroke="#FED7AA" stroke-width="1"/>
  <text x="450" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">適合小功率(散熱受限)</text>

  <!-- Box 3 -->
  <rect x="595" y="150" width="230" height="150" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <text x="710" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">+ 整合馬達控制</text>
  <text x="710" y="205" text-anchor="middle" font-size="11.5" fill="#1F2937">控制演算法都內建</text>
  <text x="710" y="223" text-anchor="middle" font-size="11.5" fill="#1F2937">(如無感測 FOC)</text>
  <line x1="620" y1="240" x2="800" y2="240" stroke="#A7F3D0" stroke-width="1"/>
  <text x="710" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">一顆晶片馬達就會轉</text>

  <text x="450" y="330" text-anchor="middle" font-size="11.5" fill="#374151">越往右買越貴、但自己要做的事越少;越往左越便宜、但功率電子與韌體全部自己扛</text>
</svg>
