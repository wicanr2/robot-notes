<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><marker id="qdR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#DC2626"/></marker>
  <marker id="qdG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#10B981"/></marker></defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">腳每一步都要重新撞地一次,誰吸收那股衝擊?</text>
  <text x="440" y="48" text-anchor="middle" font-size="12" fill="#6B7280">工業手臂的優點,裝到腿上逐一變成缺點</text>

  <!-- 衝擊路徑示意 -->
  <rect x="20" y="66" width="240" height="150" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="140" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">著地衝擊沿腿往上傳</text>
  <line x1="70" y1="196" x2="210" y2="196" stroke="#9CA3AF" stroke-width="2.5"/>
  <g stroke="#6B7280" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="140" y1="110" x2="112" y2="152"/><line x1="112" y1="152" x2="140" y2="196"/>
  </g>
  <circle cx="140" cy="110" r="7" fill="#F97316"/><circle cx="112" cy="152" r="7" fill="#F97316"/>
  <line x1="140" y1="190" x2="140" y2="166" stroke="#DC2626" stroke-width="2.6" marker-end="url(#qdR)"/>
  <text x="158" y="180" font-size="9.5" font-weight="700" fill="#991B1B">衝擊</text>
  <text x="140" y="212" text-anchor="middle" font-size="9" fill="#6B7280">每秒好幾次,一天幾萬次</text>

  <!-- 對照表 -->
  <g font-size="10.5">
    <rect x="278" y="66" width="146" height="30" rx="6" fill="#F3F4F6"/>
    <rect x="430" y="66" width="212" height="30" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
    <rect x="648" y="66" width="212" height="30" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
    <text x="536" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">高減速比(1:50+)</text>
    <text x="754" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46">QDD(約 1:3 ~ 1:10)</text>

    <text x="286" y="122" font-weight="700" fill="#374151">反射慣量</text>
    <text x="536" y="122" text-anchor="middle" fill="#374151">被減速比<tspan font-weight="700">平方</tspan>放大</text>
    <text x="754" y="122" text-anchor="middle" fill="#374151">低</text>

    <text x="286" y="154" font-weight="700" fill="#374151">可反向驅動</text>
    <text x="536" y="154" text-anchor="middle" fill="#991B1B">幾乎不能,外力推不動</text>
    <text x="754" y="154" text-anchor="middle" font-weight="700" fill="#065F46">可以</text>

    <text x="286" y="186" font-weight="700" fill="#374151">衝擊誰吸收</text>
    <text x="536" y="186" text-anchor="middle" fill="#991B1B">齒輪硬吃 → 磨損與失效</text>
    <text x="754" y="186" text-anchor="middle" fill="#065F46">大部分被馬達轉動吸收</text>

    <text x="286" y="218" font-weight="700" fill="#374151">力控怎麼做</text>
    <text x="536" y="218" text-anchor="middle" fill="#991B1B">摩擦與齒隙不準,要外加感測器</text>
    <text x="754" y="218" text-anchor="middle" font-weight="700" fill="#065F46">用馬達電流就推得出扭矩</text>

    <text x="286" y="250" font-weight="700" fill="#374151">控制頻寬</text>
    <text x="536" y="250" text-anchor="middle" fill="#374151">低</text>
    <text x="754" y="250" text-anchor="middle" fill="#374151">高</text>
  </g>
  <line x1="278" y1="102" x2="860" y2="102" stroke="#E5E7EB"/>
  <line x1="278" y1="134" x2="860" y2="134" stroke="#E5E7EB"/>
  <line x1="278" y1="166" x2="860" y2="166" stroke="#E5E7EB"/>
  <line x1="278" y1="198" x2="860" y2="198" stroke="#E5E7EB"/>
  <line x1="278" y1="230" x2="860" y2="230" stroke="#E5E7EB"/>
  <line x1="278" y1="262" x2="860" y2="262" stroke="#E5E7EB"/>

  <rect x="20" y="276" width="840" height="58" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="40" y="298" font-size="11.5" font-weight="700" fill="#065F46">「可反向驅動」那一格一次解決兩件事</text>
  <text x="40" y="320" font-size="10.5" fill="#374151">衝擊的力可以<tspan font-weight="700">反過來推動馬達轉</tspan>,能量進了轉子動能而不是砸在齒輪上;同時,馬達電流就能反推關節扭矩,再用 τ = JᵀF 推得腳底受力——<tspan font-weight="700">力控不必外加感測器</tspan>。</text>

  <rect x="20" y="344" width="840" height="46" rx="9" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="40" y="366" font-size="11" font-weight="700" fill="#374151">串聯彈性致動器(SEA)是另一條路:輸出端加一根實體彈簧,用形變量測力、也吸收衝擊。</text>
  <text x="40" y="383" font-size="10.5" fill="#374151">代價是犧牲頻寬(彈簧本身是個低通)與機構複雜度。<tspan font-weight="700">QDD 與 SEA 是同一個問題的兩種答案:衝擊要被誰吸收——馬達的轉動,還是一根彈簧。</tspan></text>
</svg>
