<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ls-a" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker>
    <marker id="ls-b" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="900" height="416" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">四層迴路:外層需要模型,內層需要抗擾動</text>
  <text x="450" y="47" text-anchor="middle" font-size="12" fill="#6B7280">越往內頻率越高、模型越單純;越往外誤差越耦合、越需要 A 與 B</text>

  <!-- 層級框(由外而內) -->
  <rect x="40" y="66" width="620" height="266" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="88" font-size="13" font-weight="700" fill="#1E40AF">① 路徑追蹤　20–50 Hz　工控機</text>
  <text x="56" y="107" font-size="11.5" fill="#1E40AF">輸入 [e_y, e_θ, …] → 輸出 (v*, δ*)　　控制器:<tspan font-weight="700">LQR</tspan>(或 MPC)</text>
  <text x="56" y="124" font-size="11" fill="#1E40AF">理由:兩個誤差強耦合,同一個致動器,需要模型才知道比例</text>

  <rect x="70" y="136" width="560" height="182" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="86" y="158" font-size="13" font-weight="700" fill="#047857">② 轉向角環 / 速度環　100–1000 Hz　下位機 MCU</text>
  <text x="86" y="177" font-size="11.5" fill="#047857">輸入 δ*、v* → 輸出力矩指令　　控制器:<tspan font-weight="700">PID</tspan>(多半 PI)</text>
  <text x="86" y="194" font-size="11" fill="#047857">理由:單進單出;擾動是常值(摩擦、坡度、電壓下垂)→ 積分項是結構最優</text>

  <rect x="100" y="206" width="500" height="98" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <text x="116" y="228" font-size="13" font-weight="700" fill="#92400E">③ 電流環(FOC)　10–20 kHz　馬達驅動器</text>
  <text x="116" y="247" font-size="11.5" fill="#92400E">輸入力矩 → 輸出相電壓　　控制器:<tspan font-weight="700">PI</tspan></text>
  <text x="116" y="264" font-size="11" fill="#92400E">理由:電氣時間常數極短、模型單純,而且要跑在 kHz——K 重算不起</text>
  <rect x="130" y="272" width="440" height="24" rx="5" fill="#ffffff" stroke="#92400E" stroke-width="1.4"/>
  <text x="350" y="289" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">馬達 → 舵輪 / 驅動輪 → 車</text>

  <!-- 右側:獨立的貨叉軸 -->
  <rect x="686" y="66" width="196" height="182" rx="9" fill="#F9FAFB" stroke="#374151" stroke-width="1.8"/>
  <text x="784" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">貨叉升降(獨立軸)</text>
  <text x="702" y="114" font-size="11.5" fill="#374151">50–200 Hz</text>
  <text x="702" y="134" font-size="11.5" fill="#374151">叉高目標 → 比例閥開度</text>
  <text x="702" y="154" font-size="11.5" font-weight="700" fill="#374151">PID + 前饋</text>
  <text x="702" y="176" font-size="11" fill="#6B7280">液壓有死區,要前饋補</text>
  <text x="702" y="193" font-size="11" fill="#6B7280">上升靠出力、下降靠自重</text>
  <text x="702" y="210" font-size="11" fill="#6B7280">→ 兩個方向兩組參數</text>
  <text x="702" y="234" font-size="11" font-weight="700" fill="#B45309">精度瓶頸在這一軸</text>

  <!-- 判準框 -->
  <rect x="686" y="262" width="196" height="70" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/>
  <text x="784" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">換 LQR 的判準</text>
  <text x="700" y="300" font-size="10.5" fill="#92400E">① 輸出多於一個且互相影響</text>
  <text x="700" y="315" font-size="10.5" fill="#92400E">② 想直接指定取捨,不想調參湊</text>
  <text x="700" y="330" font-size="10.5" fill="#92400E">③ 狀態量得到、模型像樣</text>

  <text x="450" y="356" text-anchor="middle" font-size="12" fill="#374151">標準 LQR <tspan font-weight="700">沒有積分器</tspan>:坡道這種持續擾動會留下穩態偏差</text>
  <text x="450" y="376" text-anchor="middle" font-size="12" fill="#374151">解法是把積分器塞進狀態向量(LQI),讓積分增益也由 Riccati 一起解出來</text>
  <text x="450" y="394" text-anchor="middle" font-size="11" fill="#6B7280">前三層的串接方式與馬達那篇的串級控制相同,只是最外面多接了一層</text>
</svg>
