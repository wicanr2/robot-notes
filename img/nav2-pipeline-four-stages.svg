<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="np-a" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="np-b" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2563EB"/></marker>
  </defs>
  <rect width="940" height="468" fill="#ffffff"/>
  <text x="470" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">四個角色各自回答一個不同的問題</text>
  <text x="470" y="47" text-anchor="middle" font-size="12" fill="#6B7280">介面很窄:上游給下游的只有一條路徑,下游回上游的什麼都沒有——所以每一格都能單獨替換</text>

  <!-- AMCL(定位,不在規劃鏈上) -->
  <rect x="30" y="176" width="150" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="105" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">AMCL</text>
  <text x="105" y="216" text-anchor="middle" font-size="10.5" fill="#5B21B6">「我在哪?」</text>
  <text x="42" y="234" font-size="9.5" fill="#6B21A8">入:地圖 + 雷射 + odom</text>
  <text x="42" y="248" font-size="9.5" fill="#6B21A8">出:map→odom 變換</text>
  <text x="42" y="262" font-size="9.5" font-weight="700" fill="#6B21A8">隨掃描,約 10 Hz</text>

  <!-- Planner -->
  <rect x="228" y="176" width="150" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="303" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Planner</text>
  <text x="303" y="216" text-anchor="middle" font-size="10.5" fill="#1E40AF">「整體走哪條路?」</text>
  <text x="240" y="234" font-size="9.5" fill="#1E3A8A">入:全域 costmap + 起訖</text>
  <text x="240" y="248" font-size="9.5" fill="#1E3A8A">出:Path(位姿序列)</text>
  <text x="240" y="262" font-size="9.5" font-weight="700" fill="#1E3A8A">按需 / 約 1 Hz</text>

  <!-- Smoother -->
  <rect x="426" y="176" width="150" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="501" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Smoother</text>
  <text x="501" y="216" text-anchor="middle" font-size="10.5" fill="#047857">「這條路夠平順嗎?」</text>
  <text x="438" y="234" font-size="9.5" fill="#065F46">入:Path</text>
  <text x="438" y="248" font-size="9.5" fill="#065F46">出:Path(曲率更低)</text>
  <text x="438" y="262" font-size="9.5" font-weight="700" fill="#065F46">跟著 planner,可略過</text>

  <!-- Controller -->
  <rect x="624" y="176" width="150" height="92" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
  <text x="699" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Controller</text>
  <text x="699" y="216" text-anchor="middle" font-size="10.5" fill="#92400E">「這一刻出多少速度?」</text>
  <text x="636" y="234" font-size="9.5" fill="#78350F">入:Path + 區域 costmap</text>
  <text x="636" y="248" font-size="9.5" fill="#78350F">出:速度指令</text>
  <text x="636" y="262" font-size="9.5" font-weight="700" fill="#78350F">20–50 Hz</text>

  <!-- 底盤 -->
  <rect x="822" y="198" width="92" height="48" rx="8" fill="#F9FAFB" stroke="#374151" stroke-width="1.8"/>
  <text x="868" y="219" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">底盤</text>
  <text x="868" y="236" text-anchor="middle" font-size="10" fill="#6B7280">(v, ω)</text>

  <!-- 主資料流箭頭 -->
  <g stroke="#374151" stroke-width="2" marker-end="url(#np-a)">
    <line x1="378" y1="222" x2="418" y2="222"/>
    <line x1="576" y1="222" x2="616" y2="222"/>
    <line x1="774" y1="222" x2="814" y2="222"/>
  </g>
  <text x="398" y="214" text-anchor="middle" font-size="9.5" fill="#6B7280">Path</text>
  <text x="596" y="214" text-anchor="middle" font-size="9.5" fill="#6B7280">Path</text>

  <!-- AMCL 的位姿供給(虛線,供給三者) -->
  <path d="M105,176 L105,132 L303,132" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M105,132 L699,132" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="303" y1="132" x2="303" y2="170" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#np-a)"/>
  <line x1="699" y1="132" x2="699" y2="170" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#np-a)"/>
  <text x="470" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5B21B6">定位不在規劃鏈上,它是所有人的共同前提:沒有它,路徑與跟隨都算在錯的座標裡</text>

  <!-- costmap 供給 -->
  <rect x="228" y="304" width="150" height="40" rx="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="303" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">全域 costmap</text>
  <text x="303" y="336" text-anchor="middle" font-size="9.5" fill="#6B7280">整張地圖 + 膨脹層</text>
  <line x1="303" y1="304" x2="303" y2="274" stroke="#6B7280" stroke-width="1.6" marker-end="url(#np-a)"/>
  <rect x="624" y="304" width="150" height="40" rx="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5"/>
  <text x="699" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">區域 costmap</text>
  <text x="699" y="336" text-anchor="middle" font-size="9.5" fill="#6B7280">車身周圍 + 即時感測</text>
  <line x1="699" y1="304" x2="699" y2="274" stroke="#6B7280" stroke-width="1.6" marker-end="url(#np-a)"/>

  <!-- 行為樹 -->
  <rect x="228" y="366" width="546" height="40" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="501" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">行為樹:決定何時重規劃、卡住時做什麼(清 costmap、原地旋轉、後退、等待)</text>
  <text x="501" y="398" text-anchor="middle" font-size="10.5" fill="#B91C1C">上面四格都是被它呼叫的元件,沒有一格自己決定「接下來做什麼」</text>

  <text x="470" y="428" text-anchor="middle" font-size="11.5" fill="#374151">為什麼 controller 也要避障?因為 planner 算路徑的那一刻,現在擋路的東西可能還不在那裡</text>
  <text x="470" y="446" text-anchor="middle" font-size="11" fill="#6B7280">全域看得遠但過期,區域看得即時但短視——兩者的分工就是這個時間差</text>
</svg>
