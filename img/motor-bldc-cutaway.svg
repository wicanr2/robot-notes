<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="780" height="600" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">無刷馬達(BLDC)剖面:電子換相怎麼發生</text>
  <text x="390" y="45" text-anchor="middle" font-size="12" fill="#6B7280">§17.3 —— 內轉子型:線圈搬到定子(不動)、磁鐵搬到轉子(轉動),換相改由控制電路做</text>
  <text x="320" y="62" text-anchor="middle" font-size="10.5" fill="#6B7280">外殼(內轉子型)</text>

  <!-- stator housing -->
  <circle cx="320" cy="235" r="165" fill="#F9FAFB" stroke="#1F2937" stroke-width="2.2"/>

  <!-- rotor: permanent magnet N/S -->
  <path d="M320,160 A75,75 0 0 0 320,310 Z" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.8"/>
  <path d="M320,160 A75,75 0 0 1 320,310 Z" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <line x1="320" y1="160" x2="320" y2="310" stroke="#6B7280" stroke-width="1"/>
  <text x="282" y="241" text-anchor="middle" font-size="16" font-weight="700" fill="#991B1B">N</text>
  <text x="358" y="241" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">S</text>
  <circle cx="320" cy="235" r="6" fill="#1F2937"/>
  <text x="320" y="260" text-anchor="middle" font-size="9" fill="#374151">軸</text>

  <!-- stator windings U/V/W (green, tangential) -->
  <rect x="303" y="92" width="34" height="17" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="320" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46">U</text>

  <rect x="420" y="294" width="34" height="17" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6" transform="rotate(-30 437 302.5)"/>
  <text x="437" y="307" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46" transform="rotate(-30 437 302.5)">W</text>

  <rect x="186" y="294" width="34" height="17" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6" transform="rotate(30 203 302.5)"/>
  <text x="203" y="307" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46" transform="rotate(30 203 302.5)">V</text>

  <!-- hall sensors x3 -->
  <rect x="402" y="180" width="10" height="10" fill="#F97316" transform="rotate(45 407 185)"/>
  <rect x="315" y="330" width="10" height="10" fill="#F97316" transform="rotate(45 320 335)"/>
  <rect x="228" y="180" width="10" height="10" fill="#F97316" transform="rotate(45 233 185)"/>

  <!-- callouts -->
  <path d="M345,100 L490,100 L490,140 L520,140" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <rect x="520" y="110" width="230" height="60" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
  <text x="534" y="133" font-size="11.5" fill="#065F46">定子:三相線圈 U/V/W</text>
  <text x="534" y="153" font-size="11.5" fill="#065F46">固定不動(§16)</text>

  <path d="M395,235 L475,235 L475,215 L520,215" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <rect x="520" y="185" width="230" height="60" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="534" y="208" font-size="11.5" fill="#991B1B">轉子:永久磁鐵,</text>
  <text x="534" y="228" font-size="11.5" fill="#991B1B">沒有任何接線!</text>

  <path d="M407,185 L485,185 L485,275 L520,275" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <rect x="520" y="260" width="230" height="60" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.4"/>
  <text x="534" y="283" font-size="11.5" fill="#9A3412">霍爾:嵌在定子上,</text>
  <text x="534" y="303" font-size="11.5" fill="#9A3412">回報磁鐵位置(§11)</text>

  <!-- hall signal down to controller -->
  <path d="M320,345 L320,357 L420,357 L420,440" fill="none" stroke="#F97316" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="428" y="352" font-size="9.5" fill="#9A3412">霍爾訊號</text>

  <!-- U V W exit leads -->
  <line x1="270" y1="398" x2="270" y2="440" stroke="#374151" stroke-width="2"/>
  <line x1="370" y1="398" x2="370" y2="440" stroke="#374151" stroke-width="2"/>
  <text x="270" y="392" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F2937">U</text>
  <text x="370" y="392" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F2937">W</text>
  <text x="320" y="392" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1F2937">V</text>

  <!-- power bridge + MCU box -->
  <rect x="210" y="440" width="220" height="90" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="320" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">功率橋(6 MOSFET)</text>
  <text x="320" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">+ 控制晶片/MCU</text>
  <text x="320" y="500" text-anchor="middle" font-size="10.5" fill="#374151">← 換相在這裡發生(§12)</text>
  <text x="320" y="517" text-anchor="middle" font-size="10.5" fill="#374151">依霍爾狀態決定哪兩相通電</text>

  <line x1="320" y1="530" x2="320" y2="558" stroke="#374151" stroke-width="2.2"/>
  <text x="320" y="576" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">電池 DC</text>
</svg>
