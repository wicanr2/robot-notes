<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><marker id="tc-a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker></defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">折線的轉角,曲率是無限大</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6B7280">κ = dθ/ds:方向在零弧長內跳了一個有限角度,所以 κ → ∞。平滑就是把這根尖峰壓成有界的曲線</text>

  <rect x="24" y="70" width="424" height="180" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
  <text x="236" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">規劃器輸出:折線</text>
  <polyline points="70,220 200,130 400,190" fill="none" stroke="#991B1B" stroke-width="3"/>
  <circle cx="70" cy="220" r="5" fill="#991B1B"/><circle cx="200" cy="130" r="6" fill="#EF4444"/><circle cx="400" cy="190" r="5" fill="#991B1B"/>
  <text x="200" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">κ = ∞</text>
  <text x="236" y="240" text-anchor="middle" font-size="11" fill="#7F1D1D">車要在零時間內轉一個有限角度 —— 做不到</text>

  <rect x="466" y="70" width="410" height="180" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="671" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">平滑後:曲率有界</text>
  <path d="M510,220 L560,185 Q650,120 720,158 L830,190" fill="none" stroke="#065F46" stroke-width="3"/>
  <circle cx="510" cy="220" r="5" fill="#065F46"/><circle cx="830" cy="190" r="5" fill="#065F46"/>
  <path d="M560,185 Q650,120 720,158" fill="none" stroke="#10B981" stroke-width="7" opacity="0.28"/>
  <text x="640" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">κ ≤ 1/R_min</text>
  <text x="671" y="240" text-anchor="middle" font-size="11" fill="#064E3B">轉彎攤在一段弧長上,曲率變成連續函數</text>

  <rect x="24" y="266" width="852" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="44" y="290" font-size="13" font-weight="700" fill="#334155">同一個「轉不過去」,兩種車的意義不同</text>
  <rect x="44" y="302" width="400" height="88" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="60" y="324" font-size="12.5" font-weight="700" fill="#1E3A8A">差速車　κ = ω / v</text>
  <text x="60" y="344" font-size="11" fill="#1F2937">改左右輪速差就改曲率 →「可以」瞬間改</text>
  <text x="60" y="362" font-size="11" fill="#B91C1C">但代價是輪速階躍:打滑、odometry 毀、機構受衝擊</text>
  <text x="60" y="380" font-size="11" fill="#475569">做得到 ≠ 應該做</text>
  <rect x="460" y="302" width="400" height="88" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
  <text x="476" y="324" font-size="12.5" font-weight="700" fill="#991B1B">舵輪 / 叉車　κ = tan(δ) / L</text>
  <text x="476" y="344" font-size="11" fill="#1F2937">δ 是實體轉向角,轉向馬達有角速度上限 δ̇ₘₐₓ</text>
  <text x="476" y="362" font-size="11" fill="#B91C1C">根本做不到 —— 要在零時間內把方向盤轉到位</text>
  <text x="476" y="380" font-size="11" fill="#475569">所以叉車的路徑一定要 G2 以上</text>
</svg>
