  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">二次型不是一個選擇,是唯一活得下來的形狀</text>
  <text x="400" y="47" text-anchor="middle" font-size="12" fill="#6B7280">代價函數要滿足:目標點為零、非負、左右對稱、光滑</text>

