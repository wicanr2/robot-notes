  <text x="150" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">|x|</text>
  <text x="400" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">x²</text>
  <text x="650" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">x⁴</text>

  <circle cx="150" cy="230" r="4.5" fill="none" stroke="#DC2626" stroke-width="2.2"/>
  <text x="150" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#DC2626">原點是尖角,不可微</text>
  <text x="150" y="274" text-anchor="middle" font-size="11" fill="#6B7280">最佳解退化成 bang-bang</text>
  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#6B7280">開關式指令,機械受不了</text>

  <text x="400" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#059669">光滑、唯一最小、梯度線性</text>
  <text x="400" y="274" text-anchor="middle" font-size="11" fill="#6B7280">配線性系統時是唯一</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#6B7280">有閉式解的組合</text>

  <text x="650" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B45309">近處梯度消失,遠處暴衝</text>
  <text x="650" y="274" text-anchor="middle" font-size="11" fill="#6B7280">小偏差幾乎不修,</text>
  <text x="650" y="290" text-anchor="middle" font-size="11" fill="#6B7280">大偏差指令爆掉</text>

  <!-- Taylor 論證 -->
  <rect x="100" y="304" width="600" height="38" rx="6" fill="#F9FAFB" stroke="#059669" stroke-width="1.6"/>
  <text x="400" y="321" text-anchor="middle" font-size="12.5" fill="#374151">L(x) = <tspan fill="#9CA3AF">L(0)</tspan> + <tspan fill="#9CA3AF">∇L(0)ᵀx</tspan> + ½ xᵀ∇²L(0) x + O(‖x‖³)</text>
  <text x="400" y="337" text-anchor="middle" font-size="11" fill="#6B7280">前兩項被「目標點為零」與「原點是最小」強制歸零 → 最低階的非零項就是二次項</text>
</svg>
