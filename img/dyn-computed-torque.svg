<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ct-g" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="ct-b" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
  </defs>
  <rect width="780" height="310" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Computed torque:用模型把非線性整包抵銷</text>

  <!-- desired input -->
  <text x="60" y="118" text-anchor="middle" font-size="12" fill="#374151">θ_d, θ̇_d, θ̈_d</text>
  <line x1="24" y1="130" x2="98" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#ct-g)"/>

  <!-- error node -->
  <circle cx="112" cy="130" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="112" y="135" text-anchor="middle" font-size="13" fill="#374151">−</text>
  <line x1="124" y1="130" x2="168" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#ct-g)"/>
  <text x="146" y="120" text-anchor="middle" font-size="11.5" fill="#374151">e, ė</text>

  <!-- PD block -->
  <rect x="170" y="106" width="118" height="48" fill="#F9FAFB" stroke="#374151" stroke-width="1.6"/>
  <text x="229" y="126" text-anchor="middle" font-size="12" fill="#374151">回授修正</text>
  <text x="229" y="144" text-anchor="middle" font-size="11.5" fill="#374151">θ̈_d + K_v ė + K_p e</text>
  <line x1="288" y1="130" x2="330" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#ct-g)"/>

  <!-- M block -->
  <rect x="332" y="106" width="76" height="48" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="370" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">M̂(θ)</text>
  <line x1="408" y1="130" x2="448" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#ct-g)"/>

  <!-- sum with feedforward -->
  <circle cx="462" cy="130" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="462" y="135" text-anchor="middle" font-size="13" fill="#374151">+</text>
  <!-- feedforward block below -->
  <rect x="384" y="188" width="156" height="42" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="462" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">Ĉ(θ,θ̇)θ̇ + N̂(θ)</text>
  <text x="462" y="222" text-anchor="middle" font-size="10.5" fill="#1E40AF">前饋:照模型抵銷</text>
  <line x1="462" y1="188" x2="462" y2="144" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ct-b)"/>

  <line x1="474" y1="130" x2="524" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#ct-g)"/>
  <text x="499" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">τ</text>

  <!-- robot block -->
  <rect x="526" y="100" width="150" height="60" fill="#F3F4F6" stroke="#374151" stroke-width="1.8"/>
  <text x="601" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">機器人</text>
  <text x="601" y="144" text-anchor="middle" font-size="11.5" fill="#374151">Mθ̈ + Cθ̇ + N = τ</text>
  <line x1="676" y1="130" x2="736" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#ct-g)"/>
  <text x="722" y="118" text-anchor="middle" font-size="12" fill="#374151">θ, θ̇</text>

  <!-- feedback path -->
  <path d="M706,130 L706,258 L112,258 L112,144" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ct-g)"/>
  <path d="M706,258 L462,258 L462,232" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#ct-b)"/>
  <text x="580" y="250" text-anchor="middle" font-size="10.5" fill="#6B7280">量測 θ, θ̇(前饋與回授都要用)</text>

  <!-- result -->
  <rect x="196" y="276" width="388" height="26" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="390" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">模型準 ⇒ 閉迴路化成 ë + K_v ė + K_p e = 0(n 個獨立線性系統)</text>
</svg>
