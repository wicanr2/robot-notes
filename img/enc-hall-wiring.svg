<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="hw1" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">輪轂馬達霍爾訊號 → STM32F407 接線(含上拉電阻)</text>

  <!-- 3.3V pull-up rail -->
  <line x1="358" y1="66" x2="478" y2="66" stroke="#F97316" stroke-width="2.2"/>
  <text x="418" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">3.3V</text>
  <text x="500" y="103" font-size="11.5" fill="#374151">10kΩ ×3</text>
  <text x="500" y="118" font-size="11.5" fill="#374151">(上拉電阻)</text>

  <!-- HA/HB/HC pull-up stems + resistors -->
  <line x1="380" y1="270" x2="380" y2="66" stroke="#374151" stroke-width="1.8"/>
  <rect x="374" y="88" width="12" height="26" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <line x1="420" y1="315" x2="420" y2="66" stroke="#374151" stroke-width="1.8"/>
  <rect x="414" y="88" width="12" height="26" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
  <line x1="460" y1="360" x2="460" y2="66" stroke="#374151" stroke-width="1.8"/>
  <rect x="454" y="88" width="12" height="26" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>

  <!-- left box: 輪轂馬達訊號線 -->
  <rect x="30" y="120" width="190" height="270" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="125" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">輪轂馬達訊號線</text>
  <text x="125" y="161" text-anchor="middle" font-size="10.5" fill="#1E3A8A">(5 細線,另有 3 粗線 UVW 動力線)</text>
  <text x="210" y="184" text-anchor="end" font-size="12.5" fill="#1F2937">VCC</text>
  <text x="210" y="229" text-anchor="end" font-size="12.5" fill="#1F2937">GND</text>
  <text x="210" y="274" text-anchor="end" font-size="12.5" font-weight="700" fill="#1E3A8A">HA</text>
  <text x="210" y="319" text-anchor="end" font-size="12.5" font-weight="700" fill="#1E3A8A">HB</text>
  <text x="210" y="364" text-anchor="end" font-size="12.5" font-weight="700" fill="#1E3A8A">HC</text>

  <!-- right box: STM32F407 -->
  <rect x="630" y="195" width="200" height="200" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="730" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">STM32F407</text>
  <text x="645" y="233" text-anchor="start" font-size="12.5" fill="#1F2937">GND</text>
  <text x="645" y="278" text-anchor="start" font-size="12.5" font-weight="700" fill="#991B1B">PB6 (TIM4_CH1)</text>
  <text x="645" y="323" text-anchor="start" font-size="12.5" font-weight="700" fill="#991B1B">PB7 (TIM4_CH2)</text>
  <text x="645" y="368" text-anchor="start" font-size="12.5" font-weight="700" fill="#991B1B">PB8 (TIM4_CH3)</text>

  <!-- VCC -> external 5V -->
  <path d="M222,184 L280,184 L280,148 L306,148" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#hw1)"/>
  <rect x="308" y="127" width="140" height="42" rx="8" fill="#F3F4F6" stroke="#94A3B8"/>
  <text x="378" y="153" text-anchor="middle" font-size="12" fill="#374151">5V 電源(外部)</text>

  <!-- GND straight through -->
  <line x1="222" y1="229" x2="630" y2="229" stroke="#6B7280" stroke-width="2"/>
  <text x="300" y="221" text-anchor="middle" font-size="11" fill="#6B7280">共地(GND)</text>

  <!-- HA / HB / HC straight through, with pull-up junction dots -->
  <line x1="222" y1="274" x2="630" y2="274" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="222" y1="319" x2="630" y2="319" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="222" y1="364" x2="630" y2="364" stroke="#1E3A8A" stroke-width="2"/>
  <circle cx="380" cy="274" r="3.4" fill="#F97316"/>
  <circle cx="420" cy="319" r="3.4" fill="#F97316"/>
  <circle cx="460" cy="364" r="3.4" fill="#F97316"/>

  <!-- pin exit dots -->
  <circle cx="222" cy="184" r="2.6" fill="#3B82F6"/>
  <circle cx="222" cy="229" r="2.6" fill="#3B82F6"/>
  <circle cx="222" cy="274" r="2.6" fill="#3B82F6"/>
  <circle cx="222" cy="319" r="2.6" fill="#3B82F6"/>
  <circle cx="222" cy="364" r="2.6" fill="#3B82F6"/>

  <!-- bottom notes -->
  <rect x="30" y="404" width="390" height="48" rx="8" fill="#FFF7ED" stroke="#F97316"/>
  <text x="46" y="422" font-size="11.5" fill="#9A3412">① 霍爾為 open-drain 輸出,不上拉就讀到不定值</text>
  <text x="46" y="441" font-size="11.5" fill="#9A3412">② 上拉到 3.3V(即使霍爾供電 5V 也一樣)</text>

  <rect x="440" y="404" width="390" height="48" rx="8" fill="#ECFDF5" stroke="#10B981"/>
  <text x="456" y="422" font-size="11.5" fill="#065F46">③ 訊號線與 UVW 動力線分開走線,避免 PWM 噪聲耦合</text>
  <text x="456" y="441" font-size="11.5" fill="#065F46">④ 三訊號接同一顆 Timer 的 CH1/CH2/CH3(霍爾介面模式需要)</text>
</svg>
