<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ivc-o" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EA580C"/></marker>
  </defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">第 1 關節感受到的慣量,由手肘角度決定:m₁₁ = α + 2β·cosθ₂</text>

  <!-- LEFT: two configurations -->
  <!-- extended -->
  <text x="60" y="66" font-size="12.5" font-weight="700" fill="#374151">伸直 θ₂ = 0</text>
  <circle cx="60" cy="100" r="6" fill="#374151"/>
  <path d="M40,80 A30 30 0 0 1 82,78" fill="none" stroke="#EA580C" stroke-width="2" marker-end="url(#ivc-o)"/>
  <rect x="60" y="94" width="110" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="172" cy="100" r="5" fill="#6B7280"/>
  <rect x="172" y="94" width="100" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="274" cy="100" r="7" fill="#2563EB"/>
  <text x="200" y="130" font-size="12.5" font-weight="700" fill="#9A3412">m₁₁ = α + 2β(最大)</text>

  <!-- folded -->
  <text x="60" y="180" font-size="12.5" font-weight="700" fill="#374151">折疊 θ₂ = π</text>
  <circle cx="60" cy="216" r="6" fill="#374151"/>
  <path d="M40,196 A30 30 0 0 1 82,194" fill="none" stroke="#EA580C" stroke-width="2" marker-end="url(#ivc-o)"/>
  <rect x="60" y="210" width="110" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="172" cy="216" r="5" fill="#6B7280"/>
  <rect x="74" y="226" width="100" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="76" cy="232" r="7" fill="#2563EB"/>
  <text x="200" y="262" font-size="12.5" font-weight="700" fill="#065F46">m₁₁ = α − 2β(最小)</text>
  <text x="172" y="288" text-anchor="middle" font-size="11" fill="#6B7280">花式滑冰收手臂 = 同一個物理</text>

  <!-- divider -->
  <line x1="360" y1="48" x2="360" y2="292" stroke="#E5E7EB"/>

  <!-- RIGHT: cosine curve -->
  <!-- axes: x from 410..720 maps th2 0..pi ; y 250(bottom) .. 80(top) -->
  <line x1="410" y1="250" x2="726" y2="250" stroke="#9CA3AF" stroke-width="1.3"/>
  <line x1="410" y1="70" x2="410" y2="256" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="732" y="254" font-size="12" fill="#6B7280">θ₂</text>
  <text x="404" y="62" text-anchor="end" font-size="12" fill="#6B7280">m₁₁</text>
  <!-- dashed reference lines: top a+2b at y=95, bottom a-2b at y=215 -->
  <line x1="410" y1="95" x2="700" y2="95" stroke="#D1D5DB" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="410" y1="215" x2="700" y2="215" stroke="#D1D5DB" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="704" y="99" font-size="11" fill="#9A3412">α+2β</text>
  <text x="704" y="219" font-size="11" fill="#065F46">α−2β</text>
  <!-- cosine curve from (410,95) to (700,215): m = mid 155 + 60cos(t), t:0..pi -->
  <path d="M410,95 C455,95 480,110 555,155 C630,200 655,215 700,215" fill="none" stroke="#2563EB" stroke-width="2.6"/>
  <circle cx="410" cy="95" r="4" fill="#EA580C"/>
  <circle cx="700" cy="215" r="4" fill="#EA580C"/>
  <text x="424" y="86" font-size="11" fill="#9A3412">伸直</text>
  <text x="672" y="236" font-size="11" fill="#065F46">折疊</text>
  <!-- ticks -->
  <line x1="555" y1="250" x2="555" y2="245" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="555" y="266" text-anchor="middle" font-size="11" fill="#6B7280">π/2</text>
  <line x1="700" y1="250" x2="700" y2="245" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="700" y="266" text-anchor="middle" font-size="11" fill="#6B7280">π</text>
  <text x="568" y="290" text-anchor="middle" font-size="11.5" fill="#374151">同一顆馬達,負載慣量隨姿勢差 4β——定增益 PID 的困境</text>
</svg>
