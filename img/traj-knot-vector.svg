<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 332" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="860" height="332" fill="#ffffff"/>
  <text x="430" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">節點向量:參數軸上的分段點,曲線在這裡「接起來」</text>
  <text x="430" y="47" text-anchor="middle" font-size="11.5" fill="#6B7280">控制點決定曲線往哪走;節點決定曲線被切成幾段、每個接縫有多平滑</text>

  <!-- 上:單重節點 -->
  <rect x="20" y="64" width="820" height="112" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="40" y="86" font-size="12" font-weight="700" fill="#065F46">單重節點:每個接縫都不同位置</text>
  <text x="300" y="86" font-size="11" fill="#374151">三次 B-spline(p=3)在單重節點自動 <tspan font-weight="700">C² 連續</tspan> — 曲率不跳,車開過去不用突然打方向</text>
  <line x1="60" y1="132" x2="580" y2="132" stroke="#374151" stroke-width="1.8"/>
  <circle cx="60.0" cy="132" r="4.5" fill="#DC2626"/>
  <circle cx="190.0" cy="132" r="4.5" fill="#DC2626"/>
  <circle cx="320.0" cy="132" r="4.5" fill="#DC2626"/>
  <circle cx="450.0" cy="132" r="4.5" fill="#DC2626"/>
  <circle cx="580.0" cy="132" r="4.5" fill="#DC2626"/>
  <text x="60" y="152" text-anchor="middle" font-size="10" fill="#6B7280">u₀</text>
  <text x="190" y="152" text-anchor="middle" font-size="10" fill="#6B7280">u₁</text>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="#6B7280">u₂</text>
  <text x="450" y="152" text-anchor="middle" font-size="10" fill="#6B7280">u₃</text>
  <text x="580" y="152" text-anchor="middle" font-size="10" fill="#6B7280">u₄</text>
  <text x="125" y="118" text-anchor="middle" font-size="9.5" fill="#065F46">第 1 段</text>
  <text x="255" y="118" text-anchor="middle" font-size="9.5" fill="#065F46">第 2 段</text>
  <text x="385" y="118" text-anchor="middle" font-size="9.5" fill="#065F46">第 3 段</text>
  <text x="515" y="118" text-anchor="middle" font-size="9.5" fill="#065F46">第 4 段</text>
  <path d="M620,152 C660,152 660,108 700,108 C740,108 740,146 782,146" fill="none" stroke="#059669" stroke-width="2.6"/>
  <text x="700" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">曲線平滑接過去</text>

  <!-- 下:重複節點 -->
  <rect x="20" y="188" width="820" height="112" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
  <text x="40" y="210" font-size="12" font-weight="700" fill="#991B1B">節點重數 k:把 k 個接縫疊在同一個位置</text>
  <text x="330" y="210" font-size="11" fill="#374151">每疊一重就少一階連續性,降為 <tspan font-weight="700">C^(p−k)</tspan>;疊到 k = p 就變成 <tspan font-weight="700">C⁰ 尖角</tspan></text>
  <line x1="60" y1="256" x2="580" y2="256" stroke="#374151" stroke-width="1.8"/>
  <circle cx="60.0" cy="256" r="4.5" fill="#DC2626"/>
  <circle cx="190.0" cy="256" r="4.5" fill="#DC2626"/>
  <circle cx="320.0" cy="256" r="4.5" fill="#DC2626"/>
  <circle cx="320.0" cy="247" r="4.5" fill="#DC2626"/>
  <circle cx="320.0" cy="238" r="4.5" fill="#DC2626"/>
  <circle cx="580.0" cy="256" r="4.5" fill="#DC2626"/>
  <text x="60" y="276" text-anchor="middle" font-size="10" fill="#6B7280">u₀</text>
  <text x="190" y="276" text-anchor="middle" font-size="10" fill="#6B7280">u₁</text>
  <text x="320" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">u₂=u₃=u₄</text>
  <text x="580" y="276" text-anchor="middle" font-size="10" fill="#6B7280">u₅</text>
  <text x="320" y="222" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">三重</text>
  <path d="M620,272 C650,272 660,232 700,232 L700,232 C700,232 712,272 782,268" fill="none" stroke="#DC2626" stroke-width="2.6"/>
  <circle cx="700" cy="232" r="4" fill="#DC2626"/>
  <text x="700" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">曲線在此出現尖角</text>

  <rect x="20" y="312" width="820" height="14" rx="0" fill="none"/>
  <text x="40" y="322" font-size="10.5" fill="#374151"><tspan font-weight="700">實用意義</tspan>:平常全用單重節點 → 整條路自動 C²;只有在「這裡一定要停下來換向倒車」這種地方,才刻意疊到 p 重製造尖角。</text>
</svg>