  <path d="M270.9,85.0 L599.6,85.0 L599.6,314.5 L599.6,314.5 L594.0,314.3 L588.4,314.0 L582.9,313.7 L577.3,313.4 L571.7,313.1 L566.1,312.7 L560.6,312.4 L555.0,312.0 L549.4,311.6 L543.9,311.2 L538.3,310.7 L532.7,310.2 L527.1,309.7 L521.6,309.2 L516.0,308.6 L510.4,308.0 L504.9,307.3 L499.3,306.6 L493.7,305.8 L488.1,305.0 L482.6,304.2 L477.0,303.3 L471.4,302.3 L465.9,301.3 L460.3,300.2 L454.7,299.0 L449.1,297.7 L443.6,296.3 L438.0,294.9 L432.4,293.3 L426.9,291.6 L421.3,289.8 L415.7,287.8 L410.1,285.7 L404.6,283.4 L399.0,281.0 L393.4,278.3 L387.9,275.5 L382.3,272.4 L376.7,269.0 L371.1,265.4 L365.6,261.5 L360.0,257.2 L354.4,252.5 L348.9,247.5 L343.3,241.9 L337.7,235.9 L332.1,229.4 L326.6,222.2 L321.0,214.3 L315.4,205.7 L309.9,196.3 L304.3,185.9 L298.7,174.5 L293.1,161.9 L287.6,148.0 L282.0,132.7 L276.4,115.7 L270.9,96.9 L270.9,85.0 Z" fill="#FEF2F2"/>

