<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="it-ax" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
  </defs>
  <rect width="680" height="432" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">I²t 熱保護曲線:容許短時間大電流,不容許長時間中電流</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#6B7280">橘線:通過「2×容許 5s」「3×容許 0.5s」兩個示例點的跳脫曲線;灰虛線:純 I²t(t ∝ I⁻²)在同一點的樣子</text>

