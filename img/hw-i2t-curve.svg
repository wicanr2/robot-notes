  <line x1="100" y1="320" x2="100" y2="85" stroke="#374151" stroke-width="1.6" marker-end="url(#it-ax)"/>

  <!-- x ticks -->
  <line x1="100" y1="320" x2="100" y2="326" stroke="#374151" stroke-width="1.2"/><text x="100" y="338" text-anchor="middle" font-size="10" fill="#374151">1×</text>
  <line x1="192.9" y1="320" x2="192.9" y2="326" stroke="#374151" stroke-width="1.2"/><text x="192.9" y="338" text-anchor="middle" font-size="10" fill="#374151">1.5×</text>
  <line x1="285.7" y1="320" x2="285.7" y2="326" stroke="#374151" stroke-width="1.2"/><text x="285.7" y="338" text-anchor="middle" font-size="10" fill="#374151">2×</text>
  <line x1="378.6" y1="320" x2="378.6" y2="326" stroke="#374151" stroke-width="1.2"/><text x="378.6" y="338" text-anchor="middle" font-size="10" fill="#374151">2.5×</text>
  <line x1="471.4" y1="320" x2="471.4" y2="326" stroke="#374151" stroke-width="1.2"/><text x="471.4" y="338" text-anchor="middle" font-size="10" fill="#374151">3×</text>
  <line x1="564.3" y1="320" x2="564.3" y2="326" stroke="#374151" stroke-width="1.2"/><text x="564.3" y="338" text-anchor="middle" font-size="10" fill="#374151">3.5×</text>
  <text x="625" y="356" text-anchor="end" font-size="11" fill="#374151">電流倍數(× 額定電流)</text>

  <!-- y ticks -->
  <line x1="94" y1="320" x2="100" y2="320" stroke="#374151" stroke-width="1.2"/><text x="90" y="323.5" text-anchor="end" font-size="10" fill="#374151">0</text>
  <line x1="94" y1="284.6" x2="100" y2="284.6" stroke="#374151" stroke-width="1.2"/><text x="90" y="288" text-anchor="end" font-size="10" fill="#374151">1</text>
  <line x1="94" y1="249.2" x2="100" y2="249.2" stroke="#374151" stroke-width="1.2"/><text x="90" y="252.5" text-anchor="end" font-size="10" fill="#374151">2</text>
  <line x1="94" y1="213.9" x2="100" y2="213.9" stroke="#374151" stroke-width="1.2"/><text x="90" y="217.3" text-anchor="end" font-size="10" fill="#374151">3</text>
  <line x1="94" y1="178.5" x2="100" y2="178.5" stroke="#374151" stroke-width="1.2"/><text x="90" y="181.8" text-anchor="end" font-size="10" fill="#374151">4</text>
  <line x1="94" y1="143.1" x2="100" y2="143.1" stroke="#374151" stroke-width="1.2"/><text x="90" y="146.4" text-anchor="end" font-size="10" fill="#374151">5</text>
  <line x1="94" y1="107.7" x2="100" y2="107.7" stroke="#374151" stroke-width="1.2"/><text x="90" y="111" text-anchor="end" font-size="10" fill="#374151">6</text>
  <text x="45" y="200" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90 45 200)">容許時間 t(秒)</text>

  <!-- region labels -->
  <text x="185" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#065F46">安全</text>
  <text x="185" y="205" text-anchor="middle" font-size="11" fill="#065F46">(容許運轉)</text>
  <text x="490" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#991B1B">過熱跳脫</text>
  <text x="490" y="164" text-anchor="middle" font-size="11" fill="#991B1B">(不容許)</text>

  <text x="106" y="122" font-size="9.5" font-style="italic" fill="#6B7280">趨近 1×額定 → 可連續運轉</text>

  <!-- curve -->
  <path d="M270.9,96.9 L276.4,115.7 L282.0,132.7 L287.6,148.0 L293.1,161.9 L298.7,174.5 L304.3,185.9 L309.9,196.3 L315.4,205.7 L321.0,214.3 L326.6,222.2 L332.1,229.4 L337.7,235.9 L343.3,241.9 L348.9,247.5 L354.4,252.5 L360.0,257.2 L365.6,261.5 L371.1,265.4 L376.7,269.0 L382.3,272.4 L387.9,275.5 L393.4,278.3 L399.0,281.0 L404.6,283.4 L410.1,285.7 L415.7,287.8 L421.3,289.8 L426.9,291.6 L432.4,293.3 L438.0,294.9 L443.6,296.3 L449.1,297.7 L454.7,299.0 L460.3,300.2 L465.9,301.3 L471.4,302.3 L477.0,303.3 L482.6,304.2 L488.1,305.0 L493.7,305.8 L499.3,306.6 L504.9,307.3 L510.4,308.0 L516.0,308.6 L521.6,309.2 L527.1,309.7 L532.7,310.2 L538.3,310.7 L543.9,311.2 L549.4,311.6 L555.0,312.0 L560.6,312.4 L566.1,312.7 L571.7,313.1 L577.3,313.4 L582.9,313.7 L588.4,314.0 L594.0,314.3 L599.6,314.5" fill="none" stroke="#EA580C" stroke-width="3"/>

  <!-- reference points with drop-lines -->
  <line x1="100" y1="143.1" x2="285.7" y2="143.1" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="285.7" y1="143.1" x2="285.7" y2="320" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="285.7" cy="143.1" r="5" fill="#1F2937" stroke="#ffffff" stroke-width="1.5"/>
  <text x="295" y="139" font-size="10.5" font-weight="700" fill="#1F2937">2×額定:容許 5s</text>

  <line x1="100" y1="302.3" x2="471.4" y2="302.3" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="471.4" y1="302.3" x2="471.4" y2="320" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="471.4" cy="302.3" r="5" fill="#1F2937" stroke="#ffffff" stroke-width="1.5"/>
  <text x="480" y="295" font-size="10.5" font-weight="700" fill="#1F2937">3×額定:容許 0.5s</text>

  <!-- 純 I²t 參考線:t = 5·(2/I)² ,錨在 2×→5s -->
  <path d="M239.3,88.8 L248.3,101.1 L257.3,112.5 L266.3,122.9 L275.3,132.7 L284.3,141.7 L293.3,150.0 L302.3,157.8 L311.3,165.1 L320.3,171.9 L329.3,178.3 L338.3,184.2 L347.4,189.8 L356.4,195.1 L365.4,200.0 L374.4,204.7 L383.4,209.0 L392.4,213.2 L401.4,217.1 L410.4,220.8 L419.4,224.3 L428.4,227.6 L437.4,230.8 L446.4,233.8 L455.4,236.6 L464.4,239.3 L473.4,241.9 L482.4,244.4 L491.5,246.7 L500.5,248.9 L509.5,251.1 L518.5,253.1 L527.5,255.1 L536.5,256.9 L545.5,258.7 L554.5,260.4 L563.5,262.1 L572.5,263.6 L581.5,265.2 L590.5,266.6 L599.5,268.0"
        fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="512" y="236" font-size="10" fill="#475569">純 I²t:3× 時仍容許 2.2s</text>

  <!-- 圖例 -->
  <line x1="106" y1="372" x2="146" y2="372" stroke="#EA580C" stroke-width="3"/>
  <text x="154" y="376" font-size="10.5" fill="#1F2937">實際跳脫曲線(示例點連成)</text>
  <line x1="330" y1="372" x2="370" y2="372" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="378" y="376" font-size="10.5" fill="#1F2937">純 I²t:t ∝ I⁻²(錨在 2×→5s)</text>

  <!-- 說明 -->
  <rect x="100" y="386" width="500" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="112" y="401" font-size="10.5" fill="#1F2937">純 I²t 是絕熱繞組模型:I²·t 為常數。實際驅動器的跳脫曲線比它<tspan font-weight="700">更陡</tspan>——因為還疊了一道</text>
  <text x="112" y="416" font-size="10.5" fill="#1F2937">「峰值電流上限」,不讓大電流靠縮短時間換通行。看曲線要看廠商給的實際那張,不要自己用 I²t 外推。</text>
</svg>
