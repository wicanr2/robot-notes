<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="jdB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="jdO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="jdG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/></marker>
  </defs>
  <rect width="900" height="390" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Jacobian:同一個矩陣的三重身分</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6B7280">J(q) = ∂f/∂q ——— 速度、力、靈活度三個問題共用它</text>

  <!-- Lane 1:速度 -->
  <rect x="20" y="68" width="860" height="82" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="40" y="90" font-size="12" font-weight="700" fill="#1E3A8A">① 速度映射</text>
  <rect x="150" y="82" width="120" height="30" rx="7" fill="#ffffff" stroke="#3B82F6"/>
  <text x="210" y="102" text-anchor="middle" font-size="12" fill="#1F2937">關節速度 q̇</text>
  <line x1="276" y1="97" x2="336" y2="97" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#jdB)"/>
  <text x="306" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">J</text>
  <rect x="342" y="82" width="120" height="30" rx="7" fill="#ffffff" stroke="#3B82F6"/>
  <text x="402" y="102" text-anchor="middle" font-size="12" fill="#1F2937">末端速度 ẋ</text>
  <text x="490" y="94" font-size="10.5" fill="#374151">反過來 <tspan font-weight="700">q̇ = J⁻¹ ẋ</tspan> 就是微分逆運動學——</text>
  <text x="490" y="110" font-size="10.5" fill="#374151">不解位置方程組,一小步一小步逼近目標。所有數值 IK 都建在這條式子上。</text>
  <text x="150" y="134" font-size="9.5" fill="#6B7280">J 掉秩(det J = 0)時 J⁻¹ 不存在,這就是奇異點的數學定義。</text>

  <!-- Lane 2:力 -->
  <rect x="20" y="160" width="860" height="118" rx="9" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="40" y="182" font-size="12" font-weight="700" fill="#9A3412">② 力映射</text>
  <rect x="150" y="174" width="120" height="30" rx="7" fill="#ffffff" stroke="#F97316"/>
  <text x="210" y="194" text-anchor="middle" font-size="12" fill="#1F2937">末端受力 F</text>
  <line x1="276" y1="189" x2="336" y2="189" stroke="#F97316" stroke-width="2.2" marker-end="url(#jdO)"/>
  <text x="306" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Jᵀ</text>
  <rect x="342" y="174" width="120" height="30" rx="7" fill="#ffffff" stroke="#F97316"/>
  <text x="402" y="194" text-anchor="middle" font-size="12" fill="#1F2937">關節力矩 τ</text>

  <rect x="488" y="170" width="392" height="66" rx="7" fill="#ffffff" stroke="#FDBA74"/>
  <text x="500" y="188" font-size="10" fill="#6B7280">虛功原理:同一瞬間兩邊做的功必須相等</text>
  <text x="500" y="206" font-size="11" fill="#1F2937">τᵀ q̇ = Fᵀ ẋ = Fᵀ (J q̇) = (Jᵀ F)ᵀ q̇</text>
  <text x="500" y="226" font-size="11" font-weight="700" fill="#9A3412">對所有 q̇ 成立 → τ = Jᵀ F</text>

  <text x="150" y="224" font-size="10.5" font-weight="700" fill="#9A3412">轉置一下就是力,這不是巧合</text>
  <text x="150" y="242" font-size="9.5" fill="#374151">速度與力是對偶的量,共用同一個幾何。</text>
  <text x="150" y="260" font-size="9.5" fill="#374151">推論:量關節力矩就能反推末端受了多大的力——不裝力感測器也估得出來。</text>

  <!-- Lane 3:可操作度 -->
  <rect x="20" y="288" width="860" height="82" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="40" y="310" font-size="12" font-weight="700" fill="#065F46">③ 可操作度</text>
  <rect x="150" y="302" width="120" height="30" rx="7" fill="#ffffff" stroke="#10B981"/>
  <text x="210" y="322" text-anchor="middle" font-size="12" fill="#1F2937">J 的奇異值</text>
  <line x1="276" y1="317" x2="336" y2="317" stroke="#10B981" stroke-width="2.2" marker-end="url(#jdG)"/>
  <rect x="342" y="302" width="150" height="30" rx="7" fill="#ffffff" stroke="#10B981"/>
  <text x="417" y="322" text-anchor="middle" font-size="12" fill="#1F2937">w = √det(J Jᵀ)</text>
  <text x="512" y="314" font-size="10.5" fill="#374151">描述「末端往各個方向動的容易程度」。w 大代表構型靈活,</text>
  <text x="512" y="330" font-size="10.5" fill="#374151"><tspan font-weight="700">w → 0 就是奇異點</tspan>——所以它同時是「離奇異點還有多遠」的距離指標。</text>
  <text x="150" y="354" font-size="9.5" fill="#6B7280">冗餘手臂那無限多組解裡,最大化 w 是最常用的挑選判準之一。</text>
</svg>
