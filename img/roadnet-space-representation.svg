<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#6B7280"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">三種空間表示法:可以走的地方,是什麼樣的集合</text>

  <!-- ============ Panel 1: 自由空間 ============ -->
  <rect x="24" y="52" width="272" height="238" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="160" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">自由空間(佔據柵格)</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="0.8">
    <line x1="48" y1="92" x2="272" y2="92"/><line x1="48" y1="112" x2="272" y2="112"/>
    <line x1="48" y1="132" x2="272" y2="132"/><line x1="48" y1="152" x2="272" y2="152"/>
    <line x1="48" y1="172" x2="272" y2="172"/><line x1="48" y1="192" x2="272" y2="192"/>
    <line x1="48" y1="212" x2="272" y2="212"/><line x1="48" y1="232" x2="272" y2="232"/>
    <line x1="48" y1="92" x2="48" y2="232"/><line x1="76" y1="92" x2="76" y2="232"/>
    <line x1="104" y1="92" x2="104" y2="232"/><line x1="132" y1="92" x2="132" y2="232"/>
    <line x1="160" y1="92" x2="160" y2="232"/><line x1="188" y1="92" x2="188" y2="232"/>
    <line x1="216" y1="92" x2="216" y2="232"/><line x1="244" y1="92" x2="244" y2="232"/>
    <line x1="272" y1="92" x2="272" y2="232"/>
  </g>
  <!-- obstacles -->
  <rect x="104" y="112" width="56" height="40" fill="#CBD5E1"/>
  <rect x="188" y="172" width="56" height="40" fill="#CBD5E1"/>
  <!-- free path -->
  <path d="M56,224 C 90,224 84,176 104,164 C 128,150 150,168 176,160 C 208,150 214,120 258,104"
        fill="none" stroke="#F97316" stroke-width="3" marker-end="url(#ar)"/>
  <circle cx="56" cy="224" r="4.5" fill="#F97316"/>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#1F2937">任何未被佔據的格子都能走</text>
  <text x="160" y="275" text-anchor="middle" font-size="11.5" fill="#B91C1C">同起終點,障礙微變就換一條路</text>

  <!-- ============ Panel 2: 拓樸路網 ============ -->
  <rect x="314" y="52" width="272" height="238" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="450" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">拓樸路網(節點 + 有向邊)</text>

  <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#ag)">
    <line x1="352" y1="222" x2="352" y2="168"/>
    <line x1="352" y1="152" x2="352" y2="112"/>
    <line x1="368" y1="104" x2="428" y2="104"/>
    <line x1="444" y1="112" x2="444" y2="152"/>
    <line x1="444" y1="168" x2="444" y2="212"/>
    <line x1="460" y1="104" x2="524" y2="104"/>
    <line x1="460" y1="222" x2="524" y2="222"/>
    <line x1="540" y1="212" x2="540" y2="120"/>
  </g>
  <!-- highlighted route -->
  <g stroke="#F97316" stroke-width="3.4" fill="none" marker-end="url(#ar)">
    <line x1="352" y1="220" x2="352" y2="170"/>
    <line x1="352" y1="150" x2="352" y2="114"/>
    <line x1="370" y1="104" x2="426" y2="104"/>
    <line x1="462" y1="104" x2="522" y2="104"/>
  </g>
  <g fill="#ffffff" stroke="#10B981" stroke-width="2.2">
    <circle cx="352" cy="104" r="9"/><circle cx="352" cy="160" r="9"/><circle cx="352" cy="222" r="9"/>
    <circle cx="444" cy="104" r="9"/><circle cx="444" cy="160" r="9"/><circle cx="444" cy="222" r="9"/>
    <circle cx="540" cy="104" r="9"/><circle cx="540" cy="222" r="9"/>
  </g>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#1F2937">只准沿邊走;每次走同一段路</text>
  <text x="450" y="275" text-anchor="middle" font-size="11.5" fill="#065F46">可預測 → 衝突偵測變回幾何題</text>

  <!-- ============ Panel 3: 混合 ============ -->
  <rect x="604" y="52" width="272" height="238" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="740" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">混合:骨幹路網 + 局部自由</text>

  <!-- free halo -->
  <rect x="676" y="132" width="128" height="60" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="740" y="127" text-anchor="middle" font-size="11" fill="#9A3412">局部自由空間(繞人/繞臨時障礙)</text>

  <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#ag)">
    <line x1="642" y1="222" x2="642" y2="172"/>
    <line x1="658" y1="162" x2="668" y2="162"/>
    <line x1="812" y1="162" x2="822" y2="162"/>
    <line x1="838" y1="152" x2="838" y2="112"/>
  </g>
  <path d="M676,168 C 700,182 716,144 740,158 C 762,170 786,150 806,162"
        fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="7 4"/>
  <rect x="712" y="150" width="20" height="12" rx="3" fill="#94A3B8"/>
  <g fill="#ffffff" stroke="#10B981" stroke-width="2.2">
    <circle cx="642" cy="162" r="9"/><circle cx="642" cy="222" r="9"/>
    <circle cx="838" cy="162" r="9"/><circle cx="838" cy="104" r="9"/>
  </g>
  <text x="740" y="256" text-anchor="middle" font-size="12" fill="#1F2937">骨幹守規則,局部保留彈性</text>
  <text x="740" y="275" text-anchor="middle" font-size="11.5" fill="#9A3412">代價:兩套機制的交界要處理</text>

  <!-- ============ bottom summary ============ -->
  <rect x="24" y="304" width="852" height="56" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="42" y="326" font-size="12.5" font-weight="700" fill="#1E3A8A">為什麼多車場域傾向路網:</text>
  <text x="196" y="326" font-size="12.5" fill="#1F2937">搜尋空間小 2–4 個數量級(交管每 100ms 要重算)· 路徑可預測 · 交管規則能掛在拓樸上 · 現場人員維護得動</text>
  <text x="42" y="348" font-size="12.5" font-weight="700" fill="#B91C1C">要付的代價:</text>
  <text x="130" y="348" font-size="12.5" fill="#1F2937">里程比自由空間長(經驗上 5–15%,視路網密度)· 圖資要持續維護 · 圖與現場會漂移</text>
</svg>
