<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="cf-a" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="cf-a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">座標系接力:a-b-c → α-β → d-q</text>
  <text x="440" y="46" text-anchor="middle" font-size="12" fill="#6B7280">§16.3 —— Clarke 把三軸壓成兩軸;Park 用轉子角度 θ 把座標系「轉過去」貼上轉子</text>

  <!-- Box1: a-b-c -->
  <rect x="40" y="80" width="220" height="270" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="150" y="108" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E3A8A">a-b-c 座標系</text>
  <text x="150" y="126" text-anchor="middle" font-size="10.5" fill="#6B7280">(定子,永遠不動)</text>

  <circle cx="150" cy="200" r="55" fill="none" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="150" cy="200" r="3" fill="#1E3A8A"/>
  <line x1="150" y1="200" x2="203" y2="200" stroke="#1E3A8A" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <line x1="150" y1="200" x2="124" y2="246" stroke="#1E3A8A" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <line x1="150" y1="200" x2="124" y2="154" stroke="#1E3A8A" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <text x="217" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">a</text>
  <text x="110" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">b</text>
  <text x="110" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">c</text>

  <text x="150" y="278" text-anchor="middle" font-size="11.5" fill="#1F2937">三相線圈的三個軸</text>
  <text x="150" y="298" text-anchor="middle" font-size="11.5" fill="#1F2937">物理上釘在定子上</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="200" x2="328" y2="200" stroke="#F97316" stroke-width="2.4" marker-end="url(#cf-a)"/>
  <text x="294" y="184" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">Clarke</text>
  <text x="294" y="219" text-anchor="middle" font-size="9.5" fill="#9A3412">3 軸→2 軸</text>

  <!-- Box2: alpha-beta -->
  <rect x="330" y="80" width="220" height="270" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="440" y="108" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E3A8A">α-β 座標系</text>
  <text x="440" y="126" text-anchor="middle" font-size="10.5" fill="#6B7280">(仍是定子,仍不動)</text>

  <circle cx="440" cy="200" r="55" fill="none" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="440" cy="200" r="3" fill="#1E3A8A"/>
  <line x1="440" y1="200" x2="440" y2="147" stroke="#1E3A8A" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <line x1="440" y1="200" x2="493" y2="200" stroke="#1E3A8A" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <text x="440" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">β</text>
  <text x="507" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">α</text>

  <text x="440" y="278" text-anchor="middle" font-size="11.5" fill="#1F2937">3 軸 → 2 軸(數學簡化)</text>
  <text x="440" y="298" text-anchor="middle" font-size="11.5" fill="#1F2937">仍在定子系,仍然不動</text>
  <text x="440" y="318" text-anchor="middle" font-size="10.5" fill="#9A3412">α 與 a 同向:Clarke 不含旋轉</text>

  <!-- Arrow 2 -->
  <line x1="550" y1="200" x2="618" y2="200" stroke="#F97316" stroke-width="2.4" marker-end="url(#cf-a)"/>
  <text x="584" y="184" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">Park</text>
  <text x="584" y="219" text-anchor="middle" font-size="9.5" fill="#9A3412">用角度 θ 轉過去</text>

  <!-- Box3: d-q -->
  <rect x="620" y="80" width="220" height="270" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <text x="730" y="108" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065F46">d-q 座標系</text>
  <text x="730" y="126" text-anchor="middle" font-size="10.5" fill="#6B7280">(跟著轉子一起轉)</text>

  <circle cx="730" cy="200" r="55" fill="none" stroke="#D1FAE5" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- reference alpha axis (faint) -->
  <line x1="730" y1="200" x2="783" y2="200" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="790" y="205" text-anchor="middle" font-size="9.5" fill="#9CA3AF">(α)</text>
  <!-- angle arc theta -->
  <path d="M778,200 A48,48 0 0 0 758.4,169.4" fill="none" stroke="#F97316" stroke-width="1.4"/>
  <text x="770" y="188" font-size="10.5" font-weight="700" fill="#9A3412">θ</text>
  <!-- d axis with N marker -->
  <line x1="730" y1="200" x2="775" y2="168.4" stroke="#065F46" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <text x="792" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">d</text>
  <circle cx="775" cy="168.4" r="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="775" y="172" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">N</text>
  <!-- q axis -->
  <line x1="730" y1="200" x2="698.4" y2="155" stroke="#065F46" stroke-width="2.2" marker-end="url(#cf-a2)"/>
  <text x="686" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">q</text>
  <circle cx="730" cy="200" r="3" fill="#065F46"/>

  <text x="730" y="278" text-anchor="middle" font-size="11.5" fill="#1F2937">d 軸 = 磁鐵 N 極方向</text>
  <text x="730" y="298" text-anchor="middle" font-size="11.5" fill="#1F2937">q 軸 = 垂直 d(出扭矩)</text>

  <text x="440" y="392" text-anchor="middle" font-size="11.5" fill="#374151">θ 來自霍爾或編碼器(§11):即時量到的轉子角度,是 Park 變換唯一需要的輸入</text>
</svg>
