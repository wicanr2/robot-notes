<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="clArr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">免費 CI 上的 gz sim 驗證階梯:止步於 render 分水嶺</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6B7280">四關不需 render,每一關都可靠;跨過那條線就又慢又不穩</text>

  <!-- 左側成本軸 -->
  <line x1="40" y1="84" x2="40" y2="376" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#clArr)"/>
  <text x="28" y="230" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90 28 230)">越往下:證明的東西越多,也越貴</text>

  <!-- 關卡 1 -->
  <rect x="60" y="84" width="820" height="52" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="86" cy="110" r="13" fill="#10B981"/><text x="86" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="112" y="106" font-size="12.5" font-weight="700" fill="#065F46">靜態驗證</text>
  <text x="112" y="124" font-size="9.5" fill="#6B7280">gz sdf -k · 嚴格 XML 解析 · model:// 路徑對得上目錄</text>
  <line x1="470" y1="94" x2="470" y2="126" stroke="#D1FAE5"/>
  <text x="486" y="106" font-size="10.5" fill="#374151">抓:慣性張量違反三角不等式、註解裡的 --、缺模型目錄</text>
  <text x="486" y="124" font-size="9.5" font-weight="700" fill="#059669">不開模擬 → 最便宜、完全可靠</text>

  <!-- 關卡 2 -->
  <rect x="60" y="140" width="820" height="52" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="86" cy="166" r="13" fill="#10B981"/><text x="86" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="112" y="162" font-size="12.5" font-weight="700" fill="#065F46">headless 載入 world</text>
  <text x="112" y="180" font-size="9.5" fill="#6B7280">gz sim -s -r --iterations 300,再 grep log</text>
  <line x1="470" y1="150" x2="470" y2="182" stroke="#D1FAE5"/>
  <text x="486" y="162" font-size="10.5" fill="#374151">抓:Unable to find uri、include 解析不了、載入失敗</text>
  <text x="486" y="180" font-size="9.5" font-weight="700" fill="#059669">world 沒相機 → Sensors 閒置 → 不需 render</text>

  <!-- 關卡 3 -->
  <rect x="60" y="196" width="820" height="52" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="86" cy="222" r="13" fill="#10B981"/><text x="86" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="112" y="218" font-size="12.5" font-weight="700" fill="#065F46">機器人會不會動</text>
  <text x="112" y="236" font-size="9.5" fill="#6B7280">下速度指令,讀 /model/&lt;name&gt;/pose 比位移</text>
  <line x1="470" y1="206" x2="470" y2="238" stroke="#D1FAE5"/>
  <text x="486" y="218" font-size="10.5" fill="#374151">抓:plugin 沒掛上、關節沒接、原地空轉</text>
  <text x="486" y="236" font-size="9.5" font-weight="700" fill="#059669">純物理,不碰渲染 → 可靠</text>

  <!-- 關卡 4 -->
  <rect x="60" y="252" width="820" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="86" cy="278" r="13" fill="#3B82F6"/><text x="86" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="112" y="274" font-size="12.5" font-weight="700" fill="#1E3A8A">軌跡俯視圖</text>
  <text x="112" y="292" font-size="9.5" fill="#6B7280">pose 序列 → matplotlib 路徑圖(純 CPU)</text>
  <line x1="470" y1="262" x2="470" y2="294" stroke="#DBEAFE"/>
  <text x="486" y="274" font-size="10.5" fill="#374151">讓人「看到」機器人在場景裡走過的路線</text>
  <text x="486" y="292" font-size="9.5" font-weight="700" fill="#2563EB">視覺化 ≠ render:這一關把視覺產出救回可靠區</text>

  <!-- 分水嶺 -->
  <line x1="60" y1="320" x2="880" y2="320" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="330" y="309" width="240" height="22" rx="11" fill="#ffffff"/>
  <text x="450" y="325" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">render 分水嶺:免費 runner 沒有 GPU</text>

  <!-- 關卡 5 -->
  <rect x="60" y="336" width="820" height="52" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="86" cy="362" r="13" fill="#EF4444"/><text x="86" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="112" y="358" font-size="12.5" font-weight="700" fill="#991B1B">相機出圖 / 錄影</text>
  <text x="112" y="376" font-size="9.5" fill="#6B7280">llvmpipe 純軟體渲染 + --headless-rendering</text>
  <line x1="470" y1="346" x2="470" y2="378" stroke="#FECACA"/>
  <text x="486" y="358" font-size="10.5" fill="#374151">首張影格十幾秒、常整輪生不出圖;影片更不切實際</text>
  <text x="486" y="376" font-size="9.5" font-weight="700" fill="#DC2626">要穩 → GPU runner / 帶 GL 的 Docker / 本機截圖</text>

  <text x="450" y="410" text-anchor="middle" font-size="11.5" fill="#374151">分水嶺不是「能不能跑」而是「可不可靠」——第 5 關偶爾會成功一兩次,正因如此才更該當它不存在</text>
</svg>
