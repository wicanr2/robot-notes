<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="cpB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3B82F6"/></marker>
    <marker id="cpD" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker>
  </defs>
  <rect width="860" height="390" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Capture point:下一步踩在哪,才停得下來</text>
  <text x="430" y="48" text-anchor="middle" font-size="12" fill="#6B7280">側視圖。問的不是「現在穩不穩」,是「還救得回來嗎」</text>

  <!-- 倒單擺 -->
  <line x1="60" y1="248" x2="810" y2="248" stroke="#9CA3AF" stroke-width="2.5"/>
  <line x1="70" y1="132" x2="810" y2="132" stroke="#9CA3AF" stroke-width="1.1" stroke-dasharray="6,5"/>
  <text x="806" y="126" text-anchor="end" font-size="9" fill="#6B7280">模型假設重心高度 z₀ 固定 → 全程沒有位能變化</text>
  <line x1="160" y1="248" x2="196" y2="140" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="132" r="13" fill="#374151"/>
  <text x="200" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">重心</text>
  <line x1="216" y1="132" x2="286" y2="132" stroke="#3B82F6" stroke-width="2.6" marker-end="url(#cpB)"/>
  <text x="256" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">速度 v</text>
  <circle cx="160" cy="248" r="7" fill="#374151"/>
  <text x="160" y="270" text-anchor="middle" font-size="9.5" fill="#374151">現在的支撐腳</text>

  <!-- 三個區間 -->
  <rect x="120" y="238" width="120" height="10" fill="#10B981" opacity="0.55"/>
  <rect x="240" y="238" width="220" height="10" fill="#F97316" opacity="0.5"/>
  <rect x="460" y="238" width="350" height="10" fill="#EF4444" opacity="0.4"/>
  <line x1="240" y1="228" x2="240" y2="258" stroke="#374151" stroke-width="1.4"/>
  <line x1="460" y1="228" x2="460" y2="258" stroke="#374151" stroke-width="1.4"/>
  <text x="240" y="224" text-anchor="middle" font-size="9" fill="#6B7280">支撐多邊形邊界</text>
  <text x="460" y="224" text-anchor="middle" font-size="9" fill="#6B7280">最大跨步距離</text>

  <!-- CP 標記 -->
  <line x1="350" y1="192" x2="350" y2="232" stroke="#9A3412" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cpD)"/>
  <circle cx="350" cy="248" r="8" fill="#F97316"/>
  <text x="350" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">capture point</text>
  <text x="350" y="182" text-anchor="middle" font-size="10" fill="#9A3412">ξ = x + v·√(z₀ / g)</text>

  <g font-size="10">
    <text x="180" y="296" text-anchor="middle" font-weight="700" fill="#065F46">落在裡面</text>
    <text x="180" y="314" text-anchor="middle" fill="#374151">現在就停得下來</text>
    <text x="350" y="296" text-anchor="middle" font-weight="700" fill="#9A3412">落在外面但踩得到</text>
    <text x="350" y="314" text-anchor="middle" fill="#374151">停不下來,但下一步救得回來</text>
    <text x="620" y="296" text-anchor="middle" font-weight="700" fill="#991B1B">落在踩不到的地方</text>
    <text x="620" y="314" text-anchor="middle" fill="#374151">這一步救不回來,得靠再下一步——或者就是要跌倒了</text>
  </g>

  <rect x="20" y="330" width="820" height="52" rx="9" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="40" y="350" font-size="11" fill="#374151"><tspan font-weight="700">ZMP 的式子裡沒有速度,capture point 的式子裡速度是主角。</tspan>前者管腳與地面那個介面、而且只管此刻;後者管重心的速度收不收得掉。</text>
  <text x="40" y="370" font-size="11" fill="#374151">機制不是「動能被抬高重心吃掉」——高度固定,沒有位能可吃。是<tspan font-weight="700">踩對地方,把發散模態的係數歸零</tspan>,重心指數收斂到落腳點。</text>
</svg>
