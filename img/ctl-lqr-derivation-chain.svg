<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="lq-a" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="lq-g" markerWidth="9" markerHeight="9" refX="6" refY="3.2" orient="auto"><path d="M0,0 L6.5,3.2 L0,6.4 Z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="880" height="452" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">從無窮維最佳化,到一個 n×n 的代數方程</text>
  <text x="440" y="47" text-anchor="middle" font-size="12" fill="#6B7280">每一步右邊標的是那一步用掉的假設——三個假設換到一個閉式解</text>

  <!-- 步驟框 -->
  <g>
    <rect x="60" y="66" width="480" height="48" rx="7" fill="#F9FAFB" stroke="#374151" stroke-width="1.6"/>
    <text x="76" y="86" font-size="12" font-weight="700" fill="#374151">① 原問題</text>
    <text x="76" y="105" font-size="12" fill="#374151">min over u(·) 的 ∫₀^∞ (xᵀQx + uᵀRu) dt,受 ẋ = Ax + Bu 拘束</text>

    <rect x="60" y="130" width="480" height="48" rx="7" fill="#F9FAFB" stroke="#374151" stroke-width="1.6"/>
    <text x="76" y="150" font-size="12" font-weight="700" fill="#374151">② 換問法(Bellman)</text>
    <text x="76" y="169" font-size="12" fill="#374151">V(x) = 從這個狀態出發,剩下要付的最小總代價</text>

    <rect x="60" y="194" width="480" height="48" rx="7" fill="#F9FAFB" stroke="#374151" stroke-width="1.6"/>
    <text x="76" y="214" font-size="12" font-weight="700" fill="#374151">③ HJB 方程</text>
    <text x="76" y="233" font-size="12" fill="#374151">0 = min over u 的 [ xᵀQx + uᵀRu + ∇V(x)ᵀ(Ax + Bu) ]</text>

    <rect x="60" y="258" width="480" height="48" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="76" y="278" font-size="12" font-weight="700" fill="#1E40AF">④ 猜形狀</text>
    <text x="76" y="297" font-size="12" fill="#1E40AF">V(x) = xᵀPx —— 理由與代價為什麼是二次型完全相同</text>

    <rect x="60" y="322" width="480" height="48" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="76" y="342" font-size="12" font-weight="700" fill="#047857">⑤ 對 u 求導設零(R 正定 ⇒ 嚴格凸,唯一最小)</text>
    <text x="76" y="361" font-size="13" font-weight="700" fill="#047857">u* = −R⁻¹BᵀP x  ≡  −K x</text>

    <rect x="60" y="386" width="480" height="48" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="76" y="406" font-size="12" font-weight="700" fill="#047857">⑥ 代回 HJB,對所有 x 成立 ⇒ 中括號整個為零</text>
    <text x="76" y="425" font-size="13" font-weight="700" fill="#047857">AᵀP + PA − PBR⁻¹BᵀP + Q = 0   (Riccati)</text>
  </g>

  <!-- 連接箭頭 -->
  <g stroke="#374151" stroke-width="1.8" marker-end="url(#lq-a)">
    <line x1="300" y1="114" x2="300" y2="126"/>
    <line x1="300" y1="178" x2="300" y2="190"/>
    <line x1="300" y1="242" x2="300" y2="254"/>
    <line x1="300" y1="306" x2="300" y2="318"/>
    <line x1="300" y1="370" x2="300" y2="382"/>
  </g>

  <!-- 右側假設標註 -->
  <line x1="576" y1="66" x2="576" y2="434" stroke="#E5E7EB" stroke-width="1.4"/>
  <g font-size="11.5" fill="#6B7280">
    <line x1="540" y1="90" x2="592" y2="90" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#lq-g)"/>
    <text x="600" y="86" font-weight="700" fill="#B45309">假設 1:系統線性</text>
    <text x="600" y="103">A、B 只在工作點附近有效</text>

    <line x1="540" y1="154" x2="592" y2="154" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#lq-g)"/>
    <text x="600" y="150" font-weight="700" fill="#B45309">假設 2:時域無限</text>
    <text x="600" y="167">V 才會不含時間,K 才是常數</text>

    <line x1="540" y1="282" x2="592" y2="282" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#lq-g)"/>
    <text x="600" y="278" font-weight="700" fill="#B45309">假設 3:代價二次</text>
    <text x="600" y="295">V 才猜得中,才有閉式解</text>

    <line x1="540" y1="346" x2="592" y2="346" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#lq-g)"/>
    <text x="600" y="342" font-weight="700" fill="#B45309">R 必須嚴格正定</text>
    <text x="600" y="359">否則某方向控制免費 → K → ∞</text>

    <line x1="540" y1="410" x2="592" y2="410" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#lq-g)"/>
    <text x="600" y="406" font-weight="700" fill="#B45309">沒有不等式約束</text>
    <text x="600" y="423">有約束就走 MPC 那條路</text>
  </g>

  <rect x="600" y="188" width="250" height="60" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="725" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">u = −Kx 不是被假設的結構</text>
  <text x="725" y="226" text-anchor="middle" font-size="11" fill="#92400E">它是推導出來的:線性系統 + 二次代價</text>
  <text x="725" y="241" text-anchor="middle" font-size="11" fill="#92400E">⇒ 最佳控制律必然是狀態的線性函數</text>
</svg>
