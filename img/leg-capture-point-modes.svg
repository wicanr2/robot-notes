<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="820" height="372" fill="#ffffff"/>
  <text x="410" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">踩在 capture point 上 = 把發散模態的係數設成零</text>
  <text x="410" y="47" text-anchor="middle" font-size="11.5" fill="#6B7280">通解 u(t) = A·e^(ωt) + B·e^(−ωt),會跌倒的是 A 那一項</text>

  <rect x="20" y="62" width="382" height="216" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
  <text x="211" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">隨便踩(A ≠ 0)</text>
  <line x1="70" y1="248" x2="320" y2="248" stroke="#9CA3AF" stroke-width="1.6"/><line x1="70" y1="248" x2="70" y2="96" stroke="#9CA3AF" stroke-width="1.6"/><text x="325" y="252" font-size="9.5" fill="#6B7280">時間</text><text x="72" y="90" font-size="9.5" fill="#6B7280">u = x − p(重心離支點多遠)</text>
