  <g font-size="9.5">
    <line x1="86" y1="112" x2="108" y2="112" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,4"/>
    <text x="114" y="115" font-weight="700" fill="#991B1B">A·e^(ωt) 發散模態</text>
    <line x1="86" y1="132" x2="108" y2="132" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="5,4"/>
    <text x="114" y="135" font-weight="700" fill="#1D4ED8">B·e^(−ωt) 衰減模態</text>
    <line x1="86" y1="152" x2="108" y2="152" stroke="#1F2937" stroke-width="2.6"/>
    <text x="114" y="155" font-weight="700" fill="#1F2937">合起來 → 重心一路跑掉</text>
  </g>

  <rect x="418" y="62" width="382" height="216" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="609" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">踩在 ξ 上(A = 0)</text>
  <line x1="468" y1="248" x2="718" y2="248" stroke="#9CA3AF" stroke-width="1.6"/><line x1="468" y1="248" x2="468" y2="96" stroke="#9CA3AF" stroke-width="1.6"/><text x="723" y="252" font-size="9.5" fill="#6B7280">時間</text><text x="470" y="90" font-size="9.5" fill="#6B7280">u = x − p(重心離支點多遠)</text>
  <line x1="468" y1="248" x2="708" y2="248" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="474" y="241" font-size="9.5" font-weight="700" fill="#991B1B">A = 0</text>
  <path d="M468.0,204.6 L472.0,206.3 L476.0,207.9 L480.0,209.5 L484.0,211.0 L488.0,212.4 L492.0,213.8 L496.0,215.2 L500.0,216.5 L504.0,217.7 L508.0,218.9 L512.0,220.0 L516.0,221.1 L520.0,222.2 L524.0,223.2 L528.0,224.2 L532.0,225.1 L536.0,226.0 L540.0,226.9 L544.0,227.7 L548.0,228.5 L552.0,229.3 L556.0,230.0 L560.0,230.7 L564.0,231.4 L568.0,232.0 L572.0,232.6 L576.0,233.3 L580.0,233.8 L584.0,234.4 L588.0,234.9 L592.0,235.4 L596.0,235.9 L600.0,236.4 L604.0,236.9 L608.0,237.3 L612.0,237.7 L616.0,238.1 L620.0,238.5 L624.0,238.9 L628.0,239.2 L632.0,239.6 L636.0,239.9 L640.0,240.2 L644.0,240.5 L648.0,240.8 L652.0,241.1 L656.0,241.4 L660.0,241.6 L664.0,241.9 L668.0,242.1 L672.0,242.4 L676.0,242.6 L680.0,242.8 L684.0,243.0 L688.0,243.2 L692.0,243.4 L696.0,243.6 L700.0,243.7 L704.0,243.9 L708.0,244.1" fill="none" stroke="#059669" stroke-width="2.6"/>
  <g font-size="9.5">
    <text x="588" y="146" font-weight="700" fill="#991B1B">發散模態整條不見了</text>
    <text x="588" y="164" font-weight="700" fill="#065F46">只剩 B·e^(−ωt)</text>
    <text x="588" y="180" fill="#374151">指數收斂到落腳點,速度趨近零</text>
  </g>

  <rect x="20" y="290" width="780" height="66" rx="9" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="40" y="312" font-size="11.5" font-weight="700" fill="#374151">A = ½·[(x − p) + v/ω],所以「把 A 設成零」就是「把 p 踩在 x + v/ω 上」——這個點就是 capture point(v = 重心水平速度)</text>
  <text x="40" y="332" font-size="10.5" fill="#374151">收斂是<tspan font-weight="700">漸近</tspan>的:速度指數趨近零,不是在某個時刻剛好用完。整段過程重心高度不變,沒有位能參與。</text>
  <text x="40" y="350" font-size="10.5" fill="#991B1B">但 ξ = p 是<tspan font-weight="700">不穩定</tspan>平衡:踩偏 ε,誤差以 e^(ωt) 放大回來。現實中要每個控制週期重算、持續修正。</text>
</svg>