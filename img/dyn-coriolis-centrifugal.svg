<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="cc-o" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EA580C"/></marker>
    <marker id="cc-b" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="cc-g" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>
  <rect width="740" height="300" fill="#ffffff"/>
  <text x="370" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">C 的兩種成分,幾何來源不同</text>

  <!-- LEFT: centrifugal -->
  <text x="185" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">離心項:θ̇ᵢ²(平方)</text>
  <circle cx="120" cy="160" r="6" fill="#374151"/>
  <line x1="120" y1="160" x2="240" y2="120" stroke="#6B7280" stroke-width="3"/>
  <circle cx="240" cy="120" r="10" fill="#6B7280"/>
  <path d="M96,136 A36 36 0 0 1 142,126" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#cc-b)"/>
  <text x="112" y="118" font-size="12.5" font-weight="700" fill="#1E40AF">θ̇</text>
  <line x1="249" y1="117" x2="308" y2="97" stroke="#EA580C" stroke-width="2.6" marker-end="url(#cc-o)"/>
  <text x="252" y="82" font-size="12" font-weight="700" fill="#9A3412">m·r·θ̇²</text>
  <text x="185" y="212" text-anchor="middle" font-size="11.5" fill="#6B7280">自己轉,把自己的質量往外甩</text>
  <text x="185" y="230" text-anchor="middle" font-size="11.5" fill="#6B7280">轉速加倍 → 力變 4 倍</text>

  <!-- divider -->
  <line x1="370" y1="46" x2="370" y2="252" stroke="#E5E7EB"/>

  <!-- RIGHT: coriolis -->
  <text x="555" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Coriolis 項:兩個速度相乘(交叉)</text>
  <circle cx="475" cy="165" r="6" fill="#374151"/>
  <line x1="475" y1="165" x2="605" y2="115" stroke="#6B7280" stroke-width="3"/>
  <circle cx="565" cy="130" r="10" fill="#6B7280"/>
  <path d="M451,141 A36 36 0 0 1 497,131" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#cc-b)"/>
  <text x="467" y="122" font-size="12.5" font-weight="700" fill="#1E40AF">θ̇ᵢ</text>
  <!-- radial motion along link -->
  <line x1="576" y1="126" x2="616" y2="111" stroke="#059669" stroke-width="2.4" marker-end="url(#cc-g)"/>
  <text x="620" y="104" font-size="12.5" font-weight="700" fill="#065F46">ṙ(沿桿外移的速度)</text>
  <!-- coriolis force perpendicular -->
  <line x1="562" y1="120" x2="546" y2="80" stroke="#EA580C" stroke-width="2.6" marker-end="url(#cc-o)"/>
  <text x="466" y="78" font-size="13" font-weight="700" fill="#9A3412">2m·ṙ·θ̇ᵢ</text>
  <text x="555" y="212" text-anchor="middle" font-size="11.5" fill="#6B7280">兩個運動同時發生才存在:</text>
  <text x="555" y="230" text-anchor="middle" font-size="11.5" fill="#6B7280">邊轉邊外移,側向被拖一把</text>

  <text x="370" y="276" text-anchor="middle" font-size="12" fill="#374151">兩者都來自「慣量隨構型變」:M 是常數矩陣 ⇒ C ≡ 0</text>
</svg>
