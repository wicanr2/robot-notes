<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="pr1" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="800" height="480" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">上拉電阻:幫 open-drain 的「1」補回力氣</text>
  <text x="400" y="46" text-anchor="middle" font-size="12.5" fill="#6B7280">3.3V 經電阻接到輸出腳,沒人拉低時電阻把電位「拎」上去</text>

  <!-- device box (open-drain source) -->
  <rect x="40" y="110" width="200" height="210" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
  <text x="140" y="135" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991B1B">開路裝置</text>
  <text x="140" y="151" text-anchor="middle" font-size="11" fill="#6B7280">(霍爾開關 / I²C 從機…)</text>

  <circle cx="140" cy="215" r="18" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <line x1="140" y1="203" x2="140" y2="227" stroke="#991B1B" stroke-width="3"/>
  <line x1="130" y1="206" x2="130" y2="224" stroke="#991B1B" stroke-width="2"/>
  <line x1="116" y1="215" x2="130" y2="215" stroke="#991B1B" stroke-width="1.5"/>
  <text x="108" y="219" text-anchor="end" font-size="9" fill="#6B7280">G</text>
  <text x="140" y="193" text-anchor="middle" font-size="9" fill="#6B7280">D</text>
  <text x="140" y="242" text-anchor="middle" font-size="9" fill="#6B7280">S</text>
  <text x="164" y="219" font-size="10" fill="#991B1B">下管(NMOS)</text>

  <line x1="140" y1="178" x2="140" y2="197" stroke="#1F2937" stroke-width="2"/>
  <line x1="140" y1="178" x2="430" y2="178" stroke="#1F2937" stroke-width="2"/>

  <line x1="140" y1="233" x2="140" y2="270" stroke="#991B1B" stroke-width="2"/>
  <line x1="128" y1="270" x2="152" y2="270" stroke="#374151" stroke-width="2"/>
  <line x1="132" y1="275" x2="148" y2="275" stroke="#374151" stroke-width="2"/>
  <line x1="136" y1="280" x2="144" y2="280" stroke="#374151" stroke-width="2"/>
  <text x="140" y="297" text-anchor="middle" font-size="11" fill="#6B7280">GND</text>

  <!-- 3.3V + pull-up resistor -->
  <text x="430" y="70" text-anchor="middle" font-size="12" fill="#6B7280">3.3V</text>
  <line x1="430" y1="76" x2="430" y2="116" stroke="#3B82F6" stroke-width="2"/>
  <rect x="415" y="116" width="30" height="54" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="458" y="138" font-size="12.5" font-weight="700" fill="#9A3412">10kΩ</text>
  <text x="458" y="155" font-size="10.5" fill="#9A3412">上拉電阻</text>
  <line x1="430" y1="170" x2="430" y2="178" stroke="#1F2937" stroke-width="2"/>

  <!-- node -->
  <circle cx="430" cy="178" r="4.5" fill="#1F2937"/>
  <line x1="430" y1="178" x2="620" y2="178" stroke="#1F2937" stroke-width="2"/>

  <!-- receiver -->
  <rect x="620" y="140" width="160" height="76" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="700" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">接收端</text>
  <text x="700" y="188" text-anchor="middle" font-size="12" fill="#1E3A8A">STM32 GPIO</text>
  <text x="700" y="205" text-anchor="middle" font-size="10.5" fill="#6B7280">(輸入模式)</text>

  <!-- row 1: 輸出 0 -->
  <rect x="50" y="328" width="190" height="44" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="145" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">下管導通</text>
  <text x="145" y="364" text-anchor="middle" font-size="11" fill="#991B1B">(輸出 0)</text>
  <line x1="243" y1="350" x2="267" y2="350" stroke="#F97316" stroke-width="2" marker-end="url(#pr1)"/>

  <rect x="270" y="328" width="320" height="44" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="430" y="347" text-anchor="middle" font-size="12" fill="#991B1B">腳位被拉到 GND</text>
  <text x="430" y="364" text-anchor="middle" font-size="10.5" fill="#991B1B">(下管力氣 ≫ 10kΩ)</text>
  <line x1="593" y1="350" x2="617" y2="350" stroke="#F97316" stroke-width="2" marker-end="url(#pr1)"/>

  <rect x="620" y="328" width="130" height="44" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="685" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">讀到 0</text>

  <!-- row 2: 輸出 1 -->
  <rect x="50" y="388" width="190" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
  <text x="145" y="407" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">下管關閉</text>
  <text x="145" y="424" text-anchor="middle" font-size="11" fill="#065F46">(輸出 1)</text>
  <line x1="243" y1="410" x2="267" y2="410" stroke="#F97316" stroke-width="2" marker-end="url(#pr1)"/>

  <rect x="270" y="388" width="320" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
  <text x="430" y="407" text-anchor="middle" font-size="12" fill="#065F46">電阻把腳位拉到 3.3V</text>
  <text x="430" y="424" text-anchor="middle" font-size="10.5" fill="#065F46">(沒人拉低)</text>
  <line x1="593" y1="410" x2="617" y2="410" stroke="#F97316" stroke-width="2" marker-end="url(#pr1)"/>

  <rect x="620" y="388" width="130" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
  <text x="685" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">讀到 1</text>

  <text x="400" y="460" text-anchor="middle" font-size="11.5" fill="#6B7280">電阻太大(100kΩ)→ 上升慢、抗噪差;太小(1kΩ)→ 耗電;4.7k–10kΩ 是常用甜蜜點</text>
</svg>
