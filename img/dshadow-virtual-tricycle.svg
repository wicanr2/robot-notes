<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#1F2937">把 TB3 看成一台虛擬舵輪車</text>
  <text x="30" y="60" font-size="13" fill="#6B7280">韌體以為自己在控制舵輪車。兩座 bridge 只做這組換算,不夾限、不逾時,也不幫忙停車</text>

  <!-- TB3 body -->
  <circle cx="150" cy="300" r="62" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="120" y="226" width="60" height="16" rx="4" fill="#1F2937"/>
  <rect x="120" y="358" width="60" height="16" rx="4" fill="#1F2937"/>
  <circle cx="100" cy="300" r="6" fill="#FFFFFF" stroke="#6B7280"/>
  <circle cx="150" cy="300" r="4" fill="#1F2937"/>
  <text x="150" y="402" text-anchor="middle" font-size="13" fill="#374151">O:兩輪輪軸的中點</text>
  <text x="150" y="422" text-anchor="middle" font-size="12" fill="#6B7280">TB3 實際的差速車</text>
  <line x1="78" y1="234" x2="78" y2="366" stroke="#6B7280"/>
  <line x1="72" y1="234" x2="84" y2="234" stroke="#6B7280"/>
  <line x1="72" y1="366" x2="84" y2="366" stroke="#6B7280"/>
  <text x="62" y="305" text-anchor="middle" font-size="14" font-style="italic" fill="#374151">b</text>

  <!-- yaw arrow -->
  <path d="M194,223.8 A88,88 0 0,0 106,223.8" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#k)"/>
  <text x="150" y="204" text-anchor="middle" font-size="15" font-style="italic" fill="#374151">ω</text>

  <!-- wheelbase -->
  <line x1="150" y1="300" x2="420" y2="300" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="285" y="322" text-anchor="middle" font-size="13" fill="#374151">L:目標車型的軸距</text>

  <!-- virtual wheel -->
  <g transform="translate(420,300) rotate(-33.69)">
    <rect x="-28" y="-9" width="56" height="18" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <circle cx="420" cy="300" r="3.5" fill="#EA580C"/>
  <text x="420" y="356" text-anchor="middle" font-size="13" fill="#9A3412">虛擬舵輪(不存在)</text>

  <!-- construction -->
  <line x1="420" y1="215" x2="545" y2="215" stroke="#D1D5DB" stroke-dasharray="4 3"/>
  <line x1="545" y1="300" x2="545" y2="215" stroke="#D1D5DB" stroke-dasharray="4 3"/>
  <!-- components -->
  <path d="M420,300 H541" stroke="#1D4ED8" stroke-width="2.2" fill="none" marker-end="url(#b)"/>
  <text x="553" y="305" font-size="15" font-style="italic" fill="#1D4ED8">V</text>
  <path d="M420,300 V219" stroke="#1D4ED8" stroke-width="2.2" fill="none" marker-end="url(#b)"/>
  <text x="412" y="226" text-anchor="end" font-size="15" font-style="italic" fill="#1D4ED8">Lω</text>
  <path d="M420,300 L541.7,217.2" stroke="#EA580C" stroke-width="3" fill="none" marker-end="url(#o)"/>
  <text x="553" y="212" font-size="15" font-style="italic" fill="#EA580C">v</text>
  <path d="M465,300 A45,45 0 0,0 457.44,275.04" stroke="#374151" stroke-width="1.4" fill="none"/>
  <text x="474" y="292" font-size="15" font-style="italic" fill="#374151">δ</text>

  <!-- formula panel -->
  <rect x="600" y="86" width="340" height="350" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="620" y="116" font-size="15" font-weight="700" fill="#1F2937">舵輪點的速度</text>
  <text x="620" y="142" font-size="13" fill="#374151">車體以 ω 繞 O 轉、O 往前走 V。舵輪點</text>
  <text x="620" y="164" font-size="13" fill="#374151">在 O 前方 L,速度是 (V, Lω)。</text>
  <text x="620" y="198" font-size="14" font-weight="700" fill="#1D4ED8">命令方向:韌體 → TB3</text>
  <text x="620" y="222" font-size="13" fill="#374151">舵輪沿 δ 方向滾 v、不側滑:</text>
  <text x="620" y="247" font-size="14" fill="#1F2937">(V, Lω) = v (cos δ, sin δ)</text>
  <text x="620" y="273" font-size="14" font-weight="700" fill="#1F2937">⇒ V = v cos δ,ω = v sin δ / L</text>
  <text x="620" y="308" font-size="14" font-weight="700" fill="#059669">回送方向:TB3 → 韌體</text>
  <text x="620" y="332" font-size="13" fill="#374151">舵輪點的實際速度投影到滾動方向:</text>
  <text x="620" y="358" font-size="14" font-weight="700" fill="#1F2937">v_fb = V_a cos δ + L ω_a sin δ</text>
  <text x="620" y="388" font-size="13" fill="#374151">V_a = r (Δθ_r + Δθ_l) / (2Δt)</text>
  <text x="620" y="412" font-size="13" fill="#374151">ω_a = r (Δθ_r − Δθ_l) / (b Δt)</text>

  <text x="30" y="458" font-size="12" fill="#6B7280">TB3:r = 0.033 m、b = 0.160 m。δ = 90° 時 V = 0、v = Lω,就是原地轉。側向分量 −V_a sin δ + L ω_a cos δ 是側滑,回送時不看。</text>
</svg>
