<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 340" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="qw1" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#6B7280"/></marker>
  </defs>
  <rect width="830" height="340" fill="#ffffff"/>
  <text x="415" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">A/B 正交方波:在 A 的上升緣看 B 的瞬時值,就是方向資訊</text>

  <line x1="420" y1="48" x2="420" y2="280" stroke="#E5E7EB" stroke-width="1.4"/>

  <!-- panel titles -->
  <text x="220" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">正轉(A 領先 B)</text>
  <text x="620" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">反轉(B 領先 A)</text>

  <!-- ===== FORWARD panel ===== -->
  <text x="45" y="114" text-anchor="end" font-size="13" font-weight="700" fill="#1E40AF">A</text>
  <text x="45" y="204" text-anchor="end" font-size="13" font-weight="700" fill="#065F46">B</text>

  <!-- 90 deg phase marker between A rise(90) and B rise(110) -->
  <line x1="90" y1="74" x2="110" y2="74" stroke="#9A3412" stroke-width="1.3" marker-start="url(#qw1)" marker-end="url(#qw1)"/>
  <text x="100" y="64" text-anchor="middle" font-size="10.5" fill="#9A3412">90°(T/4)</text>

  <polyline points="70,125 90,125 90,95 130,95 130,125 170,125 170,95 210,95 210,125 250,125 250,95 290,95 290,125 330,125 330,95 370,95" fill="none" stroke="#3B82F6" stroke-width="2.2"/>
  <polyline points="70,215 110,215 110,185 150,185 150,215 190,215 190,185 230,185 230,215 270,215 270,185 310,185 310,215 350,215 350,185 370,185" fill="none" stroke="#10B981" stroke-width="2.2"/>

  <g stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3">
    <line x1="90" y1="82" x2="90" y2="228"/>
    <line x1="170" y1="82" x2="170" y2="228"/>
    <line x1="250" y1="82" x2="250" y2="228"/>
    <line x1="330" y1="82" x2="330" y2="228"/>
  </g>
  <g fill="#F97316">
    <circle cx="90" cy="215" r="3.6"/>
    <circle cx="170" cy="215" r="3.6"/>
    <circle cx="250" cy="215" r="3.6"/>
    <circle cx="330" cy="215" r="3.6"/>
  </g>
  <text x="90" y="246" text-anchor="middle" font-size="11" fill="#9A3412">B=0(低)</text>

  <text x="220" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">在 A 上升緣讀到 B=0 → 判定正轉</text>

  <!-- ===== REVERSE panel ===== -->
  <text x="455" y="114" text-anchor="end" font-size="13" font-weight="700" fill="#1E40AF">A</text>
  <text x="455" y="204" text-anchor="end" font-size="13" font-weight="700" fill="#065F46">B</text>

  <line x1="480" y1="74" x2="500" y2="74" stroke="#9A3412" stroke-width="1.3" marker-start="url(#qw1)" marker-end="url(#qw1)"/>
  <text x="490" y="64" text-anchor="middle" font-size="10.5" fill="#9A3412">90°(T/4)</text>

  <polyline points="460,125 500,125 500,95 540,95 540,125 580,125 580,95 620,95 620,125 660,125 660,95 700,95 700,125 740,125 740,95 780,95" fill="none" stroke="#3B82F6" stroke-width="2.2"/>
  <polyline points="460,215 480,215 480,185 520,185 520,215 560,215 560,185 600,185 600,215 640,215 640,185 680,185 680,215 720,215 720,185 760,185 760,215 780,215" fill="none" stroke="#10B981" stroke-width="2.2"/>

  <g stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3">
    <line x1="500" y1="82" x2="500" y2="228"/>
    <line x1="580" y1="82" x2="580" y2="228"/>
    <line x1="660" y1="82" x2="660" y2="228"/>
    <line x1="740" y1="82" x2="740" y2="228"/>
  </g>
  <g fill="#F97316">
    <circle cx="500" cy="185" r="3.6"/>
    <circle cx="580" cy="185" r="3.6"/>
    <circle cx="660" cy="185" r="3.6"/>
    <circle cx="740" cy="185" r="3.6"/>
  </g>
  <text x="500" y="246" text-anchor="middle" font-size="11" fill="#9A3412">B=1(高)</text>

  <text x="620" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2937">在 A 上升緣讀到 B=1 → 判定反轉</text>

  <!-- bottom rule -->
  <rect x="40" y="290" width="750" height="34" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="415" y="311" text-anchor="middle" font-size="12" fill="#374151">口訣:看 A 上升緣當下的 B 值 → B=0 判正轉、B=1 判反轉(實際極性依接線 / 硬體而定)</text>
</svg>
