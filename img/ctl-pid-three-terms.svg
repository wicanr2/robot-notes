    <text x="640" y="188" font-size="11.5" font-weight="700" fill="#DC2626">純 P:停在下面,差一截</text>
    <text x="640" y="205" font-size="10.5" fill="#DC2626">有輸出就必須有誤差 → 穩態誤差</text>
    <text x="676" y="106" font-size="11.5" font-weight="700" fill="#1D4ED8">P+I:貼上去了,但過衝</text>
    <text x="676" y="122" font-size="10.5" fill="#1D4ED8">積分撐住輸出,代價是慣性</text>
    <text x="656" y="230" font-size="11.5" font-weight="700" fill="#B45309">P+I+D:D 提供阻尼,壓住過衝</text>
    <text x="660" y="292" text-anchor="middle" font-size="11.5" fill="#6B7280">I 的真正理由是內模原理:要吃掉常值擾動,</text>
    <text x="660" y="312" text-anchor="middle" font-size="11.5" fill="#374151">迴路裡必須有一個積分器,這是唯一的結構</text>
  </g>
