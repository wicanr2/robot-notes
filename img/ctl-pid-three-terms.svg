  <!-- P:當下高度 -->
  <line x1="173.7" y1="250" x2="173.7" y2="208.3" stroke="#DC2626" stroke-width="2.6"/>
  <circle cx="173.7" cy="208.3" r="4" fill="#DC2626"/>
  <text x="178" y="246" font-size="12" font-weight="700" fill="#DC2626">P</text>
  <text x="190" y="246" font-size="11" fill="#DC2626">當下的高度</text>
  <!-- I:累積面積 -->
  <text x="86" y="160" font-size="12" font-weight="700" fill="#1D4ED8">I</text>
  <text x="96" y="160" font-size="11" fill="#1D4ED8">到現在累積的面積</text>
  <!-- D:切線斜率 -->
  <line x1="126.6" y1="185.4" x2="230.3" y2="235.9" stroke="#B45309" stroke-width="2.6"/>
  <text x="216" y="200" font-size="12" font-weight="700" fill="#B45309">D</text>
  <text x="228" y="200" font-size="11" fill="#B45309">當下的斜率</text>
  <text x="235" y="292" text-anchor="middle" font-size="11.5" fill="#6B7280">三個量都只從 e(t) 讀出來——PID 不知道車長什麼樣</text>
  <text x="235" y="312" text-anchor="middle" font-size="11.5" fill="#374151">輸入只有一個標量,這是它的能力也是它的天花板</text>

