<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 336" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><marker id="p3-a" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker></defs>
  <rect width="840" height="336" fill="#ffffff"/>
  <text x="420" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">P、I、D 從同一條誤差曲線讀三個不同的量</text>

  <!-- ===== 左:一條誤差曲線,三種讀法 ===== -->
  <text x="235" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">誤差 e(t) 隨時間衰減</text>
  <path d="M70.0,110.0 L74.7,117.5 L79.4,124.6 L84.1,131.3 L88.9,137.6 L93.6,143.7 L98.3,149.4 L103.0,154.7 L107.7,159.8 L112.4,164.7 L117.1,169.2 L121.9,173.5 L126.6,177.6 L131.3,181.5 L136.0,185.2 L140.7,188.6 L145.4,191.9 L150.1,195.0 L154.9,198.0 L159.6,200.8 L164.3,203.4 L169.0,205.9 L173.7,208.3 L173.7,250.0 L70.0,250.0 Z" fill="#DBEAFE" stroke="none" opacity="0.85"/>
