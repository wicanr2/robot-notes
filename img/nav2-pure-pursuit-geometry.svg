<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><marker id="pp-a" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker>
  <marker id="pp-o" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#B45309"/></marker></defs>
  <rect width="880" height="396" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">純追蹤:一條國中幾何,加上四層減速</text>

  <!-- 左:幾何推導 -->
  <text x="230" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">κ = 2y / L² 從哪來</text>
  <!-- 參考路徑 -->
  <path d="M100,300 C170,296 240,240 300,180 C340,140 380,116 420,104" fill="none" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="404" y="126" font-size="10.5" fill="#059669">參考路徑</text>
  <!-- 車體座標軸 -->
  <line x1="120" y1="280" x2="330" y2="280" stroke="#9CA3AF" stroke-width="1.3"/>
  <line x1="120" y1="280" x2="120" y2="90" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="336" y="284" font-size="10.5" fill="#6B7280">車體 x(前)</text>
  <text x="126" y="98" font-size="10.5" fill="#6B7280">車體 y(左)</text>
  <!-- 追蹤圓弧 -->
  <path d="M120,280 A212,212 0 0,0 300,180" fill="none" stroke="#1D4ED8" stroke-width="3"/>
  <!-- 圓心與半徑 -->
  <circle cx="120" cy="68" r="4.5" fill="#1D4ED8"/>
  <text x="130" y="66" font-size="10.5" font-weight="700" fill="#1D4ED8">圓心</text>
  <line x1="120" y1="68" x2="120" y2="276" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="106" y="180" text-anchor="end" font-size="13" font-weight="700" fill="#1D4ED8">R</text>
  <line x1="120" y1="68" x2="297" y2="178" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- 車 -->
  <rect x="98" y="268" width="34" height="20" rx="3" fill="#1F2937"/>
  <circle cx="120" cy="280" r="4" fill="#ffffff"/>
  <!-- lookahead 點 -->
  <circle cx="300" cy="180" r="6" fill="#B45309"/>
  <text x="310" y="176" font-size="11" font-weight="700" fill="#92400E">lookahead 點 (x, y)</text>
  <line x1="120" y1="280" x2="296" y2="182" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="196" y="244" font-size="13" font-weight="700" fill="#92400E">L</text>
  <!-- x, y 分量 -->
  <line x1="300" y1="280" x2="300" y2="186" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="120" y1="292" x2="300" y2="292" stroke="#6B7280" stroke-width="1.2"/>
  <text x="210" y="306" text-anchor="middle" font-size="11" fill="#6B7280">x</text>
  <text x="312" y="238" font-size="11" fill="#6B7280">y</text>
  <!-- 直角記號(切線) -->
  <path d="M120,268 L132,268 L132,280" fill="none" stroke="#1D4ED8" stroke-width="1.3"/>
  <text x="230" y="336" text-anchor="middle" font-size="11" fill="#374151">圓過原點且與車體 x 軸相切 ⟹ 圓心在 y 軸上</text>
  <text x="230" y="353" text-anchor="middle" font-size="11.5" fill="#374151">x² + (y − R)² = R²  ⟹  R = (x²+y²)/2y = L²/2y</text>
  <text x="230" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">κ = 1/R = 2y / L²   ,  ω = κ·v</text>

  <line x1="470" y1="44" x2="470" y2="380" stroke="#E5E7EB" stroke-width="1.4"/>

  <!-- 右:四層調節 -->
  <text x="676" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">RPP 疊上去的四層調節</text>
  <text x="676" y="72" text-anchor="middle" font-size="10.5" fill="#6B7280">每一層只做一件事:把線速度乘一個 ≤ 1 的係數</text>

  <rect x="500" y="86" width="352" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="514" y="104" font-size="11.5" font-weight="700" fill="#1E40AF">① 自適應 lookahead</text>
  <text x="514" y="121" font-size="11" fill="#1E40AF">L = clamp(|v|·t_lookahead, L_min, L_max) — 開快就看遠</text>

  <rect x="500" y="140" width="352" height="46" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="514" y="158" font-size="11.5" font-weight="700" fill="#047857">② 曲率調節</text>
  <text x="514" y="175" font-size="11" fill="#047857">彎太急(R &lt; R_min)就按比例降速</text>

  <rect x="500" y="194" width="352" height="60" rx="6" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/>
  <text x="514" y="212" font-size="11.5" font-weight="700" fill="#92400E">③ 障礙鄰近調節</text>
  <text x="514" y="229" font-size="11" fill="#92400E">從 costmap 值<tspan font-weight="700">反推</tspan>離障礙多遠(膨脹層的反函數)</text>
  <text x="514" y="246" font-size="10" fill="#92400E">與膨脹層參數綁死——改了那邊沒改這邊,反推就錯</text>

  <rect x="500" y="262" width="352" height="46" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="514" y="280" font-size="11.5" font-weight="700" fill="#B91C1C">④ 終點漸近調節</text>
  <text x="514" y="297" font-size="11" fill="#B91C1C">按剩餘距離線性降速,但保留一個下限速度</text>

  <line x1="676" y1="132" x2="676" y2="138" stroke="#374151" stroke-width="1.6" marker-end="url(#pp-a)"/>
  <line x1="676" y1="186" x2="676" y2="192" stroke="#374151" stroke-width="1.6" marker-end="url(#pp-a)"/>
  <line x1="676" y1="254" x2="676" y2="260" stroke="#374151" stroke-width="1.6" marker-end="url(#pp-a)"/>

  <text x="676" y="332" text-anchor="middle" font-size="11.5" fill="#374151">四層都只改 v,不改 κ ——<tspan font-weight="700">路徑形狀完全由那條幾何式決定</tspan></text>
  <text x="676" y="352" text-anchor="middle" font-size="11" fill="#6B7280">這就是它能跑到 4000 Hz 以上、也是它遇到障礙只能停的原因</text>
  <text x="676" y="374" text-anchor="middle" font-size="11" fill="#6B7280">要繞過去,得換成會在速度空間裡搜尋的 DWB 或 MPPI</text>
</svg>
