  <text x="480" y="374" font-size="11" fill="#374151">● 格子極大極粗(例 6×6 資料格)</text>
  <text x="480" y="392" font-size="11" fill="#374151">● 一圈粗黑邊框,專為角點偵測設計</text>
  <text x="480" y="416" font-size="12" font-weight="700" fill="#1F2937">容量:只有一個 ID(數百 ~ 數萬種)</text>
