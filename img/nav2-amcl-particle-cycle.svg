  <text x="325" y="372" text-anchor="middle" font-size="11" fill="#B91C1C">單一高斯(紅虛線)只能畫一個橢圓,</text>
  <text x="325" y="388" text-anchor="middle" font-size="11" fill="#B91C1C">它的中心落在中間——那是<tspan font-weight="700">牆</tspan>,兩條路都沒蓋到</text>
  <text x="325" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#5B21B6">粒子可以同時押注在兩條分岔上,高斯不行</text>

  <rect x="512" y="308" width="328" height="106" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="676" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">這就是「粒子」與「Adaptive」的分工</text>
  <text x="526" y="348" font-size="10.5" fill="#6B21A8"><tspan font-weight="700">粒子</tspan>:能表達多峰——不確定時可以同時保留</text>
  <text x="526" y="363" font-size="10.5" fill="#6B21A8">好幾個互相矛盾的假設,等後續量測來裁決</text>
  <text x="526" y="383" font-size="10.5" fill="#6B21A8"><tspan font-weight="700">Adaptive</tspan>:粒子數自己變——散得開就多用</text>
  <text x="526" y="398" font-size="10.5" fill="#6B21A8">幾顆,收斂了就少用,算力花在真正不確定時</text>
