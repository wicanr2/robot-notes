<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="dhA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/></marker>
    <marker id="dhTip" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
  <rect width="900" height="370" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">DH 參數為什麼恰好是 4 個</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#6B7280">不是慣例約定,是兩個約束各消掉一個自由度算出來的</text>

  <!-- Panel 1 -->
  <rect x="20" y="70" width="240" height="180" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="140" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">座標系隨便放</text>
  <text x="140" y="112" text-anchor="middle" font-size="10" fill="#6B7280">一般剛體變換</text>
  <g font-size="10">
    <rect x="40" y="126" width="60" height="24" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/><text x="70" y="142" text-anchor="middle" fill="#374151">平移 x</text>
    <rect x="110" y="126" width="60" height="24" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/><text x="140" y="142" text-anchor="middle" fill="#374151">平移 y</text>
    <rect x="180" y="126" width="60" height="24" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/><text x="210" y="142" text-anchor="middle" fill="#374151">平移 z</text>
    <rect x="40" y="158" width="60" height="24" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/><text x="70" y="174" text-anchor="middle" fill="#374151">轉 x</text>
    <rect x="110" y="158" width="60" height="24" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/><text x="140" y="174" text-anchor="middle" fill="#374151">轉 y</text>
    <rect x="180" y="158" width="60" height="24" rx="6" fill="#F3F4F6" stroke="#9CA3AF"/><text x="210" y="174" text-anchor="middle" fill="#374151">轉 z</text>
  </g>
  <text x="140" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#374151">6 個參數</text>
  <text x="140" y="232" text-anchor="middle" font-size="9.5" fill="#6B7280">每段都要 6 個數,n 段就 6n 個</text>

  <!-- Panel 2:兩個約束 -->
  <rect x="300" y="70" width="300" height="180" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="450" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">DH 對「怎麼放」下兩個約束</text>

  <!-- 小幾何圖 -->
  <line x1="360" y1="190" x2="360" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#dhTip)"/>
  <text x="352" y="114" font-size="10" fill="#374151">zᵢ₋₁</text>
  <line x1="360" y1="160" x2="452" y2="160" stroke="#F97316" stroke-width="2" marker-end="url(#dhTip)"/>
  <text x="458" y="164" font-size="10" fill="#9A3412">xᵢ</text>
  <path d="M360,146 L374,146 L374,160" fill="none" stroke="#3B82F6" stroke-width="1.4"/>
  <circle cx="360" cy="160" r="4" fill="#3B82F6"/>

  <text x="490" y="132" font-size="10.5" fill="#1F2937">① xᵢ <tspan font-weight="700">垂直於</tspan> zᵢ₋₁</text>
  <text x="490" y="152" font-size="9.5" fill="#6B7280">→ 消掉一個轉動自由度</text>
  <text x="490" y="178" font-size="10.5" fill="#1F2937">② xᵢ 與 zᵢ₋₁ <tspan font-weight="700">相交</tspan></text>
  <text x="490" y="198" font-size="9.5" fill="#6B7280">→ 消掉一個平移自由度</text>
  <text x="450" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">6 − 2 = 4</text>

  <!-- Panel 3 -->
  <rect x="640" y="70" width="240" height="180" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <text x="760" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">剩下的四個</text>
  <g font-size="10">
    <rect x="656" y="110" width="100" height="26" rx="6" fill="#ffffff" stroke="#10B981"/><text x="706" y="127" text-anchor="middle" fill="#065F46">a 連桿長</text>
    <rect x="764" y="110" width="100" height="26" rx="6" fill="#ffffff" stroke="#10B981"/><text x="814" y="127" text-anchor="middle" fill="#065F46">α 連桿扭角</text>
    <rect x="656" y="144" width="100" height="26" rx="6" fill="#FFF7ED" stroke="#F97316"/><text x="706" y="161" text-anchor="middle" fill="#9A3412">d 連桿偏距</text>
    <rect x="764" y="144" width="100" height="26" rx="6" fill="#FFF7ED" stroke="#F97316"/><text x="814" y="161" text-anchor="middle" fill="#9A3412">θ 關節角</text>
  </g>
  <text x="760" y="192" text-anchor="middle" font-size="9.5" fill="#6B7280">綠色兩個是機構固定的常數</text>
  <text x="760" y="208" text-anchor="middle" font-size="9.5" fill="#9A3412">橘色兩個其中一個是關節變數</text>
  <text x="760" y="232" text-anchor="middle" font-size="9.5" fill="#374151">轉動關節變 θ・移動關節變 d</text>

  <line x1="264" y1="160" x2="294" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#dhA)"/>
  <line x1="604" y1="160" x2="634" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#dhA)"/>

  <text x="450" y="286" text-anchor="middle" font-size="11.5" fill="#374151">於是一台六軸手臂的完整幾何,就是一張 6 列 × 4 欄的表</text>
  <rect x="150" y="300" width="600" height="42" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
  <text x="450" y="317" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991B1B">最常見的坑:DH 有 standard 與 modified(Craig)兩種慣例</text>
  <text x="450" y="333" text-anchor="middle" font-size="9.5" fill="#374151">同一台手臂兩種寫法的參數表不一樣,抄表前要先確認是哪一種</text>
</svg>
