<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">MOSFET:電壓控制的大電流開關</text>
  <text x="340" y="46" text-anchor="middle" font-size="12" fill="#6B7280">§12.2 三支腳:D 汲極 / G 閘極 / S 源極</text>

  <!-- symbol -->
  <line x1="200" y1="90" x2="200" y2="150" stroke="#1F2937" stroke-width="2.4"/>
  <rect x="192" y="150" width="16" height="110" rx="2" fill="#CBD5E1" stroke="#374151" stroke-width="1.6"/>
  <line x1="200" y1="260" x2="200" y2="320" stroke="#1F2937" stroke-width="2.4"/>

  <rect x="150" y="170" width="8" height="70" fill="#1F2937"/>
  <line x1="150" y1="205" x2="90" y2="205" stroke="#1F2937" stroke-width="2.4"/>

  <circle cx="200" cy="90" r="4.5" fill="#1F2937"/>
  <circle cx="200" cy="320" r="4.5" fill="#1F2937"/>
  <circle cx="90" cy="205" r="4.5" fill="#1F2937"/>

  <text x="216" y="96" font-size="15" font-weight="700" fill="#1F2937">D</text>
  <text x="78" y="210" text-anchor="end" font-size="15" font-weight="700" fill="#1F2937">G</text>
  <text x="216" y="330" font-size="15" font-weight="700" fill="#1F2937">S</text>

  <text x="200" y="350" text-anchor="middle" font-size="10.5" fill="#9CA3AF">(N 通道 MOSFET,示意)</text>

  <!-- leaders -->
  <path d="M200,90 L420,90" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <path d="M90,205 L90,135 L420,135" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <path d="M200,320 L200,260 L420,260" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>

  <!-- D box -->
  <rect x="420" y="56" width="220" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="436" y="86" font-size="14" font-weight="700" fill="#1E3A8A">D(Drain 汲極)</text>

  <!-- G box -->
  <rect x="420" y="116" width="220" height="130" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="436" y="138" font-size="14" font-weight="700" fill="#9A3412">G(Gate 閘極)</text>
  <text x="436" y="160" font-size="11.5" fill="#1F2937">控制端:加電壓 →</text>
  <text x="436" y="178" font-size="11.5" fill="#1F2937">D-S 之間導通</text>
  <text x="436" y="200" font-size="10.5" fill="#374151">像繼電器的線圈,</text>
  <text x="436" y="216" font-size="10.5" fill="#374151">但每秒可開關 2 萬次、</text>
  <text x="436" y="232" font-size="10.5" fill="#374151">無機械磨損</text>

  <!-- S box -->
  <rect x="420" y="256" width="220" height="56" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>
  <text x="436" y="290" font-size="14" font-weight="700" fill="#1F2937">S(Source 源極)</text>
</svg>
