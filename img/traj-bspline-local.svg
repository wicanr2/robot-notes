  <path d="M120.0,205.0 L133.6,198.3 L147.6,192.0 L161.8,186.2 L176.3,180.9 L191.0,176.0 L205.9,171.6 L221.1,167.6 L236.5,164.0 L252.1,160.8 L267.8,158.0 L283.7,155.6 L299.8,153.6 L316.0,151.9 L332.4,150.6 L348.9,149.6 L365.4,149.0 L382.1,148.7 L398.8,148.6 L415.6,148.9 L432.5,149.5 L449.4,150.3 L466.3,151.5 L483.2,152.8 L500.2,154.5 L517.1,156.3 L534.0,158.4 L550.8,160.7 L567.6,163.2 L584.3,165.9 L600.9,168.7 L617.5,171.8 L633.9,175.0 L650.2,178.3 L666.4,181.8 L682.5,185.4 L698.3,189.1 L714.0,193.0 L729.6,196.9 L744.9,200.9 L760.0,205.0" fill="none" stroke="#EF4444" stroke-width="3"/>
  <circle cx="120" cy="205" r="5" fill="#94A3B8"/><circle cx="560" cy="150" r="5" fill="#94A3B8"/><circle cx="760" cy="205" r="5" fill="#94A3B8"/>
  <circle cx="300" cy="150" r="5" fill="#CBD5E1"/><circle cx="300" cy="112" r="6.5" fill="#EF4444"/>
  <line x1="300" y1="146" x2="300" y2="120" stroke="#EF4444" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="792" y="140" font-size="11" fill="#7F1D1D">兩端之間全部</text>
  <text x="792" y="158" font-size="11" fill="#7F1D1D">跟著位移</text>
  <text x="792" y="180" font-size="10.5" fill="#B91C1C">→ 整條要重驗</text>

  <rect x="24" y="248" width="852" height="164" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="270" font-size="13.5" font-weight="700" fill="#065F46">三次 B-spline:只影響鄰近 p+1 = 4 個區段</text>
  <path d="M210.0,338.3 L216.9,337.6 L223.8,337.3 L230.6,337.2 L237.5,337.5 L244.4,338.1 L251.2,338.8 L258.1,339.6 L265.0,340.6 L271.9,341.7 L278.8,342.7 L285.6,343.7 L292.5,344.7 L299.4,345.5 L306.2,346.1 L313.1,346.5 L320.0,346.7 L320.0,346.7 L326.9,346.5 L333.8,346.1 L340.6,345.4 L347.5,344.6 L354.4,343.6 L361.2,342.4 L368.1,341.2 L375.0,340.0 L381.9,338.8 L388.8,337.6 L395.6,336.4 L402.5,335.4 L409.4,334.6 L416.2,333.9 L423.1,333.5 L430.0,333.3 L430.0,333.3 L436.9,333.5 L443.8,333.9 L450.6,334.6 L457.5,335.4 L464.4,336.4 L471.2,337.6 L478.1,338.8 L485.0,340.0 L491.9,341.2 L498.8,342.4 L505.6,343.6 L512.5,344.6 L519.4,345.4 L526.2,346.1 L533.1,346.5 L540.0,346.7 L540.0,346.7 L546.9,346.5 L553.8,346.1 L560.6,345.5 L567.5,344.7 L574.4,343.7 L581.2,342.7 L588.1,341.7 L595.0,340.6 L601.9,339.6 L608.7,338.8 L615.6,338.1 L622.5,337.5 L629.4,337.2 L636.2,337.3 L643.1,337.6 L650.0,338.3" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M210.0,338.3 L216.9,337.6 L223.8,337.2 L230.6,337.2 L237.5,337.4 L244.4,337.9 L251.2,338.4 L258.1,339.1 L265.0,339.8 L271.9,340.5 L278.8,341.2 L285.6,341.7 L292.5,342.0 L299.4,342.1 L306.2,341.9 L313.1,341.3 L320.0,340.3 L320.0,340.3 L326.9,338.9 L333.8,337.1 L340.6,335.0 L347.5,332.6 L354.4,330.0 L361.2,327.3 L368.1,324.6 L375.0,321.8 L381.9,319.1 L388.8,316.6 L395.6,314.2 L402.5,312.2 L409.4,310.4 L416.2,309.1 L423.1,308.3 L430.0,308.0 L430.0,308.0 L436.9,308.3 L443.8,309.1 L450.6,310.4 L457.5,312.2 L464.4,314.2 L471.2,316.6 L478.1,319.1 L485.0,321.8 L491.9,324.6 L498.8,327.3 L505.6,330.0 L512.5,332.6 L519.4,335.0 L526.2,337.1 L533.1,338.9 L540.0,340.3 L540.0,340.3 L546.9,341.3 L553.8,341.9 L560.6,342.1 L567.5,342.0 L574.4,341.7 L581.2,341.2 L588.1,340.5 L595.0,339.8 L601.9,339.1 L608.7,338.4 L615.6,337.9 L622.5,337.4 L629.4,337.2 L636.2,337.2 L643.1,337.6 L650.0,338.3" fill="none" stroke="#10B981" stroke-width="3"/>
  <g fill="#94A3B8"><circle cx="100" cy="390" r="4.5"/><circle cx="210" cy="320" r="4.5"/><circle cx="320" cy="360" r="4.5"/><circle cx="540" cy="360" r="4.5"/><circle cx="650" cy="320" r="4.5"/><circle cx="760" cy="390" r="4.5"/></g>
  <circle cx="430" cy="320" r="5" fill="#CBD5E1"/><circle cx="430" cy="282" r="6.5" fill="#10B981"/>
  <line x1="430" y1="316" x2="430" y2="290" stroke="#10B981" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="792" y="320" font-size="11" fill="#064E3B">兩端完全沒動</text>
  <text x="792" y="338" font-size="10.5" fill="#047857">→ 只要重驗</text>
  <text x="792" y="354" font-size="10.5" fill="#047857">被影響的那幾段</text>

  <text x="24" y="442" font-size="11.5" fill="#1F2937"><tspan font-weight="700">原因在基底:</tspan>Nᵢ,ₚ(u) 只在 [uᵢ, uᵢ₊ₚ₊₁) 上非零,所以動一個控制點只牽動 p+1 個區段。連續性也是內建的 —— p 次 B-spline 在單重節點自動 C^(p−1),</text>
  <text x="24" y="460" font-size="11.5" fill="#1F2937">因此三次天生 C²,不必像一段段接 Bézier 那樣逐個接點手動湊條件。</text>
</svg>
