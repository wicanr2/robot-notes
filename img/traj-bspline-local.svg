<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">局部支撐:為什麼多段路徑要用 B-spline 而不是一段段 Bézier</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6B7280">同樣把一個控制點往上移(灰虛線 → 彩色實線),看曲線哪些部分跟著變</text>

  <rect x="24" y="68" width="852" height="164" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="44" y="90" font-size="13.5" font-weight="700" fill="#991B1B">Bézier:動一點,整條都變</text>
