<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 397" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="od1" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
    <marker id="od2" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="od3" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/></marker>
  </defs>
  <rect width="980" height="397" fill="#ffffff"/>
  <text x="490" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">光學增量式編碼器的構造:側視光路 + 正視碼盤</text>

  <line x1="625" y1="50" x2="625" y2="345" stroke="#E5E7EB" stroke-width="1.4"/>

  <!-- ===== LEFT: side view ===== -->
  <text x="30" y="52" font-size="14" font-weight="700" fill="#1F2937">側視</text>

  <rect x="40" y="208" width="75" height="44" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="77" y="234" text-anchor="middle" font-size="12.5" fill="#9A3412">LED 光源</text>

  <line x1="115" y1="230" x2="224" y2="230" stroke="#F97316" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#od1)"/>
  <text x="168" y="222" text-anchor="middle" font-size="11" fill="#9A3412">光</text>

  <rect x="224" y="170" width="26" height="120" fill="none" stroke="#374151" stroke-width="1.3"/>
  <rect x="224" y="170" width="26" height="15" fill="#1F2937"/>
  <rect x="224" y="200" width="26" height="15" fill="#1F2937"/>
  <rect x="224" y="230" width="26" height="15" fill="#1F2937"/>
  <rect x="224" y="260" width="26" height="15" fill="#1F2937"/>
  <text x="237" y="158" text-anchor="middle" font-size="11" fill="#374151">碼盤邊緣(隨軸轉)</text>
  <text x="237" y="304" text-anchor="middle" font-size="10.5" fill="#6B7280">透光縫 / 遮光齒等距排列</text>

  <line x1="250" y1="205" x2="345" y2="182" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#od2)"/>
  <rect x="345" y="160" width="125" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="407" y="186" text-anchor="middle" font-size="12.5" fill="#1E3A8A">光電接收器 A</text>

  <line x1="250" y1="255" x2="345" y2="280" stroke="#10B981" stroke-width="1.6" marker-end="url(#od3)"/>
  <rect x="345" y="258" width="125" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="407" y="284" text-anchor="middle" font-size="12.5" fill="#065F46">光電接收器 B</text>

  <polyline points="480,190 500,190 500,172 520,172 520,190 550,190 550,172 570,172 570,190 590,190" fill="none" stroke="#3B82F6" stroke-width="1.6"/>
  <polyline points="480,290 505,290 505,272 525,272 525,290 555,290 555,272 575,272 575,290 590,290" fill="none" stroke="#10B981" stroke-width="1.6"/>

  <text x="300" y="322" text-anchor="middle" font-size="11.5" fill="#374151">轉動時:透光 → 遮光 → 透光…</text>
  <text x="300" y="339" text-anchor="middle" font-size="11" fill="#6B7280">接收器輸出方波(A、B 相位差 → 見下一張圖)</text>

  <!-- ===== RIGHT: front view of disc ===== -->
  <text x="760" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">正視碼盤</text>

  <circle cx="760" cy="230" r="112" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="760" cy="230" r="98.5" fill="none" stroke="#E5E7EB" stroke-width="6"/>
  <circle cx="858.5" cy="230" r="6" fill="#F97316"/>
  <text x="868" y="234" font-size="11" font-weight="700" fill="#9A3412">Z</text>

  <g stroke="#1F2937" stroke-width="9" stroke-linecap="butt">
    <line x1="812" y1="230" x2="845" y2="230"/>
    <line x1="796.8" y1="266.8" x2="820.1" y2="290.1"/>
    <line x1="760" y1="282" x2="760" y2="315"/>
    <line x1="723.2" y1="266.8" x2="699.9" y2="290.1"/>
    <line x1="708" y1="230" x2="675" y2="230"/>
    <line x1="723.2" y1="193.2" x2="699.9" y2="169.9"/>
    <line x1="760" y1="178" x2="760" y2="145"/>
    <line x1="796.8" y1="193.2" x2="820.1" y2="169.9"/>
  </g>

  <circle cx="760" cy="230" r="9" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
  <line x1="753" y1="230" x2="767" y2="230" stroke="#374151" stroke-width="1"/>
  <line x1="760" y1="223" x2="760" y2="237" stroke="#374151" stroke-width="1"/>
  <text x="760" y="256" text-anchor="middle" font-size="10.5" fill="#374151">軸心</text>

  <!-- legend row spanning full width -->
  <rect x="140" y="364" width="16" height="14" fill="#1F2937"/>
  <text x="162" y="375" font-size="11.5" fill="#1F2937">= 遮光齒</text>
  <rect x="280" y="364" width="16" height="14" fill="#F3F4F6" stroke="#94A3B8"/>
  <text x="302" y="375" font-size="11.5" fill="#1F2937">= 透光縫(例:1024 縫/圈)</text>
  <circle cx="568" cy="371" r="7" fill="#F3F4F6" stroke="#374151"/>
  <text x="582" y="375" font-size="11.5" fill="#1F2937">= 軸心</text>
  <circle cx="668" cy="371" r="7" fill="#F97316"/>
  <text x="682" y="375" font-size="11.5" fill="#9A3412">= Z 相:每圈觸發一次,當「歸零記號」</text>
</svg>
