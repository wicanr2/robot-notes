<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Duty factor:門檻不是固定的 0.5,而是 k/n</text>
  <text x="440" y="48" text-anchor="middle" font-size="12" fill="#6B7280">橫軸是一個步態週期,深色 = 這隻腳踩在地上</text>

  <!-- walk -->
  <rect x="20" y="66" width="840" height="128" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7"/>
  <text x="38" y="88" font-size="12.5" font-weight="700" fill="#065F46">walk(慢走)</text>
  <text x="150" y="88" font-size="11" fill="#065F46">duty factor ≈ 0.75</text>
  <text x="330" y="88" font-size="11" font-weight="700" fill="#065F46">四腳平均錯開,恆 3 腳著地 → 可以靜態穩定(門檻 3/4)</text>
  <g font-size="10" fill="#374151">
    <text x="52" y="112" text-anchor="end">LH</text><text x="52" y="134" text-anchor="end">LF</text>
    <text x="52" y="156" text-anchor="end">RH</text><text x="52" y="178" text-anchor="end">RF</text>
  </g>
  <g fill="#E5E7EB">
    <rect x="60" y="102" width="600" height="14" rx="3"/><rect x="60" y="124" width="600" height="14" rx="3"/>
    <rect x="60" y="146" width="600" height="14" rx="3"/><rect x="60" y="168" width="600" height="14" rx="3"/>
  </g>
  <g fill="#10B981">
    <rect x="60" y="102" width="450" height="14" rx="3"/>
    <rect x="210" y="124" width="450" height="14" rx="3"/>
    <rect x="360" y="146" width="300" height="14" rx="3"/><rect x="60" y="146" width="150" height="14" rx="3"/>
    <rect x="510" y="168" width="150" height="14" rx="3"/><rect x="60" y="168" width="300" height="14" rx="3"/>
  </g>
  <line x1="60" y1="96" x2="60" y2="188" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="660" y1="96" x2="660" y2="188" stroke="#9CA3AF" stroke-width="1"/>
  <text x="60" y="200" text-anchor="middle" font-size="9" fill="#6B7280">0%</text>
  <text x="660" y="200" text-anchor="middle" font-size="9" fill="#6B7280">100%</text>
  <text x="770" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065F46">沒有空檔</text>
  <text x="770" y="158" text-anchor="middle" font-size="9.5" fill="#374151">隨時停下也不會倒</text>

  <!-- trot -->
  <rect x="20" y="206" width="840" height="128" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.7"/>
  <text x="38" y="228" font-size="12.5" font-weight="700" fill="#991B1B">trot(對角小跑)</text>
  <text x="170" y="228" font-size="11" fill="#991B1B">duty factor ≈ 0.4</text>
  <text x="330" y="228" font-size="11" font-weight="700" fill="#991B1B">對角配對成 2 組,0.4 &lt; 1/2 → 必有飛行相</text>
  <g font-size="10" fill="#374151">
    <text x="52" y="252" text-anchor="end">LF</text><text x="52" y="274" text-anchor="end">RH</text>
    <text x="52" y="296" text-anchor="end">RF</text><text x="52" y="318" text-anchor="end">LH</text>
  </g>
  <g fill="#E5E7EB">
    <rect x="60" y="242" width="600" height="14" rx="3"/><rect x="60" y="264" width="600" height="14" rx="3"/>
    <rect x="60" y="286" width="600" height="14" rx="3"/><rect x="60" y="308" width="600" height="14" rx="3"/>
  </g>
  <g fill="#EF4444">
    <rect x="60" y="242" width="240" height="14" rx="3"/><rect x="60" y="264" width="240" height="14" rx="3"/>
    <rect x="360" y="286" width="240" height="14" rx="3"/><rect x="360" y="308" width="240" height="14" rx="3"/>
  </g>
  <rect x="300" y="236" width="60" height="90" fill="#DC2626" opacity="0.14"/>
  <rect x="600" y="236" width="60" height="90" fill="#DC2626" opacity="0.14"/>
  <text x="330" y="340" text-anchor="middle" font-size="9" font-weight="700" fill="#991B1B">飛行相</text>
  <text x="630" y="340" text-anchor="middle" font-size="9" font-weight="700" fill="#991B1B">飛行相</text>
  <line x1="60" y1="236" x2="60" y2="326" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="660" y1="236" x2="660" y2="326" stroke="#9CA3AF" stroke-width="1"/>
  <text x="770" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991B1B">四隻腳都在空中</text>
  <text x="770" y="296" text-anchor="middle" font-size="9.5" fill="#374151">停下來就倒</text>

  <rect x="20" y="346" width="840" height="44" rx="9" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="40" y="367" font-size="11.5" font-weight="700" fill="#374151">n 組等間隔錯開時,要恆有至少 k 組著地 ⟺ d ≥ k/n</text>
  <text x="330" y="367" font-size="10.5" fill="#374151">walk 是 n=4、k=3 → 0.75;trot 是 n=2、k=1 → 0.5;雙足同 0.5。飛行相是 k=1 的特例。</text>
  <text x="40" y="384" font-size="10.5" fill="#374151">所以「0.5 是走與跑的分界」對<tspan font-weight="700">雙足</tspan>是嚴格的幾何門檻,對<tspan font-weight="700">四足</tspan>則是動物步態分類上的統計性說法——實際門檻由相位怎麼排決定。</text>
</svg>
