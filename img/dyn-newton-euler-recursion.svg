<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ner-b" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ner-o" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EA580C"/></marker>
  </defs>
  <rect width="780" height="310" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Newton-Euler 遞迴:兩趟走完,O(n)</text>

  <!-- forward pass arrows (top) -->
  <text x="390" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">① 向外(基座 → 末端):累積速度、加速度</text>
  <path d="M150,88 C230,74 320,74 390,82" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ner-b)"/>
  <path d="M400,82 C470,76 540,78 600,88" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ner-b)"/>
  <text x="272" y="104" text-anchor="middle" font-size="11" fill="#1E40AF">Vᵢ = Vᵢ₋₁ 的貢獻 + θ̇ᵢ 的貢獻</text>

  <!-- chain -->
  <!-- base -->
  <rect x="70" y="130" width="56" height="56" fill="#F3F4F6" stroke="#374151" stroke-width="1.8"/>
  <text x="98" y="163" text-anchor="middle" font-size="12" fill="#374151">基座</text>
  <!-- link1 -->
  <circle cx="150" cy="158" r="11" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="150" y="162" text-anchor="middle" font-size="10" fill="#374151">1</text>
  <rect x="161" y="150" width="130" height="16" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <!-- link2 -->
  <circle cx="305" cy="158" r="11" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="305" y="162" text-anchor="middle" font-size="10" fill="#374151">2</text>
  <rect x="316" y="150" width="130" height="16" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <!-- link3 -->
  <circle cx="460" cy="158" r="11" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="460" y="162" text-anchor="middle" font-size="10" fill="#374151">3</text>
  <rect x="471" y="150" width="120" height="16" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <!-- end effector -->
  <path d="M595,144 l24,0 l0,10 l-14,0 l0,8 l14,0 l0,10 l-24,0 Z" fill="#F3F4F6" stroke="#374151" stroke-width="1.8"/>
  <text x="660" y="163" font-size="11.5" fill="#6B7280">末端</text>

  <!-- per-link Newton/Euler note -->
  <text x="390" y="204" text-anchor="middle" font-size="11.5" fill="#374151">每根連桿套 Newton + Euler:淨力 mᵢv̇ᵢ、淨力矩 ℐᵢω̇ᵢ + ωᵢ×ℐᵢωᵢ</text>

  <!-- backward pass arrows (bottom) -->
  <path d="M600,232 C540,242 470,244 400,238" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#ner-o)"/>
  <path d="M390,238 C320,246 230,246 150,232" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#ner-o)"/>
  <text x="390" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">② 向內(末端 → 基座):回收力與力矩,τᵢ = 沿關節軸的分量</text>
  <text x="500" y="224" text-anchor="middle" font-size="11" fill="#9A3412">fᵢ = fᵢ₊₁ + 本桿慣性力</text>

  <text x="390" y="292" text-anchor="middle" font-size="11" fill="#6B7280">重力的免費技巧:把基座設成「以 g 向上加速」,遞迴自動把重力帶給每一根連桿</text>
</svg>
