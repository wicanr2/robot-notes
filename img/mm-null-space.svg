<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">零空間:動了,但末端沒動</text>
  <text x="440" y="48" text-anchor="middle" font-size="12" fill="#6B7280">三張圖的夾爪停在同一點,底盤與手臂構型卻一直在變</text>

  <!-- Panel 1 -->
  <rect x="20" y="66" width="260" height="196" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="34" y1="252" x2="266" y2="252" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="42" y="234" width="56" height="18" rx="4" fill="#6B7280"/>
  <circle cx="52" cy="254" r="5" fill="#374151"/><circle cx="88" cy="254" r="5" fill="#374151"/>
  <g stroke="#3B82F6" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="70" y1="234" x2="70" y2="225"/>
    <line x1="70" y1="225" x2="118.9" y2="155.5"/>
    <line x1="118.9" y1="155.5" x2="200" y2="130"/>
  </g>
  <circle cx="118.9" cy="155.5" r="5.5" fill="#ffffff" stroke="#1E3A8A" stroke-width="2.2"/>
  <circle cx="200" cy="130" r="7" fill="#EF4444"/>
  <text x="212" y="126" font-size="9.5" font-weight="700" fill="#991B1B">夾爪</text>
  <text x="150" y="284" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">底盤靠左</text>

  <!-- Panel 2 -->
  <rect x="310" y="66" width="260" height="196" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="324" y1="252" x2="556" y2="252" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="392" y="234" width="56" height="18" rx="4" fill="#6B7280"/>
  <circle cx="402" cy="254" r="5" fill="#374151"/><circle cx="438" cy="254" r="5" fill="#374151"/>
  <g stroke="#3B82F6" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="420" y1="234" x2="420" y2="225"/>
    <line x1="420" y1="225" x2="405.7" y2="141.2"/>
    <line x1="405.7" y1="141.2" x2="490" y2="130"/>
  </g>
  <circle cx="405.7" cy="141.2" r="5.5" fill="#ffffff" stroke="#1E3A8A" stroke-width="2.2"/>
  <circle cx="490" cy="130" r="7" fill="#EF4444"/>
  <text x="502" y="126" font-size="9.5" font-weight="700" fill="#991B1B">夾爪</text>
  <text x="440" y="284" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">底盤置中</text>

  <!-- Panel 3 -->
  <rect x="600" y="66" width="260" height="196" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="614" y1="252" x2="846" y2="252" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="742" y="234" width="56" height="18" rx="4" fill="#6B7280"/>
  <circle cx="752" cy="254" r="5" fill="#374151"/><circle cx="788" cy="254" r="5" fill="#374151"/>
  <g stroke="#3B82F6" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="770" y1="234" x2="770" y2="225"/>
    <line x1="770" y1="225" x2="705.1" y2="170.1"/>
    <line x1="705.1" y1="170.1" x2="780" y2="130"/>
  </g>
  <circle cx="705.1" cy="170.1" r="5.5" fill="#ffffff" stroke="#1E3A8A" stroke-width="2.2"/>
  <circle cx="780" cy="130" r="7" fill="#EF4444"/>
  <text x="792" y="126" font-size="9.5" font-weight="700" fill="#991B1B">夾爪</text>
  <text x="730" y="284" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">底盤靠右</text>

  <!-- 分解式 -->
  <rect x="20" y="300" width="840" height="86" rx="9" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="40" y="324" font-size="13" font-weight="700" fill="#9A3412">q̇ = J⁺ ẋ + ( I − J⁺J ) z</text>
  <text x="252" y="324" font-size="10.5" fill="#374151">通解 = 特解 + 齊次解,線性代數對欠定方程組的標準形式</text>
  <line x1="46" y1="332" x2="106" y2="332" stroke="#10B981" stroke-width="2"/>
  <text x="46" y="348" font-size="9.5" font-weight="700" fill="#065F46">把末端送到要去的地方</text>
  <line x1="122" y1="332" x2="232" y2="332" stroke="#3B82F6" stroke-width="2"/>
  <text x="122" y="366" font-size="9.5" font-weight="700" fill="#1E3A8A">零空間投影:乘完保證 J·(結果) = 0,末端完全不動</text>
  <text x="440" y="348" font-size="10.5" fill="#374151"><tspan font-weight="700">z 是自由的設計變數</tspan>——想遠離奇異就令 z = ∇w,想避開關節極限就指向各軸中位。</text>
  <text x="440" y="366" font-size="10.5" fill="#374151">主任務不受影響,因為那一項被投影掉了。這是冗餘控制最核心的一招。</text>
</svg>
