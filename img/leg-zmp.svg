<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="zpG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10B981"/></marker>
    <marker id="zpR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#DC2626"/></marker>
  </defs>
  <rect width="840" height="370" fill="#ffffff"/>
  <text x="420" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">ZMP:地面只能推、不能拉</text>
  <text x="420" y="48" text-anchor="middle" font-size="12" fill="#6B7280">所以合力作用點必然落在接觸面內——算出來跑到外面,現實的解法就是腳翻起來</text>

  <!-- 左:ZMP 在腳內 -->
  <rect x="20" y="68" width="390" height="200" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7"/>
  <text x="215" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">ZMP 落在接觸面內</text>
  <line x1="60" y1="228" x2="370" y2="228" stroke="#9CA3AF" stroke-width="2.5"/>
  <rect x="150" y="218" width="130" height="10" rx="3" fill="#374151"/>
  <text x="215" y="248" text-anchor="middle" font-size="9.5" fill="#374151">腳掌接觸面</text>
  <line x1="215" y1="218" x2="215" y2="140" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
  <circle cx="215" cy="132" r="12" fill="#065F46"/>
  <text x="215" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065F46">重心</text>
  <g stroke="#10B981" stroke-width="2">
    <line x1="162" y1="218" x2="162" y2="204" marker-end="url(#zpG)"/>
    <line x1="182" y1="218" x2="182" y2="196" marker-end="url(#zpG)"/>
    <line x1="202" y1="218" x2="202" y2="190" marker-end="url(#zpG)"/>
    <line x1="222" y1="218" x2="222" y2="192" marker-end="url(#zpG)"/>
    <line x1="242" y1="218" x2="242" y2="199" marker-end="url(#zpG)"/>
    <line x1="262" y1="218" x2="262" y2="208" marker-end="url(#zpG)"/>
  </g>
  <text x="300" y="196" font-size="9.5" fill="#065F46">壓力分佈,每一處都 ≥ 0</text>
  <circle cx="208" cy="228" r="6" fill="#EF4444"/>
  <text x="208" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">ZMP</text>

  <!-- 右:ZMP 跑到腳外 -->
  <rect x="430" y="68" width="390" height="200" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.7"/>
  <text x="625" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">算出來的作用點跑到面外</text>
  <line x1="470" y1="228" x2="800" y2="228" stroke="#9CA3AF" stroke-width="2.5"/>
  <line x1="534" y1="196" x2="660" y2="228" stroke="#374151" stroke-width="10" stroke-linecap="round"/>
  <circle cx="660" cy="228" r="7" fill="#ffffff" stroke="#DC2626" stroke-width="2.5"/>
  <text x="660" y="252" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">前緣(支點)</text>
  <line x1="534" y1="186" x2="534" y2="160" stroke="#DC2626" stroke-width="2.4" marker-end="url(#zpR)"/>
  <text x="534" y="150" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">腳跟抬起</text>
  <line x1="665" y1="222" x2="698" y2="140" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
  <circle cx="700" cy="132" r="12" fill="#991B1B"/>
  <text x="700" y="114" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">重心</text>
  <circle cx="730" cy="228" r="6" fill="#EF4444"/>
  <text x="746" y="212" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991B1B">算出的作用點</text>
  <text x="746" y="252" text-anchor="middle" font-size="9.5" fill="#991B1B">已在接觸面外</text>
  <text x="600" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">現實不會產生「拉力」</text>
  <text x="600" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">只會繞邊緣旋轉</text>
  <text x="600" y="262" text-anchor="middle" font-size="9.5" fill="#374151">腳掌繞前緣翻起來</text>

  <!-- 底 -->
  <rect x="20" y="282" width="800" height="76" rx="9" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="40" y="304" font-size="11.5" font-weight="700" fill="#374151">判準:ZMP 落在支撐多邊形內 ⟺ 腳掌不會繞自己的邊緣翻起來</text>
  <text x="40" y="326" font-size="10.5" fill="#374151">比靜態判準進步的地方:ZMP 把加速度算進去了——看的是重力加慣性力的合效果,所以動起來也適用。</text>
  <text x="40" y="348" font-size="10.5" font-weight="700" fill="#991B1B">但它只保證這一件事。腳貼得好好的、ZMP 完全合法,整台機器還是可以往前傾倒;而且飛行相沒有接觸面,ZMP 無從定義。</text>
</svg>
