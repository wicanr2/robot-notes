<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">推挽 vs Open-drain:輸出腳到底有沒有「力氣」</text>
  <text x="480" y="50" text-anchor="middle" font-size="12.5" fill="#6B7280">同一支輸出腳,拿掉上管會發生什麼事——I²C、霍爾、故障線接線的起點</text>

  <line x1="480" y1="68" x2="480" y2="500" stroke="#E5E7EB"/>

  <!-- ===================== LEFT: push-pull ===================== -->
  <text x="250" y="84" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1E3A8A">推挽輸出(push-pull)</text>

  <!-- VCC rail -->
  <text x="150" y="98" text-anchor="middle" font-size="11.5" fill="#6B7280">VCC</text>
  <line x1="150" y1="102" x2="150" y2="140" stroke="#3B82F6" stroke-width="2"/>

  <!-- upper transistor (PMOS) -->
  <circle cx="150" cy="160" r="20" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <line x1="150" y1="146" x2="150" y2="174" stroke="#1E3A8A" stroke-width="3.5"/>
  <line x1="138" y1="150" x2="138" y2="170" stroke="#1E3A8A" stroke-width="2.2"/>
  <line x1="122" y1="160" x2="138" y2="160" stroke="#1E3A8A" stroke-width="1.6"/>
  <text x="176" y="149" font-size="9.5" fill="#6B7280">D</text>
  <text x="176" y="178" font-size="9.5" fill="#6B7280">S</text>
  <text x="112" y="163" text-anchor="end" font-size="9.5" fill="#6B7280">G</text>
  <text x="150" y="197" text-anchor="middle" font-size="9.5" fill="#1E3A8A">PMOS</text>

  <line x1="170" y1="160" x2="266" y2="160" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3,3"/>
  <rect x="266" y="132" width="190" height="56" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="286" y="151" font-size="12.5" font-weight="700" fill="#1E3A8A">輸出 = 1</text>
  <text x="286" y="168" font-size="12" fill="#1F2937">→ 上管導通</text>
  <text x="286" y="184" font-size="12" fill="#1F2937">→ 主動推到 VCC</text>

  <!-- output node -->
  <line x1="150" y1="180" x2="150" y2="210" stroke="#1F2937" stroke-width="2"/>
  <circle cx="150" cy="210" r="4" fill="#1F2937"/>
  <line x1="150" y1="210" x2="190" y2="210" stroke="#1F2937" stroke-width="2"/>
  <circle cx="196" cy="210" r="5" fill="#ffffff" stroke="#1F2937" stroke-width="1.8"/>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#1F2937">輸出腳</text>

  <line x1="150" y1="210" x2="150" y2="240" stroke="#1F2937" stroke-width="2"/>

  <!-- lower transistor (NMOS) -->
  <circle cx="150" cy="260" r="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <line x1="150" y1="246" x2="150" y2="274" stroke="#991B1B" stroke-width="3.5"/>
  <line x1="138" y1="250" x2="138" y2="270" stroke="#991B1B" stroke-width="2.2"/>
  <line x1="122" y1="260" x2="138" y2="260" stroke="#991B1B" stroke-width="1.6"/>
  <text x="176" y="249" font-size="9.5" fill="#6B7280">D</text>
  <text x="176" y="278" font-size="9.5" fill="#6B7280">S</text>
  <text x="112" y="263" text-anchor="end" font-size="9.5" fill="#6B7280">G</text>
  <text x="150" y="297" text-anchor="middle" font-size="9.5" fill="#991B1B">NMOS</text>

  <line x1="170" y1="260" x2="266" y2="260" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3,3"/>
  <rect x="266" y="232" width="190" height="56" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="286" y="251" font-size="12.5" font-weight="700" fill="#991B1B">輸出 = 0</text>
  <text x="286" y="268" font-size="12" fill="#1F2937">→ 下管導通</text>
  <text x="286" y="284" font-size="12" fill="#1F2937">→ 主動拉到 GND</text>

  <!-- GND -->
  <line x1="150" y1="280" x2="150" y2="310" stroke="#991B1B" stroke-width="2"/>
  <line x1="138" y1="310" x2="162" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="142" y1="315" x2="158" y2="315" stroke="#374151" stroke-width="2"/>
  <line x1="146" y1="320" x2="154" y2="320" stroke="#374151" stroke-width="2"/>
  <text x="150" y="336" text-anchor="middle" font-size="11.5" fill="#6B7280">GND</text>

  <!-- bottom chips -->
  <rect x="60" y="398" width="180" height="46" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="150" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">輸出=1 → 腳位=VCC</text>
  <text x="150" y="434" text-anchor="middle" font-size="11" fill="#065F46">(強推,有力氣)</text>

  <rect x="260" y="398" width="180" height="46" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="350" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">輸出=0 → 腳位=GND</text>
  <text x="350" y="434" text-anchor="middle" font-size="11" fill="#065F46">(強拉,有力氣)</text>

  <text x="250" y="470" text-anchor="middle" font-size="11.5" fill="#374151">兩種狀態都「有力氣」——高是實實在在的 VCC,低是實實在在的 GND</text>
  <text x="250" y="486" text-anchor="middle" font-size="11" fill="#6B7280">STM32 GPIO 預設就是這種</text>

  <!-- ===================== RIGHT: open-drain ===================== -->
  <text x="730" y="84" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9A3412">Open-drain 輸出(開漏)</text>

  <!-- VCC rail (ghost, stops short - no upper transistor) -->
  <text x="630" y="98" text-anchor="middle" font-size="11.5" fill="#9CA3AF">VCC</text>
  <line x1="630" y1="102" x2="630" y2="140" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ghost upper transistor (removed) -->
  <circle cx="630" cy="160" r="20" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="618" y1="148" x2="642" y2="172" stroke="#CBD5E1" stroke-width="2.2"/>
  <line x1="642" y1="148" x2="618" y2="172" stroke="#CBD5E1" stroke-width="2.2"/>

  <line x1="650" y1="160" x2="746" y2="160" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="3,3"/>
  <rect x="746" y="132" width="190" height="56" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="766" y="151" font-size="12.5" font-weight="700" fill="#6B7280">(沒有上管!)</text>
  <text x="766" y="168" font-size="11.5" fill="#6B7280">「open」= 沒接負載</text>
  <text x="766" y="184" font-size="11.5" fill="#6B7280">由外部電路決定電位</text>

  <!-- output node: gap above (nothing connects up) = floating -->
  <circle cx="630" cy="210" r="4" fill="#1F2937"/>
  <line x1="630" y1="210" x2="670" y2="210" stroke="#1F2937" stroke-width="2"/>
  <circle cx="676" cy="210" r="5" fill="#ffffff" stroke="#1F2937" stroke-width="1.8"/>
  <text x="630" y="228" text-anchor="middle" font-size="11" fill="#1F2937">輸出腳</text>

  <line x1="650" y1="210" x2="746" y2="207" stroke="#F97316" stroke-width="1.3" stroke-dasharray="3,3"/>
  <rect x="746" y="190" width="190" height="34" rx="7" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="766" y="203" font-size="12" font-weight="700" fill="#9A3412">輸出 = 1 → 浮空</text>
  <text x="766" y="217" font-size="10.5" fill="#9A3412">沒力氣,電位不定</text>

  <line x1="630" y1="210" x2="630" y2="240" stroke="#1F2937" stroke-width="2"/>

  <!-- lower transistor (NMOS) - identical role to left -->
  <circle cx="630" cy="260" r="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <line x1="630" y1="246" x2="630" y2="274" stroke="#991B1B" stroke-width="3.5"/>
  <line x1="618" y1="250" x2="618" y2="270" stroke="#991B1B" stroke-width="2.2"/>
  <line x1="602" y1="260" x2="618" y2="260" stroke="#991B1B" stroke-width="1.6"/>
  <text x="656" y="249" font-size="9.5" fill="#6B7280">D</text>
  <text x="656" y="278" font-size="9.5" fill="#6B7280">S</text>
  <text x="592" y="263" text-anchor="end" font-size="9.5" fill="#6B7280">G</text>
  <text x="630" y="297" text-anchor="middle" font-size="9.5" fill="#991B1B">NMOS</text>

  <line x1="650" y1="260" x2="746" y2="260" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3,3"/>
  <rect x="746" y="232" width="190" height="56" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="766" y="251" font-size="12.5" font-weight="700" fill="#991B1B">輸出 = 0</text>
  <text x="766" y="268" font-size="12" fill="#1F2937">→ 下管導通</text>
  <text x="766" y="284" font-size="12" fill="#1F2937">→ 拉到 GND(有力氣)</text>

  <!-- GND -->
  <line x1="630" y1="280" x2="630" y2="310" stroke="#991B1B" stroke-width="2"/>
  <line x1="618" y1="310" x2="642" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="622" y1="315" x2="638" y2="315" stroke="#374151" stroke-width="2"/>
  <line x1="626" y1="320" x2="634" y2="320" stroke="#374151" stroke-width="2"/>
  <text x="630" y="336" text-anchor="middle" font-size="11.5" fill="#6B7280">GND</text>

  <!-- bottom chips -->
  <rect x="540" y="398" width="180" height="46" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="630" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">輸出=0 → 腳位=GND</text>
  <text x="630" y="434" text-anchor="middle" font-size="11" fill="#065F46">(有力氣)</text>

  <rect x="740" y="398" width="180" height="46" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="830" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">輸出=1 → 浮空</text>
  <text x="830" y="434" text-anchor="middle" font-size="11" fill="#991B1B">(沒力氣,電位不定)</text>

  <text x="730" y="470" text-anchor="middle" font-size="11.5" fill="#374151">「drain」沒接負載、開放著——</text>
  <text x="730" y="486" text-anchor="middle" font-size="11" fill="#6B7280">電位由外部電路(下拉/上拉)決定</text>

  <!-- footer -->
  <line x1="80" y1="508" x2="880" y2="508" stroke="#F3F4F6" stroke-width="1.5"/>
  <text x="480" y="530" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9A3412">↓ 下一張圖:接上拉電阻,把 open-drain 的「1」補回力氣</text>
</svg>
