    <text x="196" y="176" font-size="11.5" font-weight="700" fill="#2563EB">滿載</text>
    <text x="210" y="292" text-anchor="middle" font-size="11.5" fill="#047857">兩條都收斂到同一條線,快慢不同而已</text>
    <text x="210" y="311" text-anchor="middle" font-size="11.5" fill="#6B7280">控制器只需要知道「誤差往哪邊、多大」</text>
