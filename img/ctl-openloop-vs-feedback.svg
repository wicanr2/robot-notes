  <defs><marker id="ov-a" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker></defs>
  <rect width="828" height="360" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">回授的價值不是「更準」,是「不需要準」</text>
  <text x="410" y="47" text-anchor="middle" font-size="12" fill="#6B7280">同一個指令「走 1 m/s」,空車 2 t 與滿載 3.5 t 的結果</text>

  <!-- ===== 左:開環 ===== -->
  <text x="210" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">開環:算好電壓送出去,不看結果</text>
