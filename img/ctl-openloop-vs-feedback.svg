  <text x="250" y="205" font-size="11.5" font-weight="700" fill="#2563EB">滿載:只到 0.62</text>
  <text x="210" y="292" text-anchor="middle" font-size="11.5" fill="#B45309">兩條都穩了,但都穩在錯的地方</text>
  <text x="210" y="311" text-anchor="middle" font-size="11.5" fill="#6B7280">要準,就得事先知道載重、坡度、地面、電池、溫度</text>

