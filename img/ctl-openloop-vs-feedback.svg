  <line x1="410" y1="70" x2="410" y2="320" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="410" y="338" text-anchor="middle" font-size="11.5" fill="#374151">回授只能修正「已經發生」的偏差 → 必然落後;已知會發生的事該用前饋先補</text>
</svg>
