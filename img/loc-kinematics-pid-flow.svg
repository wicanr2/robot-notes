<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="kp-a" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <marker id="kp-o" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="640" height="290" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">運動學解算 vs PID:不同層次,上下游關係</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#6B7280">運動學算「目標」(開環幾何);PID 追「目標」(閉環回授)</text>

  <!-- input -->
  <text x="55" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">(v, ω)</text>
  <line x1="82" y1="122" x2="123" y2="122" stroke="#374151" stroke-width="1.8" marker-end="url(#kp-a)"/>

  <!-- box1: kinematics -->
  <rect x="125" y="95" width="140" height="55" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="195" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">運動學逆解</text>
  <text x="195" y="134" text-anchor="middle" font-size="10" fill="#1E40AF">算出目標(開環・無回授)</text>

  <line x1="265" y1="122" x2="305" y2="122" stroke="#374151" stroke-width="1.8" marker-end="url(#kp-a)"/>
  <text x="285" y="110" text-anchor="middle" font-size="10" fill="#374151">目標輪速</text>

  <!-- box2: PID -->
  <rect x="307" y="95" width="140" height="55" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="377" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">PID</text>
  <text x="377" y="134" text-anchor="middle" font-size="10" fill="#9A3412">達成目標(閉環・靠回授)</text>

  <line x1="447" y1="122" x2="487" y2="122" stroke="#374151" stroke-width="1.8" marker-end="url(#kp-a)"/>
  <text x="515" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">馬達</text>

  <!-- feedback loop: encoder measures 馬達, closes loop only around PID -->
  <path d="M515,150 L515,205 L377,205 L377,152" fill="none" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#kp-o)"/>
  <text x="446" y="219" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">encoder 實測 → 回授誤差</text>

  <text x="320" y="256" text-anchor="middle" font-size="11.5" fill="#374151">運動學算錯,PID 只會很努力追一個錯的目標——車照樣走歪</text>
  <text x="320" y="274" text-anchor="middle" font-size="10" fill="#6B7280">(運動學正確的前提:輪徑、輪距標定準確)</text>
</svg>
