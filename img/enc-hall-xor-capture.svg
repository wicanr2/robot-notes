<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="hx1" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="hx2" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/></marker>
    <marker id="hxd" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#9A3412"/></marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">Timer 霍爾感測器介面:三路硬體 XOR 進 TI1,用 Input Capture 直接量出翻轉間隔</text>

  <!-- HA/HB/HC lines -->
  <text x="42" y="119" text-anchor="end" font-size="13" font-weight="700" fill="#1E3A8A">HA</text>
  <text x="42" y="154" text-anchor="end" font-size="13" font-weight="700" fill="#1E3A8A">HB</text>
  <text x="42" y="189" text-anchor="end" font-size="13" font-weight="700" fill="#1E3A8A">HC</text>
  <line x1="50" y1="115" x2="220" y2="115" stroke="#374151" stroke-width="2"/>
  <line x1="50" y1="150" x2="220" y2="150" stroke="#374151" stroke-width="2"/>
  <line x1="50" y1="185" x2="220" y2="185" stroke="#374151" stroke-width="2"/>

  <!-- XOR box -->
  <rect x="220" y="90" width="95" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="267" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">XOR</text>
  <text x="267" y="165" text-anchor="middle" font-size="10.5" fill="#1E3A8A">(硬體,三路)</text>

  <!-- output to TI1 -->
  <line x1="315" y1="150" x2="365" y2="150" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#hx1)"/>
  <text x="340" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">TI1</text>

  <!-- capture box -->
  <rect x="365" y="68" width="255" height="205" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="492" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">TIM4 Input Capture</text>
  <text x="492" y="106" text-anchor="middle" font-size="11" fill="#991B1B">(Reset 觸發模式)</text>
  <text x="492" y="130" text-anchor="middle" font-size="11.5" fill="#374151">任一路訊號翻轉,同時發生:</text>

  <text x="385" y="152" font-size="12" font-weight="700" fill="#991B1B">① capture 暫存器</text>
  <text x="385" y="168" font-size="11" fill="#1F2937">= 距上次翻轉的時間 Δt</text>
  <text x="385" y="183" font-size="11" fill="#1F2937">→ 直接得到速度</text>

  <text x="385" y="205" font-size="12" font-weight="700" fill="#991B1B">② counter 歸零</text>
  <text x="385" y="221" font-size="11" fill="#1F2937">重新開始計時,量下一段</text>

  <!-- mini waveform: edge ... Δt ... edge -->
  <polyline points="385,252 385,238 405,238 405,252 462,252 462,238 482,238 482,252 605,252" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="405" y1="260" x2="462" y2="260" stroke="#9A3412" stroke-width="1.4" marker-start="url(#hxd)" marker-end="url(#hxd)"/>
  <text x="433" y="272" text-anchor="middle" font-size="10.5" fill="#9A3412">Δt</text>

  <!-- output to speed result -->
  <line x1="620" y1="150" x2="655" y2="150" stroke="#10B981" stroke-width="2.2" marker-end="url(#hx2)"/>

  <rect x="657" y="105" width="145" height="92" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <text x="730" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">速度 =</text>
  <text x="730" y="150" text-anchor="middle" font-size="11.5" fill="#065F46">60°電氣角 ÷ Δt</text>
  <text x="730" y="170" text-anchor="middle" font-size="11" fill="#065F46">÷ 極對數</text>
  <text x="730" y="186" text-anchor="middle" font-size="11" fill="#065F46">→ 機械角速度 ω</text>

  <!-- API note -->
  <rect x="40" y="292" width="740" height="42" rx="8" fill="#F3F4F6" stroke="#94A3B8"/>
  <text x="410" y="317" text-anchor="middle" font-size="12" fill="#374151">HAL_TIMEx_HallSensor_Init() = 設定 TIM_TI1SELECTION_XORCOMBINATION ＋ Reset 觸發模式</text>

  <!-- cross-reference note -->
  <rect x="40" y="342" width="740" height="30" rx="6" fill="#FFF7ED" stroke="#F97316"/>
  <text x="410" y="362" text-anchor="middle" font-size="11.5" fill="#9A3412">這是 T 法測速(量翻轉間隔時間);低速時比數脈衝準,原因見「M 法 vs T 法」圖</text>
</svg>
