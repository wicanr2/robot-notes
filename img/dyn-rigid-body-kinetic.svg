<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="rbk-b" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="rbk-o" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EA580C"/></marker>
  </defs>
  <rect width="740" height="300" fill="#ffffff"/>
  <text x="370" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">剛體動能 = 質心平移 + 繞質心旋轉</text>

  <!-- LEFT: blob with v and omega -->
  <path d="M90,130 C95,95 150,80 190,95 C230,108 245,140 228,170 C210,200 140,205 110,185 C86,169 85,152 90,130 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/>
  <circle cx="160" cy="145" r="4.5" fill="#1F2937"/>
  <text x="160" y="167" text-anchor="middle" font-size="11" fill="#374151">質心</text>
  <!-- v arrow -->
  <line x1="160" y1="145" x2="255" y2="118" stroke="#2563EB" stroke-width="2.6" marker-end="url(#rbk-b)"/>
  <text x="262" y="112" font-size="13" font-weight="700" fill="#1E40AF">v_c</text>
  <!-- omega arc -->
  <path d="M126,112 A48 48 0 0 1 199,105" fill="none" stroke="#EA580C" stroke-width="2.4" marker-end="url(#rbk-o)"/>
  <text x="158" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">ω</text>
  <!-- formula -->
  <text x="168" y="238" text-anchor="middle" font-size="14" fill="#374151">T = <tspan font-weight="700" fill="#1E40AF">½m‖v_c‖²</tspan> + <tspan font-weight="700" fill="#9A3412">½ωᵀℐω</tspan></text>
  <text x="115" y="260" text-anchor="middle" font-size="11" fill="#1E40AF">平移:跟質點一樣</text>
  <text x="248" y="260" text-anchor="middle" font-size="11" fill="#9A3412">旋轉:由慣性張量 ℐ 決定</text>
  <text x="168" y="282" text-anchor="middle" font-size="10.5" fill="#6B7280">參考點挑質心,交叉項才會恰好消失</text>

  <!-- divider -->
  <line x1="380" y1="48" x2="380" y2="282" stroke="#E5E7EB"/>

  <!-- RIGHT: same mass, near vs far from axis -->
  <text x="560" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">同樣的質量,ℐ 看它離軸多遠</text>
  <!-- same bar, spun about its long axis -->
  <line x1="470" y1="78" x2="470" y2="185" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="462" y="88" width="16" height="88" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <path d="M448,80 A38 22 0 0 1 495,82" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#rbk-b)"/>
  <text x="470" y="205" text-anchor="middle" font-size="11.5" fill="#1E40AF">同一根棒,繞長軸轉:質量貼著軸</text>
  <text x="470" y="221" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">ℐ 小,轉得輕鬆</text>
  <!-- same bar, spun broadside -->
  <line x1="640" y1="78" x2="640" y2="185" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="592" y="120" width="96" height="16" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
  <path d="M615,88 A42 26 0 0 1 668,90" fill="none" stroke="#EA580C" stroke-width="1.8" marker-end="url(#rbk-o)"/>
  <text x="640" y="205" text-anchor="middle" font-size="11.5" fill="#9A3412">同一根棒,橫著轉:質量離軸遠</text>
  <text x="640" y="221" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">ℐ 大,轉得費力</text>
  <text x="560" y="252" text-anchor="middle" font-size="12" fill="#374151">ℐ_xx = ∫ρ(y²+z²)dV:離軸距離的平方加權</text>
  <text x="560" y="272" text-anchor="middle" font-size="10.5" fill="#6B7280">方向不同答案不同,所以是 3×3 矩陣不是一個數</text>
</svg>
