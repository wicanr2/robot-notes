<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="ap-o" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2937">AprilTag 透視變形:正對 vs 斜看</text>
  <text x="380" y="44" text-anchor="middle" font-size="12" fill="#6B7280">相機看到的角點形狀,帶著相機相對標記的角度資訊</text>

  <!-- left: frontal -->
  <text x="210" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">正對著看</text>
  <rect x="70" y="78" width="280" height="210" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/>
  <rect x="150" y="118" width="120" height="120" fill="#111827"/>
  <rect x="162" y="130" width="96" height="96" fill="#ffffff"/>
  <g fill="#F97316" stroke="#ffffff" stroke-width="1.2">
    <circle cx="150" cy="118" r="4.5"/><circle cx="270" cy="118" r="4.5"/>
    <circle cx="270" cy="238" r="4.5"/><circle cx="150" cy="238" r="4.5"/>
  </g>
  <text x="138" y="112" text-anchor="end" font-size="10" fill="#9A3412">p1</text>
  <text x="282" y="112" font-size="10" fill="#9A3412">p2</text>
  <text x="282" y="250" font-size="10" fill="#9A3412">p3</text>
  <text x="138" y="250" text-anchor="end" font-size="10" fill="#9A3412">p4</text>
  <text x="210" y="306" text-anchor="middle" font-size="11.5" fill="#374151">4 個角點對稱</text>

  <!-- right: oblique -->
  <text x="550" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">從右側斜看</text>
  <rect x="410" y="78" width="280" height="210" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4"/>
  <polygon points="490,135 610,110 610,246 490,221" fill="#111827"/>
  <polygon points="502.0,143.6 598.0,123.6 598.0,232.4 502.0,212.4" fill="#ffffff"/>
  <g fill="#F97316" stroke="#ffffff" stroke-width="1.2">
    <circle cx="490" cy="135" r="4.5"/><circle cx="610" cy="110" r="4.5"/>
    <circle cx="610" cy="246" r="4.5"/><circle cx="490" cy="221" r="4.5"/>
  </g>
  <text x="478" y="129" text-anchor="end" font-size="10" fill="#9A3412">p1</text>
  <text x="620" y="105" font-size="10" fill="#9A3412">p2</text>
  <text x="620" y="252" font-size="10" fill="#9A3412">p3</text>
  <text x="478" y="227" text-anchor="end" font-size="10" fill="#9A3412">p4</text>
  <text x="452" y="180" text-anchor="middle" font-size="9.5" fill="#6B7280">遠</text>
  <text x="638" y="180" text-anchor="middle" font-size="9.5" fill="#6B7280">近</text>
  <text x="550" y="306" text-anchor="middle" font-size="11.5" fill="#374151">4 個角點呈梯形 → 歪多少角度,算得出來</text>

  <!-- converge arrows -->
  <line x1="210" y1="314" x2="210" y2="332" stroke="#F97316" stroke-width="1.8" marker-end="url(#ap-o)"/>
  <line x1="550" y1="314" x2="550" y2="332" stroke="#F97316" stroke-width="1.8" marker-end="url(#ap-o)"/>

  <!-- summary -->
  <rect x="90" y="336" width="580" height="48" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="380" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">已知標記邊長 s + 相機內參 K,配合四角點的變形量</text>
  <text x="380" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">→ PnP 解出相機相對標記的完整旋轉 R + 平移 t(6-DOF)</text>
</svg>
