<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="rpyA" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker>
    <marker id="rpyR" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#DC2626"/></marker>
    <marker id="rpyB" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#2563EB"/></marker>
    <marker id="rpyG" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#059669"/></marker>
  </defs>
  <rect width="880" height="344" fill="#ffffff"/>
  <text x="440" y="27" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">roll / pitch / yaw 就是繞 x / y / z 三根軸的轉動</text>
  <text x="440" y="47" text-anchor="middle" font-size="11.5" fill="#6B7280">軸向由 REP-103 定死了,這三個名字就不必另外背。三格的弧線畫的都是<tspan font-weight="700" fill="#374151">正方向</tspan></text>

  <!-- 軸向 -->
  <rect x="20" y="64" width="212" height="196" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.6"/>
  <text x="126" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">REP-103 車體軸向(俯視)</text>
  <rect x="96" y="158" width="70" height="34" rx="6" fill="#D1D5DB" stroke="#6B7280" stroke-width="1.4"/>
  <path d="M166,168 L178,175 L166,182 Z" fill="#6B7280"/>
  <line x1="131" y1="175" x2="212" y2="175" stroke="#DC2626" stroke-width="2.2" marker-end="url(#rpyR)"/>
  <text x="206" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">x 朝前</text>
  <line x1="131" y1="175" x2="131" y2="108" stroke="#2563EB" stroke-width="2.2" marker-end="url(#rpyB)"/>
  <text x="131" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">y 朝左</text>
  <circle cx="131" cy="175" r="8" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
  <circle cx="131" cy="175" r="2.6" fill="#059669"/>
  <text x="72" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">z 朝上</text>
  <text x="72" y="160" text-anchor="middle" font-size="9" fill="#6B7280">(指向頁面外)</text>
  <text x="126" y="232" text-anchor="middle" font-size="9.5" fill="#6B7280">右手系,角度以逆時針為正</text>
  <text x="126" y="248" text-anchor="middle" font-size="9.5" fill="#6B7280">長度公尺、角度弧度</text>

  <!-- roll -->
  <rect x="246" y="64" width="200" height="196" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
  <text x="346" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">roll(側傾)</text>
  <text x="346" y="102" text-anchor="middle" font-size="10" fill="#991B1B">繞 x — 後視圖</text>
  <line x1="272" y1="212" x2="420" y2="212" stroke="#9CA3AF" stroke-width="2.2"/>
  <rect x="312" y="168" width="68" height="30" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>
  <g transform="rotate(-19 346 183)">
    <rect x="312" y="168" width="68" height="30" rx="5" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.7"/>
  </g>
  <path d="M382,143 A 40 40 0 0 0 310,143" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#rpyR)"/>
  <circle cx="346" cy="183" r="7" fill="#ffffff" stroke="#DC2626" stroke-width="2"/>
  <circle cx="346" cy="183" r="2.4" fill="#DC2626"/>
  <text x="346" y="232" text-anchor="middle" font-size="10.5" fill="#374151">車身左右歪</text>
  <text x="346" y="248" text-anchor="middle" font-size="9.5" fill="#6B7280">輪式車幾乎恆為 0</text>

  <!-- pitch -->
  <rect x="460" y="64" width="200" height="196" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="560" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1D4ED8">pitch(俯仰)</text>
  <text x="560" y="102" text-anchor="middle" font-size="10" fill="#1D4ED8">繞 y — 側視圖</text>
  <line x1="486" y1="212" x2="634" y2="212" stroke="#9CA3AF" stroke-width="2.2"/>
  <rect x="522" y="168" width="76" height="28" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>
  <g transform="rotate(17 560 182)">
    <rect x="522" y="168" width="76" height="28" rx="5" fill="#93C5FD" stroke="#2563EB" stroke-width="1.7"/>
    <path d="M598,175 L610,182 L598,189 Z" fill="#2563EB"/>
  </g>
  <path d="M524,143 A 40 40 0 0 1 596,143" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#rpyB)"/>
  <circle cx="560" cy="182" r="7" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
  <circle cx="560" cy="182" r="2.4" fill="#2563EB"/>
  <text x="560" y="232" text-anchor="middle" font-size="10.5" fill="#374151">車頭上下點</text>
  <text x="560" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1D4ED8">正的 pitch 是車頭往下</text>
  

  <!-- yaw -->
  <rect x="674" y="64" width="186" height="196" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="767" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">yaw(偏航)</text>
  <text x="767" y="102" text-anchor="middle" font-size="10" fill="#065F46">繞 z — 俯視圖</text>
  <rect x="731" y="168" width="72" height="30" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>
  <g transform="rotate(-27 767 183)">
    <rect x="731" y="168" width="72" height="30" rx="5" fill="#6EE7B7" stroke="#059669" stroke-width="1.7"/>
    <path d="M803,176 L815,183 L803,190 Z" fill="#059669"/>
  </g>
  <path d="M803,145 A 40 40 0 0 0 731,145" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#rpyG)"/>
  <circle cx="767" cy="183" r="7" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <circle cx="767" cy="183" r="2.4" fill="#059669"/>
  <text x="767" y="232" text-anchor="middle" font-size="10.5" fill="#374151">原地轉向</text>
  <text x="767" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065F46">輪式車唯一會變的角度</text>

  <rect x="20" y="272" width="840" height="58" rx="9" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="40" y="294" font-size="11.5" font-weight="700" fill="#374151">三格最下面那一行說的都是輪式車——而那正好解釋了為什麼平面機器人只講 (x, y, yaw)</text>
  <text x="40" y="316" font-size="10.5" fill="#374151">roll 與 pitch 當常數處理不會出大錯,所以估計器只要追三個量。足式的軀幹<tspan font-weight="700">六個自由度(3 位置 + 3 姿態)全都在動</tspan>,一個都不能省——這就是兩者在狀態估計上的分水嶺。</text>
</svg>
